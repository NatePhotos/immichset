# Every setting as an environment variable, for people who prefer that to the setup page.
# Anything set here always wins over what the setup page or Connections saved. For the short version
# (just the image, a port and a volume) see docker-compose.quickstart.yml.
# Copy to docker-compose.yml and fill in. Never commit the filled-in file.
name: immichset

services:
  app:
    container_name: immichset
    image: node:26-alpine
    working_dir: /app
    command: node server.mjs
    volumes:
      - /path/to/immichset:/app:ro          # this repo
      - immichset-data:/data                # sqlite lives here
      - /path/to/backups:/backups           # nightly database copies
    environment:
      # --- core ---
      PORT: "3000"
      DATA_DIR: "/data"
      WEB_DIR: "/app/web"
      TZ: "America/New_York"
      PUBLIC_URL: "https://galleries.example.com"   # what clients see; links are built from it

      # --- Immich ---
      IMMICH_URL: "http://immich-server:2283"
      IMMICH_API_KEY: ""      # create a READ-ONLY key: asset/album/timeline read + download

      # Optional. Only set this to manage photos from the admin panel.
      # A SECOND key: asset.upload, album.create, albumAsset.create to add photos,
      # plus asset.delete and albumAsset.delete to remove them. Grant only the half
      # you want. Leave it empty and the Photos tab stays off; the rest is read-only.
      IMMICH_WRITE_KEY: ""
      UPLOAD_MAX_MB: "250"          # per photo
      UPLOAD_MAX_VIDEO_MB: "4096"   # per video; files are streamed, not buffered

      # --- secrets (generate your own long random values) ---
      APP_SECRET: ""          # signs session cookies; rotating it logs everyone out
      ADMIN_TOKEN: ""         # API header for scripting; bypasses 2FA, treat as a password

      # --- admin sign-in ---
      ADMIN_EMAIL: "you@example.com"
      ADMIN_PASSWORD: ""      # seeds/updates the account on boot
      ADMIN_2FA: "on"         # "off" is your lockout escape hatch if email breaks

      # --- email (optional; without it, invites and reminders are disabled) ---
      RESEND_API_KEY: ""
      MAIL_FROM: "Your Studio <hello@example.com>"
      MAIL_REPLY_TO: "you@example.com"
      REMIND_DAYS: "7"

      # --- mailings (email everyone in Contacts) ---
      # BRAND_ADDRESS is required before any real mailing: a postal address or PO box, printed in every
      # mailing's footer next to the unsubscribe link. Previews and test sends work without it.
      BRAND_ADDRESS: ""             # e.g. "PO Box 123, Brooklyn, NY 11201"
      MAILING_MAX: "500"            # most people in one mailing; a longer list is refused, not cut short
      MAILING_DAY_MAX: "500"        # most sent per rolling 24 hours; a bigger mailing carries on the next day
                                    #   (Resend's free plan allows 100 a day: set this to 100 if you are on it)
      MAILING_INTERVAL_MS: "600"    # pause between sends, to stay under Resend's rate limit
      MAIL_SEND: "on"               # "off" is a kill switch: every mailing is only simulated
      RESEND_WEBHOOK_SECRET: ""     # optional: Resend dashboard > Webhooks > https://<your host>/api/mail/webhook,
                                    #   events email.bounced and email.complained; bounces are then never mailed again

      # --- branding (optional) ---
      BRAND_NAME: "Your Studio"
      BRAND_URL: "https://example.com"
      BRAND_SOCIAL: "https://instagram.com/yourstudio"
      BRAND_SOCIAL_LABEL: "@yourstudio"

      # --- backups ---
      BACKUP_DIR: "/backups"
      BACKUP_KEEP: "14"

      # --- dynamic DNS (optional) ---
      # For a gallery served from a home connection, where the ISP changes the
      # address without warning. Set the token for whoever hosts your DNS:
      #   Hostinger:  hPanel > Profile > API, with DNS permission.
      #   Cloudflare: an API token with Zone > DNS > Edit for this one domain.
      # Set both while moving a domain between them; remove the old one after.
      # Only the one record named below is ever written; the rest of the zone is
      # never in the payload. Set DNS_APPLY to "off" to watch and email only.
      HOSTINGER_TOKEN: ""
      CLOUDFLARE_TOKEN: ""
      DNS_DOMAIN: ""               # example.com
      DNS_HOST: ""                 # the subdomain, e.g. clients
      DNS_APPLY: "on"
      DNS_CHECK_MINUTES: "10"

      # --- public website (optional) ---
      # Edit and publish a portfolio site from the admin panel's Website section.
      # Token: Cloudflare > Account API Tokens, permission Account > Cloudflare Pages > Edit.
      DROPBOX_APP_KEY: ""            # optional: keep a private Dropbox copy of gallery videos for downloads
      DROPBOX_APP_SECRET: ""
      DROPBOX_REFRESH_TOKEN: ""
      DROPBOX_KEEP_DAYS: "14"        # days after a gallery expires before its Dropbox copies are deleted
      CF_ACCOUNT_ID: ""
      CF_PAGES_TOKEN: ""
      CF_PAGES_PROJECT: ""           # the Pages project name, e.g. my-portfolio
      SITE_URL: ""                   # https://example.com - for links and the uptime check

      # --- downloads ---
      # A set's zip is built ahead of time and kept on disk, so a download starts at once and
      # can resume. Only a few downloads run at a time; the rest wait in line, so one big
      # gallery cannot starve everyone else's thumbnails on a home connection.
      PREZIP: "on"                  # "off" builds each zip as it is sent, still queued
      ZIP_DIR: "/data/zips"         # point at a local disk with room; never inside a network share
      ZIP_MAX_GB: "100"             # prepared zips are removed, least recently used first, past this
      ZIP_MIN_FREE_GB: "50"         # and never fill the disk below this much free space
      ZIP_MAX_ACTIVE: "3"           # downloads at once
      ZIP_TOTAL_MBIT: "120"         # share this much of your upload between them (0 = unlimited)
      ZIP_RATE_MBIT: "0"            # optional cap per download
      ZIP_SWEEP_MINUTES: "60"       # how often to look for galleries that need a zip
      ZIP_SETTLE_MINUTES: "10"      # wait this long after the photos stop changing before rebuilding
      ZIP_STALL_SECONDS: "120"      # a download that moves nothing for this long gives up its place

      # --- watching itself ---
      # Every HEALTH_MINUTES (30 by default, so it stays quiet on the NAS) the app checks Immich (including that its photo lists still have the
      # shape this app reads, which an Immich update can change), free disk, last backup, failed
      # zips, and whether people are stuck waiting in the download line. A problem has to last two
      # checks before it emails ADMIN_EMAIL; it repeats at most daily and says when it clears.
      HEALTH_MINUTES: "30"          # 0 turns the watch off
      HEALTH_MIN_FREE_GB: "20"      # warn below this much free disk

      # --- client sessions ---
      # Where the visitor's address comes from, for sign-in limits and the activity log. Behind a Cloudflare
      # Tunnel set cf-connecting-ip; behind your own proxy, a header it overwrites (e.g. x-real-ip). Empty = X-Forwarded-For.
      CLIENT_IP_HEADER: ""
      SESSION_DAYS: "30"
    ports:
      - '3100:3000'
    restart: always

volumes:
  immichset-data:
