# Copy to docker-compose.yml and fill in. Never commit the filled-in file.
name: immichset

services:
  app:
    container_name: immichset
    image: node:26-alpine
    working_dir: /app
    command: node server.mjs
    volumes:
      - /path/to/immichset:/app:ro          # this repo
      - immichset-data:/data                # sqlite lives here
      - /path/to/backups:/backups           # nightly database copies
    environment:
      # --- core ---
      PORT: "3000"
      DATA_DIR: "/data"
      WEB_DIR: "/app/web"
      TZ: "America/New_York"
      PUBLIC_URL: "https://galleries.example.com"   # what clients see; links are built from it

      # --- Immich ---
      IMMICH_URL: "http://immich-server:2283"
      IMMICH_API_KEY: ""      # create a READ-ONLY key: asset/album/timeline read + download

      # Optional. Only set this to manage photos from the admin panel.
      # A SECOND key: asset.upload, album.create, albumAsset.create to add photos,
      # plus asset.delete and albumAsset.delete to remove them. Grant only the half
      # you want. Leave it empty and the Photos tab stays off; the rest is read-only.
      IMMICH_WRITE_KEY: ""
      UPLOAD_MAX_MB: "250"          # per photo
      UPLOAD_MAX_VIDEO_MB: "4096"   # per video; files are streamed, not buffered

      # --- secrets (generate your own long random values) ---
      APP_SECRET: ""          # signs session cookies; rotating it logs everyone out
      ADMIN_TOKEN: ""         # API header for scripting; bypasses 2FA, treat as a password

      # --- admin sign-in ---
      ADMIN_EMAIL: "you@example.com"
      ADMIN_PASSWORD: ""      # seeds/updates the account on boot
      ADMIN_2FA: "on"         # "off" is your lockout escape hatch if email breaks

      # --- email (optional; without it, invites and reminders are disabled) ---
      RESEND_API_KEY: ""
      MAIL_FROM: "Your Studio <hello@example.com>"
      MAIL_REPLY_TO: "you@example.com"
      REMIND_DAYS: "7"

      # --- branding (optional) ---
      BRAND_NAME: "Your Studio"
      BRAND_URL: "https://example.com"
      BRAND_SOCIAL: "https://instagram.com/yourstudio"
      BRAND_SOCIAL_LABEL: "@yourstudio"

      # --- backups ---
      BACKUP_DIR: "/backups"
      BACKUP_KEEP: "14"

      # --- dynamic DNS (optional) ---
      # For a gallery served from a home connection, where the ISP changes the
      # address without warning. Set the token for whoever hosts your DNS:
      #   Hostinger:  hPanel > Profile > API, with DNS permission.
      #   Cloudflare: an API token with Zone > DNS > Edit for this one domain.
      # Set both while moving a domain between them; remove the old one after.
      # Only the one record named below is ever written; the rest of the zone is
      # never in the payload. Set DNS_APPLY to "off" to watch and email only.
      HOSTINGER_TOKEN: ""
      CLOUDFLARE_TOKEN: ""
      DNS_DOMAIN: ""               # example.com
      DNS_HOST: ""                 # the subdomain, e.g. clients
      DNS_APPLY: "on"
      DNS_CHECK_MINUTES: "10"

      # --- public website (optional) ---
      # Edit and publish a portfolio site from the admin panel's Website section.
      # Token: Cloudflare > Account API Tokens, permission Account > Cloudflare Pages > Edit.
      CF_ACCOUNT_ID: ""
      CF_PAGES_TOKEN: ""
      CF_PAGES_PROJECT: ""           # the Pages project name, e.g. my-portfolio
      SITE_URL: ""                   # https://example.com - for links and the uptime check

      # --- client sessions ---
      SESSION_DAYS: "30"
    ports:
      - '3100:3000'
    restart: always

volumes:
  immichset-data:
