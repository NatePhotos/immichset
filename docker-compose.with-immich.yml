# Immich and immichset together, in one file, for a NAS whose Docker app lets you paste a compose file (a "Project").
# Nothing to edit. The setup page makes your Immich account and keys for you. Steps: docs/install/NO-TERMINAL.md
#
# Photos go in the "library" folder and the database in a Docker volume, both beside this project.
# Immich's nightly database copies are written into the library folder. To use an existing photo folder or
# turn on smart search, use the installer instead (docs/install/NEW.md).

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3
    volumes:
      - ./library:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
    ports:
      - "2283:2283"
    depends_on:
      - redis
      - database
    restart: unless-stopped

  redis:
    image: docker.io/valkey/valkey:9
    restart: unless-stopped

  # No port is published, so only the containers in this project can reach the database; that is why a fixed password is fine.
  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - immich-db:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped

  immichset:
    image: ghcr.io/natephotos/immichset:latest
    init: true
    ports:
      - "3000:3000"
    volumes:
      - immichset-data:/data
      - immichset-backups:/backups
    environment:
      BACKUP_DIR: /backups
      # These tell the setup page that Immich came with this file, so it can make your Immich account and keys.
      IMMICHSET_BUNDLED_IMMICH: http://immich-server:2283
      IMMICHSET_BUNDLED_ML: "off"
    depends_on:
      - immich-server
    restart: unless-stopped

volumes:
  immich-db:
  immichset-data:
  immichset-backups:
