# The short version. Save this as docker-compose.yml, run `docker compose up -d`, then follow docs/SETUP.md:
# the first thing the app does is ask you, in your browser, for the keys it needs.
#
# docker-compose.example.yml lists every setting as an environment variable, for people who prefer that.
# Anything set there always wins over what the setup page saved.

services:
  immichset:
    image: ghcr.io/natephotos/immichset:latest
    container_name: immichset
    init: true
    ports:
      - "3000:3000"
    volumes:
      - immichset-data:/data          # database, covers, and the settings file the setup page writes
      - immichset-backups:/backups    # nightly database copies
    environment:
      # Your time zone is filled in for you on the setup page. To force one here instead: TZ: America/Chicago
      BACKUP_DIR: /backups
    restart: unless-stopped
    # Immich in another compose project on this computer? Either use its network address in setup
    # (http://192.168.x.x:2283), or join its network by uncommenting this and the networks block below.
    # networks: [immich_default]

    # Not in your own home network only: reach it from anywhere over https without opening your router. Make a tunnel in
    # Cloudflare (see docs/ONLINE.md), put its token in a file called tunnel.env containing TUNNEL_TOKEN=..., then remove the
    # # from the next block and from the "profiles" line, and run: docker compose --profile tunnel up -d
    # Also set CLIENT_IP_HEADER: cf-connecting-ip above, so the sign-in limits see real visitor addresses.

# cloudflared:
#   image: cloudflare/cloudflared:2026.10.4
#   command: ["tunnel", "--no-autoupdate", "run"]
#   env_file: [tunnel.env]
#   profiles: ["tunnel"]
#   restart: unless-stopped

volumes:
  immichset-data:
  immichset-backups:

