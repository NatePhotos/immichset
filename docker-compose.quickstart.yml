# Save as docker-compose.yml and run `docker compose up -d`, then open the setup page (see docs/SETUP.md).
# Every setting is listed in docker-compose.example.yml; anything set there wins over the setup page.

services:
  immichset:
    image: ghcr.io/natephotos/immichset:latest
    container_name: immichset
    init: true
    ports:
      - "3000:3000"
    volumes:
      - immichset-data:/data          # database, covers, and the settings file the setup page writes
      - immichset-backups:/backups    # nightly database copies
    environment:
      # Your time zone is filled in for you on the setup page. To force one here instead: TZ: America/Chicago
      BACKUP_DIR: /backups
      # CLIENT_IP_HEADER: cf-connecting-ip   # only behind a Cloudflare Tunnel
    restart: unless-stopped
    # Immich in another compose project? Use its network address in setup, or join its network by uncommenting this line and the networks block at the bottom.
    # networks: [immich_default]

  # To reach it over https from anywhere, see docs/ONLINE.md. For a Cloudflare Tunnel, remove the "# " from the next
  # block, put TUNNEL_TOKEN=... in tunnel.env, and uncomment CLIENT_IP_HEADER above.
  # cloudflared:
  #   image: cloudflare/cloudflared:2026.10.4
  #   command: ["tunnel", "--no-autoupdate", "run"]
  #   env_file: [tunnel.env]
  #   profiles: ["tunnel"]
  #   restart: unless-stopped

volumes:
  immichset-data:
  immichset-backups:

