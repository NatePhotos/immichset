<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="/brand/logo">
<link rel="icon" type="image/png" media="(prefers-color-scheme: dark)" href="/brand/logo?theme=dark">
<link rel="apple-touch-icon" href="/brand/logo">
<title>Galleries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#1a1a1a;--muted:#8a8a8a;--line:#e6e6e6;--soft:#f7f7f7;--ok:#1f7a3f;--warn:#9a6b00;--bad:#b3261e;
  --font:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button,input,select,textarea{font-family:inherit;font-size:16px}
a{color:inherit}
[hidden]{display:none !important}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border:1px solid var(--fg);
  background:var(--fg);color:#fff;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  white-space:nowrap;cursor:pointer;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn.ghost{background:transparent;color:var(--fg)}
.btn.sm{padding:8px 13px;font-size:10px}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.4;cursor:default}
.btn[hidden]{display:none !important}
.link{background:none;border:none;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  cursor:pointer;padding:7px}
.link:hover{color:var(--fg)}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:12px;padding:0 18px;height:60px;max-width:1400px;margin:0 auto}
.back{width:34px;height:34px;display:grid;place-items:center;border:none;background:none;cursor:pointer;color:var(--fg);flex:0 0 auto}
.back:hover{background:var(--soft);border-radius:50%}
.ttl{min-width:0;flex:1 1 auto}
.ttl h1{margin:0;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl .sub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;border-radius:999px;
  border:1px solid var(--line);color:var(--muted);flex:0 0 auto}
.pill.live{border-color:var(--ok);color:var(--ok)}
.pill.draft{border-color:var(--warn);color:var(--warn)}
.pill.exp{border-color:var(--bad);color:var(--bad)}
@media(max-width:700px){.topin{gap:8px;padding:0 12px}.ttl .sub{display:none}}

/* ---------- layout ---------- */
.wrap{max-width:1400px;margin:0 auto;padding:0 18px 90px}
.detail{display:grid;grid-template-columns:230px minmax(0,1fr);gap:0;max-width:1400px;margin:0 auto}
.side{border-right:1px solid var(--line);min-height:calc(100vh - 60px);padding-bottom:40px}
.side .cov{aspect-ratio:3/2;background:var(--soft) center/cover no-repeat;border-bottom:1px solid var(--line)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;height:52px;display:grid;place-items:center;border:none;background:none;cursor:pointer;
  color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--fg);border-bottom-color:var(--fg)}
.tabs button:hover{color:var(--fg)}
.navhead{font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:20px 18px 8px}
.navitem{display:flex;align-items:center;gap:10px;width:100%;padding:12px 18px;border:none;background:none;cursor:pointer;
  font-size:13px;text-align:left;color:var(--fg)}
.navitem:hover{background:var(--soft)}
.navitem.on{background:var(--soft);font-weight:600}
.navitem .tag{margin-left:auto;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 7px;border-radius:999px;background:var(--line);color:var(--muted)}
.navitem.on .tag,.navitem .tag.on{background:var(--ok);color:#fff}
.main{padding:28px 30px 90px;min-width:0}
.main h2{margin:0 0 4px;font-size:17px;font-weight:600;letter-spacing:.02em}
.main .lede{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 24px}
@media(max-width:860px){
  .detail{grid-template-columns:1fr}
  .side{border-right:none;border-bottom:1px solid var(--line);min-height:0;padding-bottom:0}
  .side .cov{aspect-ratio:16/6}
  .navrow{display:flex;overflow-x:auto;gap:4px;padding:10px 12px;-webkit-overflow-scrolling:touch}
  .navhead{display:none}
  .navitem{width:auto;white-space:nowrap;padding:9px 14px;border:1px solid var(--line);font-size:12px}
  .navitem.on{border-color:var(--fg)}
  .main{padding:22px 16px 90px}
}
@media(min-width:861px){.navrow{display:block}}

/* ---------- cards ---------- */
h3.sec{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin:34px 0 14px;color:var(--muted)}
h3.sec:first-child{margin-top:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{border:1px solid var(--line);cursor:pointer;transition:border-color .2s}
.card:hover{border-color:var(--fg)}
.card .ph{aspect-ratio:3/2;background:var(--soft) center/cover no-repeat}
.card .body{padding:14px 15px 16px}
.card h3{margin:0 0 3px;font-size:13px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sub{font-size:11.5px;color:var(--muted);margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
.tag2{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border:1px solid var(--line);color:var(--muted)}
.tag2.live{border-color:var(--ok);color:var(--ok)}
.tag2.draft{border-color:var(--warn);color:var(--warn)}
.tag2.exp{border-color:var(--bad);color:var(--bad)}
.stats{display:flex;gap:16px;font-size:11px;color:var(--muted)}
.stats b{display:block;font-size:16px;font-weight:600;color:var(--fg)}

/* ---------- forms ---------- */
.field{margin-bottom:18px;max-width:620px}
.field label{display:block;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin-bottom:7px}
.field input[type=text],.field input[type=date],.field input[type=password],.field input[type=email],.field select,.field textarea{
  width:100%;padding:12px 13px;border:1px solid var(--line);background:#fff;outline:none}
.field textarea{resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--fg)}
.hint{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:620px}
@media(max-width:700px){.row2{grid-template-columns:1fr}}
.toggle{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-top:1px solid var(--line);max-width:620px}
.toggle:last-of-type{border-bottom:1px solid var(--line)}
.toggle input{width:20px;height:20px;margin:2px 0 0;flex:0 0 auto;accent-color:var(--fg)}
.toggle .t{font-size:13px;font-weight:600;display:block}
.toggle .d{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5;display:block}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:7px;max-height:300px;overflow:auto;
  border:1px solid var(--line);padding:7px;max-width:620px}
.picker .p{aspect-ratio:1;background:var(--soft) center/cover no-repeat;cursor:pointer;border:2px solid transparent}
.picker .p.on{border-color:var(--fg)}

/* ---------- uploads ---------- */
.drop{border:1.5px dashed var(--line);background:var(--soft);padding:32px 20px;text-align:center;max-width:620px}
.drop.on{border-color:var(--fg);background:var(--bg)}
.drop svg{color:var(--muted)}
.drop p{margin:9px 0 14px;font-size:14px}
.drop .hint{margin-top:13px}
.queue{margin-top:22px;max-width:620px}
.qhead{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.qhead .link{margin-left:8px}
.qfail{color:var(--bad)}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) 110px 104px;gap:12px;align-items:center;
  padding:8px 0;border-top:1px solid var(--line);font-size:12.5px}
.qn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qbar{height:3px;background:var(--line);position:relative;overflow:hidden}
.qbar i{position:absolute;top:0;bottom:0;left:0;background:var(--fg);transition:width .2s}
.qs{color:var(--muted);text-align:right}
.qrow.done .qs{color:var(--ok)}
.qrow.fail .qs{color:var(--bad)}
.qrow.fail .qbar i{background:var(--bad)}
@media(max-width:700px){.qrow{grid-template-columns:minmax(0,1fr) 96px}.qbar{display:none}}

/* ---------- compose ---------- */
.compose{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px;align-items:start}
@media(max-width:1100px){.compose{grid-template-columns:1fr}}
.pane{border:1px solid var(--line);background:var(--soft);padding:14px;position:sticky;top:76px}
@media(max-width:1100px){.pane{position:static}}
.pane h4{margin:0 0 10px;font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.pane iframe{width:100%;height:600px;border:1px solid var(--line);background:#fff;display:block}
.subjline{font-size:13px;font-weight:600;padding:10px 12px;background:#fff;border:1px solid var(--line);border-bottom:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vars code{background:var(--soft);padding:1px 5px;font-size:11px}
.tplrow{display:flex;gap:8px;align-items:center;margin-bottom:18px;flex-wrap:wrap;max-width:620px}
.tplrow select{flex:1 1 170px;padding:11px 12px;border:1px solid var(--line);background:#fff}

/* ---------- data ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:12px;margin-bottom:26px;max-width:760px}
.kpi{border:1px solid var(--line);padding:15px 14px}
.kpi b{display:block;font-size:23px;font-weight:600}
.kpi span{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:12.5px;max-width:860px}
th{text-align:left;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  padding:9px 10px;border-bottom:1px solid var(--line);font-weight:700}
td{padding:11px 10px;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.empty{color:var(--muted);font-size:13px;line-height:1.6;max-width:460px}

/* ---------- login ---------- */
#login{min-height:100svh;display:none;place-items:center;padding:24px}
#login.on{display:grid}
.lbox{width:min(360px,100%);text-align:center}
.lbox .mk{width:52px;height:52px;margin:0 auto 22px;background:var(--fg);
  -webkit-mask:url(/brand/logo) center/contain no-repeat;mask:url(/brand/logo) center/contain no-repeat}
.lbox h1{font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;margin:0 0 24px}
.lbox input{width:100%;padding:14px;border:1px solid var(--line);text-align:center;outline:none;letter-spacing:.04em;margin-bottom:10px}
.lbox .btn{width:100%}
.err{color:var(--bad);font-size:12px;margin-top:14px;min-height:18px}

#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:#111;color:#fff;padding:13px 22px;
  font-size:12px;letter-spacing:.07em;z-index:60;opacity:0;pointer-events:none;transition:.26s;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.act{pointer-events:auto}
#toast button{background:none;border:none;color:#fff;font:inherit;text-decoration:underline;
  text-underline-offset:3px;cursor:pointer;margin-left:14px;padding:0}

/* ---------- photo management ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;max-width:760px}
.grid .p{position:relative;aspect-ratio:1;background:var(--soft) center/cover no-repeat;cursor:pointer;
  border:2px solid transparent}
.grid .p.on{border-color:var(--fg)}
.grid .p.on:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.26)}
.grid .p .tick{position:absolute;top:5px;left:5px;width:17px;height:17px;border-radius:50%;z-index:1;
  background:#fff;border:1px solid var(--line);display:none}
.grid .p.on .tick{display:block;background:var(--fg);border-color:var(--fg)}
.grid .p.cov:before{content:"Cover";position:absolute;bottom:0;left:0;right:0;z-index:1;background:rgba(0,0,0,.62);
  color:#fff;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:3px 0}
.bar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:0 0 16px;min-height:38px}
.bar .count{font-size:12px;color:var(--muted);margin-right:4px}
.spin{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--fg);border-radius:50%;
  animation:sp .8s linear infinite;margin:50px auto}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="login">
  <form class="lbox" id="loginForm">
    <div class="mk"></div>
    <h1>Gallery Admin</h1>
    <input id="aEmail" type="email" placeholder="Email" autocomplete="username">
    <input id="aPass" type="password" placeholder="Password" autocomplete="current-password">
    <input id="aCode" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code" hidden
           style="letter-spacing:.4em;font-size:19px">
    <button class="btn" type="submit" id="aBtn">Sign in</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div id="app" hidden>
  <div class="top"><div class="topin">
    <button class="back" id="backBtn" hidden aria-label="Back">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="ttl"><h1 id="tTitle">Galleries</h1><div class="sub" id="tSub"></div></div>
    <span class="pill" id="tPill" hidden></span>
    <button class="btn sm ghost" id="aPreview" hidden>Preview</button>
    <button class="btn sm" id="aShare" hidden>Copy link</button>
    <button class="btn sm" id="newBtn">New</button>
    <button class="link" id="outBtn">Sign out</button>
  </div></div>
  <div id="root"></div>
</div>

<div id="toast"></div>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var S = { galleries: [], albums: [], publicUrl: null, g: null, tab: "settings", pane: "general",
          canUpload: false, uploadMaxMb: 250, caps: {} };

/* ---------- icons ---------- */
var I = {
  gear: '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>',
  mail: '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
  chart:'<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>',
  image:'<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2"/><circle cx="8.6" cy="10" r="1.6"/><path d="M3.5 17l5-4.6 4 3.4 3.2-2.6 4.8 4"/></svg>',
  up:   '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M7.5 8.5L12 4l4.5 4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>'
};

function toast(t, action){
  var e=$("toast"); clearTimeout(e._t);
  e.textContent=t; e.classList.toggle("act", !!action);
  if (action){
    var b=document.createElement("button"); b.textContent=action.label;
    b.onclick=function(){ e.classList.remove("on","act"); action.run(); };
    e.appendChild(b);
  }
  e.classList.add("on");
  e._t=setTimeout(function(){ e.classList.remove("on","act"); }, action ? 8000 : 2600);
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function api(path, opts){
  return fetch("/api/admin" + path, Object.assign({credentials:"same-origin"}, opts||{}))
    .then(function(r){ return r.json().catch(function(){return null;}).then(function(j){ return {ok:r.ok,status:r.status,body:j}; }); });
}
function post(p,d,m){ return api(p,{method:m||"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d||{})}); }
function fmtDate(iso){ if(!iso) return ""; var d=new Date(iso); return isNaN(d)?"":d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); }
function fmtWhen(s){ if(!s) return ""; var d=new Date(String(s).replace(" ","T")+"Z"); return isNaN(d)?s:d.toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}); }
function imgSrc(id,size){ return id ? "/api/admin/img/"+id+"?size="+(size||"thumbnail") : ""; }
function coverOf(g){
  if (g.coverAssetId) return imgSrc(g.coverAssetId,"preview");
  var a = S.albums.filter(function(x){return x.id===g.albumId;})[0];
  return (a && a.thumb) ? imgSrc(a.thumb,"preview") : "";
}
function galleryUrl(g){ return (S.publicUrl || location.origin) + "/g/" + g.slug; }

/* ---------- auth ---------- */
function takeMe(b){
  S.publicUrl   = b && b.publicUrl;
  S.canUpload   = !!(b && b.canUpload);
  S.uploadMaxMb = (b && b.uploadMaxMb) || 250;
  S.caps        = (b && b.caps) || {};
}
var challenge = null;

/* The code arrives by email, so signing in on a phone means leaving the browser.
   iOS often reloads the tab on the way back, which used to drop the challenge and
   send you through the whole sign-in again. Park it for the life of the tab. */
var CKEY = "immichset.challenge";
function saveChallenge(o){ try { sessionStorage.setItem(CKEY, JSON.stringify(o)); } catch(e){} }
function clearChallenge(){ try { sessionStorage.removeItem(CKEY); } catch(e){} }
function loadChallenge(){
  try { var o = JSON.parse(sessionStorage.getItem(CKEY) || "null");
        return (o && o.id && o.until > Date.now()) ? o : null; } catch(e){ return null; }
}
function codeStep(sentTo){
  $("aEmail").hidden=true; $("aPass").hidden=true; $("aCode").hidden=false;
  $("aBtn").textContent="Verify";
  $("loginErr").style.color="var(--muted)";
  $("loginErr").textContent = sentTo ? ("We sent a code to "+sentTo+".") : "Enter the code we emailed you.";
  $("aCode").focus();
}

api("/me").then(function(r){
  if (r.ok){ clearChallenge(); takeMe(r.body); boot(); return; }
  $("login").classList.add("on");
  var c = loadChallenge();
  if (c){ challenge = c.id; codeStep(c.sentTo); }
});
$("loginForm").addEventListener("submit", function(e){
  e.preventDefault(); $("loginErr").textContent=""; $("aBtn").disabled=true;
  var body = challenge ? {challenge:challenge, code:$("aCode").value.replace(/\D/g,"")}
                       : {email:$("aEmail").value.trim(), password:$("aPass").value};
  post("/login", body).then(function(r){
    $("aBtn").disabled=false;
    if (!r.ok){
      var m = r.body && r.body.error;
      if (r.status===429){ $("loginErr").textContent="Too many attempts. Wait 15 minutes and try again."; clearChallenge(); }
      else if (m==="bad_code"){ $("loginErr").textContent="That code isn't right."; $("aCode").value=""; $("aCode").focus(); }
      else if (m==="code_expired"){ $("loginErr").textContent="That code expired. Start again."; resetLogin(); }
      else if (r.status===502) $("loginErr").textContent = m || "Couldn't send your code.";
      else { $("loginErr").textContent="Email or password is incorrect."; $("aPass").value=""; $("aPass").focus(); }
      return;
    }
    if (r.body && r.body.step==="code"){
      challenge = r.body.challenge;
      saveChallenge({ id: challenge, sentTo: r.body.sentTo || "",
                      until: Date.now() + ((r.body.expiresIn || 600000) - 10000) });
      codeStep(r.body.sentTo);
      return;
    }
    clearChallenge();
    $("login").classList.remove("on");
    api("/me").then(function(m){ takeMe(m.body); boot(); });
  });
});
function resetLogin(){ challenge=null; clearChallenge(); $("aEmail").hidden=false; $("aPass").hidden=false;
  $("aCode").hidden=true; $("aCode").value=""; $("aBtn").textContent="Sign in"; $("loginErr").style.color=""; }

function upAdd(g, files){
  UP.albumId = g.albumId;
  Array.prototype.forEach.call(files, function(f){
    var it = { name:f.name, file:f, pct:0, state:"wait", err:null };
    if (!UP_OK.test(f.name)) { it.state = "fail"; it.err = "Not a photo file"; }
    else if (f.size > S.uploadMaxMb * 1048576) { it.state = "fail"; it.err = "Over " + S.uploadMaxMb + " MB"; }
    else if (!f.size) { it.state = "fail"; it.err = "Empty file"; }
    UP.items.push(it);
  });
  upRender();
  upPump();
}

function upRender(){
  var q = $("queue"); if (!q) return;
  if (!UP.items.length){ q.innerHTML = ""; return; }
  var done = UP.items.filter(function(i){ return i.state==="done" || i.state==="dupe"; }).length;
  var fail = UP.items.filter(function(i){ return i.state==="fail"; }).length;
  q.innerHTML = '<div class="qhead">' + done + ' of ' + UP.items.length + ' finished'
    + (fail ? ' <span class="qfail">— ' + fail + ' failed</span>' : '')
    + (UP.running ? '' : ' <button type="button" class="link" id="qclear">Clear</button>') + '</div>'
    + UP.items.map(function(i){
        var pct = Math.round(i.pct * 100);
        var label = i.state==="done" ? "Added"
                  : i.state==="dupe" ? "Already in Immich"
                  : i.state==="fail" ? esc(i.err || "Failed")
                  : i.state==="up"   ? pct + "%" : "Waiting";
        return '<div class="qrow ' + i.state + '"><span class="qn">' + esc(i.name) + '</span>'
             + '<span class="qbar"><i style="width:' + pct + '%"></i></span>'
             + '<span class="qs">' + label + '</span></div>';
      }).join("");
  if ($("qclear")) $("qclear").onclick = function(){ UP.items = []; upRender(); };
}

function upPump(){
  while (UP.running < 3){
    var next = UP.items.filter(function(i){ return i.state==="wait"; })[0];
    if (!next) break;
    UP.running++; next.state = "up";
    upSend(next);
  }
  upRender();
  if (!UP.running && UP.items.length) upDone();
}

/* XHR rather than fetch: it is the only way to get upload progress per file. */
function uploadFile(file, albumId, onProgress){
  return new Promise(function(resolve){
    var x = new XMLHttpRequest();
    var qs = "?albumId=" + encodeURIComponent(albumId)
           + "&name="    + encodeURIComponent(file.name)
           + "&created=" + encodeURIComponent(new Date(file.lastModified || Date.now()).toISOString());
    x.open("POST", "/api/admin/upload" + qs);
    x.withCredentials = true;
    x.setRequestHeader("Content-Type", file.type || "application/octet-stream");
    if (onProgress) x.upload.onprogress = function(e){ if (e.lengthComputable) onProgress(e.loaded / e.total); };
    x.onload = function(){
      var b = null; try { b = JSON.parse(x.responseText); } catch(e){}
      if (x.status >= 200 && x.status < 300) resolve({ ok:true, id: b && b.id, status: b && b.status });
      else resolve({ ok:false, error: (b && b.error) || ("HTTP " + x.status) });
    };
    x.onerror = function(){ resolve({ ok:false, error:"Network error" }); };
    x.onabort = function(){ resolve({ ok:false, error:"Cancelled" }); };
    x.send(file);
  });
}

function upSend(it){
  uploadFile(it.file, UP.albumId, function(p){ it.pct = p; upRender(); }).then(function(res){
    if (res.ok){ it.pct = 1; it.state = res.status === "duplicate" ? "dupe" : "done"; }
    else { it.state = "fail"; it.err = res.error; }
    UP.running--;
    if (UP.items.filter(function(i){ return i.state==="wait"; }).length) upPump();
    else { upRender(); if (!UP.running) upDone(); }
  });
}

function upDone(){
  var added = UP.items.filter(function(i){ return i.state==="done"; }).length;
  var fail  = UP.items.filter(function(i){ return i.state==="fail"; }).length;
  toast(added ? (added + " photo" + (added===1?"":"s") + " added")
      : fail  ? "Nothing uploaded" : "Those were already in Immich");
  refreshAlbums(function(){ refreshGalleries(function(){ if (S.pane === "upload") upRender(); }); });
}

function paneBrowse(g){
  var alb  = S.albums.filter(function(x){ return x.id===g.albumId; })[0];
  var list = [], sel = {}, busy = false;

  $("pane").innerHTML = head("In this album",
      "Click to select" + (alb ? ", from <b>" + esc(alb.name) + "</b>" : "") + ". Trashed photos go to Immich's trash, where they keep for 30 days.")
    + '<div class="bar" id="bar"></div>'
    + '<div class="grid" id="grid"><div class="spin"></div></div>'
    + '<div class="hint" id="gridN"></div>'
    + '<input type="file" id="repl" accept=".jpg,.jpeg,.png,.heic,.heif,.webp,.avif,.gif,.tif,.tiff,.dng" style="display:none">';

  function chosen(){ return Object.keys(sel).filter(function(k){ return sel[k]; }); }

  function drawBar(){
    var n = chosen().length, c = S.caps || {};
    var h = '<span class="count">' + (n ? n + " selected" : list.length + " photo" + (list.length===1?"":"s")) + '</span>';
    if (!n){
      if (list.length) h += '<button class="btn sm ghost" id="selAll">Select all</button>';
    } else {
      if (c.trash)       h += '<button class="btn sm danger" id="doTrash">Move to trash</button>';
      if (c.albumRemove) h += '<button class="btn sm ghost" id="doRemove">Remove from gallery</button>';
      /* replacing means putting the new one in and taking the old one out, so it needs both */
      if (n === 1 && c.upload && (c.trash || c.albumRemove)) h += '<button class="btn sm ghost" id="doRepl">Replace…</button>';
      if (n === 1)       h += '<button class="btn sm ghost" id="doCover">Make cover</button>';
      h += '<button class="btn sm ghost" id="selNone">Clear</button>';
    }
    $("bar").innerHTML = h;
    if ($("selAll"))  $("selAll").onclick  = function(){ list.forEach(function(a){ sel[a.id]=true; }); draw(); };
    if ($("selNone")) $("selNone").onclick = function(){ sel = {}; draw(); };
    if ($("doTrash"))  $("doTrash").onclick  = function(){ act("trash"); };
    if ($("doRemove")) $("doRemove").onclick = function(){ act("remove"); };
    if ($("doCover"))  $("doCover").onclick  = function(){
      save({coverAssetId: chosen()[0]}, "Cover updated").then(function(ok){ if (ok){ sel={}; draw(); } });
    };
    if ($("doRepl")) $("doRepl").onclick = function(){ $("repl").click(); };
  }

  function draw(){
    $("grid").innerHTML = list.map(function(a){
      return '<div class="p' + (sel[a.id] ? " on" : "") + (a.id===S.g.coverAssetId ? " cov" : "") + '" data-id="' + a.id
           + '" style="background-image:url(\'' + imgSrc(a.id) + '\')"><span class="tick"></span></div>';
    }).join("") || '<p class="empty" style="padding:8px">No photos yet. Add some from the previous tab.</p>';
    Array.prototype.forEach.call($("grid").querySelectorAll(".p"), function(el){
      el.onclick = function(){ if (busy) return; sel[el.dataset.id] = !sel[el.dataset.id]; draw(); };
    });
    $("gridN").textContent = list.length >= 400 ? "Showing the first 400." : "";
    drawBar();
  }

  function load(then){
    api("/albums/" + g.albumId + "/assets").then(function(r){
      list = (r.body && r.body.assets) || [];
      Object.keys(sel).forEach(function(k){
        if (!list.some(function(a){ return a.id===k; })) delete sel[k];
      });
      draw(); if (then) then();
    });
  }

  function act(kind, ids, quiet){
    ids = ids || chosen();
    if (!ids.length) return;
    if (kind === "remove" && !quiet &&
        !confirm("Take " + ids.length + " photo" + (ids.length===1?"":"s") + " out of this gallery?\n\nThey stay in Immich.")) return;
    busy = true;
    return post("/photos/" + kind, {albumId: g.albumId, ids: ids}).then(function(r){
      busy = false;
      if (!r.ok){ toast((r.body && r.body.error) || "That didn't work"); return false; }
      var n = r.body.n;
      sel = {};
      load(function(){ refreshAlbums(); refreshGalleries(draw); });
      if (kind === "trash")
        toast(n + " photo" + (n===1?"":"s") + " moved to trash", { label: "Undo", run: function(){ act("restore", r.body.ids, true); } });
      else if (kind === "restore") toast("Brought back");
      else toast(n + " photo" + (n===1?"":"s") + " removed from the gallery");
      return true;
    });
  }

  $("repl").onchange = function(){
    var f = $("repl").files[0], old = chosen()[0];
    $("repl").value = "";
    if (!f || !old) return;
    var wasCover = old === S.g.coverAssetId;
    busy = true; toast("Uploading the replacement…");
    uploadFile(f, g.albumId).then(function(res){
      busy = false;
      if (!res.ok) return toast(res.error || "Couldn't upload that one");
      /* only drop the old one once the new one is safely in */
      act((S.caps && S.caps.trash) ? "trash" : "remove", [old], true).then(function(){
        if (wasCover && res.id) save({coverAssetId: res.id}, "Replaced, and it's the new cover");
        else toast("Replaced");
      });
    });
  };

  load();
}

function paneDanger(g){
  $("pane").innerHTML = head("Delete this gallery", "The link stops working and the activity log is removed. Your photos in Immich are not touched.")
    + '<button class="btn danger" id="del">Delete gallery</button>';
  $("del").onclick = function(){
    if (!confirm("Delete “"+g.title+"”?\n\nThis cannot be undone.")) return;
    api("/galleries/"+g.id, {method:"DELETE"}).then(function(){
      toast("Gallery deleted");
      api("/galleries").then(function(r){ S.galleries = r.body||[]; listView(); });
    });
  };
}

/* ---------- email panes ---------- */
function paneClients(g){
  $("pane").innerHTML = head("Clients", "Addresses you'll send this gallery to. Anyone who registers on their own is added to the activity log separately.")
    + '<div id="cl"><div class="spin"></div></div>';
  api("/galleries/"+g.id+"/invites").then(function(r){
    var inv = (r.body && r.body.invites) || [];
    $("cl").innerHTML =
        '<div class="field"><label>Add emails</label><textarea id="invBox" rows="2" placeholder="anna@example.com, mark@example.com"></textarea>'
      +   '<div class="hint">Separate with commas, spaces or new lines.</div></div>'
      + '<button class="btn sm" id="addInv">Add</button>'
      + '<h3 class="sec">On this gallery</h3>'
      + (inv.length ? '<div class="scroll"><table><tr><th>Email</th><th>Added</th><th></th></tr>'
          + inv.map(function(i){ return '<tr><td>'+esc(i.email)+'</td><td class="muted">'+fmtWhen(i.created_at)+'</td>'
            + '<td style="text-align:right"><button class="link rm" data-e="'+esc(i.email)+'">Remove</button></td></tr>'; }).join("")
          + '</table></div>'
        : '<p class="empty">No addresses yet.</p>');
    $("addInv").onclick = function(){
      var v = $("invBox").value.trim(); if (!v) return;
      post("/galleries/"+g.id+"/invites", {emails:v}).then(function(rr){
        if (!rr.ok) return toast("Couldn't add those");
        toast(rr.body.added+" added"+((rr.body.invalid||[]).length?", "+rr.body.invalid.length+" not valid":""));
        paneClients(g);
      });
    };
    Array.prototype.forEach.call(document.querySelectorAll(".rm"), function(b){
      b.onclick = function(){ post("/galleries/"+g.id+"/invites", {email:b.dataset.e}, "DELETE").then(function(){ paneClients(g); }); };
    });
  });
}

function paneCompose(g){
  $("pane").innerHTML = head("Compose", "") + '<div id="cp"><div class="spin"></div></div>';
  Promise.all([api("/templates"), api("/mail-status"), api("/galleries/"+g.id+"/invites")]).then(function(rs){
    var tpls = (rs[0].body && rs[0].body.templates) || [];
    var last = rs[0].body && rs[0].body.lastUsed;
    var mail = rs[1].body || {};
    var invites = ((rs[2].body && rs[2].body.invites) || []).map(function(i){ return i.email; });

    if (!mail.configured){
      $("cp").innerHTML = '<p class="empty">Email isn\'t configured yet, so nothing can be sent.</p>';
      return;
    }
    $("cp").innerHTML =
        '<div class="compose"><div>'
      +   '<div class="tplrow"><select id="cTpl">'
      +     tpls.map(function(t){ return '<option value="'+t.id+'"'+(t.id===last?" selected":"")+'>'+esc(t.name)+'</option>'; }).join("")
      +   '</select><button class="btn sm ghost" id="cSaveTpl">Save as template</button></div>'
      +   '<div class="field"><label>To</label><textarea id="cTo" rows="2" placeholder="anna@example.com">'+esc(invites.join(", "))+'</textarea>'
      +     '<div class="hint">Separate with commas. Defaults to the clients on this gallery.</div></div>'
      +   '<div class="field"><label>Subject</label><input type="text" id="cSubj"></div>'
      +   '<div class="field"><label>Message</label><textarea id="cBody" rows="9"></textarea>'
      +     '<div class="hint vars">Placeholders: <code>{{title}}</code> <code>{{subtitle}}</code> <code>{{link}}</code> '
      +     '<code>{{expiry}}</code> <code>{{brand}}</code></div></div>'
      +   tog("cExpiry","Show the expiry date", g.expiresAt ? "Adds “Available until "+fmtDate(g.expiresAt)+"” under the button." : "This gallery has no expiry date.", !!g.expiresAt, !g.expiresAt)
      +   tog("cCopy","Send me a copy","Also sends it to your admin address.",false)
      +   '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:22px">'
      +     '<button class="btn" id="cSend">Send</button>'
      +     '<button class="btn ghost" id="cTest">Send a test to me</button></div>'
      + '</div>'
      + '<div class="pane"><h4>Preview</h4><div class="subjline" id="cPrevSubj">&nbsp;</div>'
      +   '<iframe id="cPrev" title="Email preview"></iframe></div></div>';

    function apply(){
      var t = tpls.filter(function(x){ return String(x.id)===$("cTpl").value; })[0];
      if (!t) return;
      $("cSubj").value = t.subject; $("cBody").value = t.body; refresh();
    }
    var timer;
    function refresh(){
      clearTimeout(timer);
      timer = setTimeout(function(){
        post("/galleries/"+g.id+"/preview", {subject:$("cSubj").value, body:$("cBody").value, showExpiry:$("cExpiry").checked})
          .then(function(r){ if(!r.ok) return;
            $("cPrevSubj").textContent = r.body.subject || "";
            $("cPrev").srcdoc = r.body.html; });
      }, 320);
    }
    $("cTpl").onchange = apply;
    ["cSubj","cBody"].forEach(function(id){ $(id).addEventListener("input", refresh); });
    $("cExpiry").addEventListener("change", refresh);
    apply();

    $("cSaveTpl").onclick = function(){
      var name = prompt("Name this template:"); if (!name) return;
      post("/templates", {name:name, subject:$("cSubj").value, body:$("cBody").value}).then(function(r){
        toast(r.ok ? "Template saved" : ((r.body&&r.body.error)||"Couldn't save"));
        if (r.ok) paneCompose(g);
      });
    };
    function payload(extra){
      var to = $("cTo").value.split(/[\s,;]+/).map(function(x){return x.trim();}).filter(Boolean);
      return Object.assign({to:to, subject:$("cSubj").value, body:$("cBody").value, templateId:Number($("cTpl").value),
                            showExpiry:$("cExpiry").checked, sendCopy:$("cCopy").checked}, extra||{});
    }
    $("cTest").onclick = function(){
      $("cTest").disabled=true; $("cTest").textContent="Sending…";
      post("/galleries/"+g.id+"/send", payload({testOnly:true})).then(function(r){
        $("cTest").disabled=false; $("cTest").textContent="Send a test to me";
        toast(r.ok ? ("Test sent to "+r.body.testSentTo) : ((r.body&&r.body.error)||"Couldn't send"));
      });
    };
    $("cSend").onclick = function(){
      var p = payload();
      if (!p.to.length) return toast("Add at least one recipient");
      if (!confirm("Send to "+p.to.length+" recipient"+(p.to.length===1?"":"s")+"?")) return;
      $("cSend").disabled=true; $("cSend").textContent="Sending…";
      post("/galleries/"+g.id+"/send", p).then(function(r){
        $("cSend").disabled=false; $("cSend").textContent="Send";
        if (!r.ok) return toast((r.body&&r.body.error)||"Couldn't send");
        toast("Sent to "+r.body.sent+(r.body.copySentTo?" (+ copy to you)":"")+(((r.body.failed||[]).length)?", "+r.body.failed.length+" failed":""));
        S.pane = "overview"; S.tab = "activity"; renderShell();
      });
    };
  });
}

function paneTemplates(g){
  $("pane").innerHTML = head("Templates", "Reused across every gallery. The one you send with is remembered for next time.")
    + '<div id="tl"><div class="spin"></div></div>';
  api("/templates").then(function(r){
    var tpls = (r.body && r.body.templates) || [];
    $("tl").innerHTML = tpls.map(function(t){
      return '<div style="border:1px solid var(--line);padding:16px;margin-bottom:14px;max-width:660px">'
        + '<div class="field" style="margin-bottom:10px"><label>Name</label>'
        +   '<input type="text" data-f="name" data-id="'+t.id+'" value="'+esc(t.name)+'"'+(t.built_in?" readonly":"")+'></div>'
        + '<div class="field" style="margin-bottom:10px"><label>Subject</label>'
        +   '<input type="text" data-f="subject" data-id="'+t.id+'" value="'+esc(t.subject)+'"></div>'
        + '<div class="field" style="margin-bottom:12px"><label>Message</label>'
        +   '<textarea rows="5" data-f="body" data-id="'+t.id+'">'+esc(t.body)+'</textarea></div>'
        + '<div style="display:flex;gap:10px;align-items:center"><button class="btn sm tplSave" data-id="'+t.id+'">Save</button>'
        + (t.built_in ? '<span class="hint" style="margin:0">Built in — cannot be deleted</span>'
                      : '<button class="btn sm ghost danger tplDel" data-id="'+t.id+'">Delete</button>')
        + '</div></div>';
    }).join("") || '<p class="empty">No templates.</p>';
    function val(id,f){ return document.querySelector('[data-id="'+id+'"][data-f="'+f+'"]').value; }
    Array.prototype.forEach.call(document.querySelectorAll(".tplSave"), function(b){
      b.onclick = function(){ var id=b.dataset.id;
        post("/templates/"+id, {name:val(id,"name"), subject:val(id,"subject"), body:val(id,"body")}, "PATCH")
          .then(function(rr){ toast(rr.ok?"Saved":((rr.body&&rr.body.error)||"Couldn't save")); }); };
    });
    Array.prototype.forEach.call(document.querySelectorAll(".tplDel"), function(b){
      b.onclick = function(){ if(!confirm("Delete this template?")) return;
        api("/templates/"+b.dataset.id,{method:"DELETE"}).then(function(){ paneTemplates(g); }); };
    });
  });
}

function paneReminders(g){
  $("pane").innerHTML = head("Expiry reminders", "Sent automatically before the gallery expires. Each person gets each reminder once.")
    + '<div id="rm"><div class="spin"></div></div>';
  api("/galleries/"+g.id+"/reminders").then(function(r){
    var list = (r.body && r.body.reminders) || [];
    var h = g.expiresAt ? "" : '<p class="empty" style="margin-bottom:18px">This gallery has no expiry date, so reminders won\'t fire. Set one under Settings › General.</p>';
    h += list.length
      ? '<div class="scroll"><table><tr><th>When</th><th>Who</th><th></th></tr>'
        + list.map(function(x){
            var who = x.audience==="email" ? esc(x.email) : "Everyone who registers";
            var when = x.days_before===0 ? "On the expiry date" : x.days_before===1 ? "1 day before" : x.days_before+" days before";
            return '<tr><td>'+when+'</td><td>'+who+'</td><td style="text-align:right">'
                 + '<button class="link rmR" data-id="'+x.id+'">Remove</button></td></tr>'; }).join("")
        + '</table></div>'
      : '<p class="empty">No reminders yet.</p>';
    h += '<h3 class="sec">Add a reminder</h3>'
      +  '<div class="row2"><div class="field"><label>Days before expiry</label><input type="text" id="rDays" inputmode="numeric" value="7"></div>'
      +  '<div class="field"><label>Send to</label><select id="rAud"><option value="all">Everyone who registers</option>'
      +  '<option value="email">A specific address</option></select></div></div>'
      +  '<div class="field" id="rEmailWrap" hidden><label>Email address</label><input type="text" id="rEmail" placeholder="someone@example.com"></div>'
      +  tog("rDefault","Use this on new galleries","Saved as a default so you don't set it up each time.",true)
      +  '<div style="height:18px"></div><button class="btn" id="rAdd">Add reminder</button>';
    $("rm").innerHTML = h;
    $("rAud").onchange = function(){ $("rEmailWrap").hidden = this.value !== "email"; };
    $("rAdd").onclick = function(){
      post("/galleries/"+g.id+"/reminders", {daysBefore:parseInt($("rDays").value,10), audience:$("rAud").value,
            email:$("rEmail")?$("rEmail").value.trim():"", saveAsDefault:$("rDefault").checked})
        .then(function(rr){ if(!rr.ok) return toast((rr.body&&rr.body.error)||"Couldn't add that");
          toast("Reminder added"); paneReminders(g); });
    };
    Array.prototype.forEach.call(document.querySelectorAll(".rmR"), function(b){
      b.onclick = function(){ post("/galleries/"+g.id+"/reminders", {id:Number(b.dataset.id)}, "DELETE")
        .then(function(){ paneReminders(g); }); };
    });
  });
}

/* ---------- activity ---------- */
function paneActivity(g){
  $("pane").innerHTML = '<div class="spin"></div>';
  api("/galleries/"+g.id+"/stats").then(function(r){
    if (!r.ok) return ($("pane").innerHTML = '<p class="empty">Couldn\'t load activity.</p>');
    var d = r.body, c = d.counts || {};
    var LABEL = {landing:"Opened the link",register:"Registered",return:"Returned",view:"Viewed the gallery",
      download:"Downloaded a photo",download_all:"Downloaded everything",password_ok:"Entered the password",
      password_fail:"Wrong password",unlock:"Unlocked",asset_denied:"Blocked photo request"};
    var h = "";
    if (S.pane === "overview"){
      h = head("Overview","")
        + '<div class="kpis">'
        + [["Landings",c.landing||0],["Signups",c.register||0],["Views",c.view||0],["Returns",c["return"]||0],
           ["Downloads",(c.download||0)+(c.download_all||0)]]
          .map(function(k){ return '<div class="kpi"><b>'+k[1]+'</b><span>'+k[0]+'</span></div>'; }).join("")
        + '</div>';
      if (c.password_fail) h += '<p class="empty">'+c.password_fail+' failed password attempt'+(c.password_fail===1?"":"s")+'.</p>';
    } else if (S.pane === "people"){
      h = head("Who registered","Email addresses are collected, not verified — the password is the access control.")
        + (d.registrations.length
          ? '<div class="scroll"><table><tr><th>Email</th><th>Name</th><th>When</th></tr>'
            + d.registrations.map(function(x){ return '<tr><td>'+esc(x.email)+'</td><td>'+esc(x.name||"—")+'</td>'
              + '<td class="muted">'+fmtWhen(x.created_at)+'</td></tr>'; }).join("") + '</table></div>'
          : '<p class="empty">Nobody has registered yet.</p>');
    } else if (S.pane === "log"){
      h = head("Recent activity","")
        + (d.recent.length
          ? '<div class="scroll"><table><tr><th>What</th><th>When</th><th>IP</th></tr>'
            + d.recent.slice(0,80).map(function(e){ return '<tr><td>'+esc(LABEL[e.type]||e.type)+'</td>'
              + '<td class="muted">'+fmtWhen(e.created_at)+'</td><td class="muted">'+esc(e.ip||"")+'</td></tr>'; }).join("")
            + '</table></div>'
          : '<p class="empty">No activity yet.</p>');
    } else {
      h = head("Emails sent","")
        + ((d.mail||[]).length
          ? '<div class="scroll"><table><tr><th>To</th><th>Type</th><th>Status</th><th>When</th></tr>'
            + d.mail.map(function(m){
                var k = m.kind==="ready" ? "Gallery ready" : m.kind==="test" ? "Test" : m.kind==="copy" ? "Copy to you"
                      : /^expiring-(\d+)$/.test(m.kind) ? (RegExp.$1+"-day reminder") : "Expiring soon";
                var ok = m.status==="sent";
                return '<tr><td>'+esc(m.email)+'</td><td>'+k+'</td>'
                  + '<td style="color:'+(ok?"var(--ok)":"var(--bad)")+'">'+(ok?"Sent":"Failed")+'</td>'
                  + '<td class="muted">'+fmtWhen(m.created_at)+'</td></tr>'; }).join("") + '</table></div>'
          : '<p class="empty">No emails sent yet.</p>');
    }
    $("pane").innerHTML = h;
  });
}

/* ---------- create / edit ---------- */
function editorView(g){
  var isNew = !g;
  chrome({title:isNew?"New gallery":"Edit", back:function(){ isNew ? listView() : openGallery(g.id,"settings","general"); }});
  $("root").innerHTML = '<div class="wrap" style="padding-top:26px">'
    + '<div class="field"><label>Photos</label><select id="fAlbum">'
    +   (S.canUpload ? '<option value="__new__">Start a new album and upload</option>' : '')
    +   S.albums.map(function(a){ return '<option value="'+a.id+'">'+esc(a.name)+' — '+a.count+' photos</option>'; }).join("")
    +   '</select><div class="hint" id="albHint"></div></div>'
    + '<div class="row2">'
    +   '<div class="field"><label>Title</label><input type="text" id="fTitle" placeholder="Autumn Wedding"></div>'
    +   '<div class="field"><label>Subtitle</label><input type="text" id="fSub" placeholder="October 9th, 2026"></div></div>'
    + '<div class="row2">'
    +   '<div class="field"><label>Web address</label><input type="text" id="fSlug" placeholder="autumn-wedding"><div class="hint" id="slugHint"></div></div>'
    +   '<div class="field"><label>Expires on</label><input type="date" id="fExp"><div class="hint">Leave empty to never expire.</div></div></div>'
    + tog("fEmail","Ask visitors for their email","Anyone with the link can register.",false)
    + tog("fDl","Allow downloads","Clients can save full-size originals.",true)
    + tog("fPub","Publish now","Draft galleries return “not found”.",true)
    + '<div class="field" style="margin-top:20px"><label>Password</label><input type="password" id="fPw" placeholder="No password">'
    +   '<div class="hint">Leave empty for no password.</div></div>'
    + '<button class="btn" id="create">Create gallery</button></div>';
  function syncSlug(){
    var v = $("fSlug").value.trim().toLowerCase();
    var host = (S.publicUrl || location.origin).replace(/^https?:\/\//,"");
    $("slugHint").innerHTML = v ? "Clients visit <b>"+esc(host+"/g/"+v)+"</b>" : "Letters, numbers and dashes.";
  }
  function syncAlbum(){
    $("albHint").textContent = $("fAlbum").value === "__new__"
      ? "A new Immich album named after the title. You upload the photos on the next screen."
      : "The photos come from this album. Add or remove them in Immich and the gallery follows.";
  }
  $("fAlbum").addEventListener("change", syncAlbum); syncAlbum();
  $("fSlug").addEventListener("input", function(){ $("fSlug").dataset.touched="1"; syncSlug(); });
  $("fTitle").addEventListener("input", function(){
    if (!$("fSlug").dataset.touched){
      $("fSlug").value = $("fTitle").value.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40);
      syncSlug();
    }
  });
  syncSlug();
  $("create").onclick = function(){
    var fresh = $("fAlbum").value === "__new__";
    var body = { albumId:$("fAlbum").value, title:$("fTitle").value.trim(), subtitle:$("fSub").value.trim(),
      slug:$("fSlug").value.trim().toLowerCase(), requireEmail:$("fEmail").checked, allowDownload:$("fDl").checked,
      publish:$("fPub").checked,
      expiresAt: $("fExp").value ? new Date($("fExp").value+"T23:59:59").toISOString() : null };
    if (!body.title) return toast("Give the gallery a title");
    if (!body.slug) return toast("Give the gallery a web address");
    if (!body.albumId || (fresh && !S.canUpload)) return toast("Choose an album");
    if ($("fPw").value) body.password = $("fPw").value;
    $("create").disabled = true;

    function go(){
      post("/galleries", body).then(function(r){
        $("create").disabled = false;
        if (!r.ok) return toast((r.body&&r.body.error)||"Couldn't create");
        toast("Gallery created");
        api("/galleries").then(function(rr){
          S.galleries = rr.body||[];
          openGallery(r.body.id, fresh ? "photos" : "settings", fresh ? "upload" : "cover");
        });
      });
    }
    if (!fresh) return go();
    post("/albums", { name: body.title }).then(function(r){
      if (!r.ok || !r.body || !r.body.id){
        $("create").disabled = false;
        return toast((r.body&&r.body.error)||"Couldn't create the album in Immich");
      }
      body.albumId = r.body.id;
      refreshAlbums(go);
    });
  };
}
})();
</script>
