        toast(r.ok ? "Test sent to " + r.body.sentTo : ((r.body && r.body.error) || "Couldn’t send the test"));
      });
    };
    $("mReview").onclick = function(){ review(); };
    apply();

    function review(){
      var box = $("mReviewBox");
      box.innerHTML = '<div class="spin"></div>';
      post("/mailings/plan", body()).then(function(r){
        if (!r.ok){ box.innerHTML = '<p class="hint" style="color:var(--bad)">'+esc((r.body && r.body.error) || "Can’t send that yet")+'</p>'; return; }
        var d = r.body, left = Object.keys(d.skipped || {}).map(function(k){ return d.skipped[k] + " " + (SKIP_WHY[k] || k); });
        var leftN = Object.keys(d.skipped || {}).reduce(function(n, k){ return n + d.skipped[k]; }, 0);
        var blockers = [];
        if (!d.count) blockers.push("There is nobody to send this to.");
        if (d.overCap) blockers.push("That is " + d.count + " people, over the limit of " + d.cap + " per mailing. Narrow the list by gallery, or tick fewer people.");
        if (!mail.brandAddress) blockers.push("Set BRAND_ADDRESS (your postal address or PO box) first. It must appear in every mailing’s footer.");
        if (!mail.signedIn) blockers.push("Sign in to the admin panel in your browser to send real mail.");
        if (!mail.sendOn) blockers.push("Sending is switched off (MAIL_SEND=off), so this would only be a simulation.");
        box.innerHTML = '<div style="border:1px solid var(--line);padding:16px;margin-top:20px;max-width:620px">'
          + '<p style="margin:0 0 10px;font-size:14px;line-height:1.6">Send <b>'+esc(d.templateName)+'</b> to <b>'+d.count+' '+(d.count === 1 ? "person" : "people")+'</b>.'
          + (leftN ? ' '+leftN+' left out: '+esc(left.join(", "))+'.' : '')+' <b>This can’t be undone.</b></p>'
          + (d.daysNeeded > 1 ? '<p class="hint" style="margin:0 0 10px">The daily sending limit is '+d.dayCap+', so this will run over about '+d.daysNeeded+' days on its own.</p>' : '')
          + blockers.map(function(b){ return '<p class="hint" style="color:var(--bad);margin:0 0 10px">'+esc(b)+'</p>'; }).join("")
          + '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="mGo" type="button"'+(blockers.length ? " disabled" : "")+'>Send to '+d.count+'</button>'
          + '<button class="btn ghost" id="mNo" type="button">Not yet</button></div></div>';
        $("mNo").onclick = function(){ box.innerHTML = ""; };
        if (blockers.length) return;
        var key = mailKey();
        $("mGo").onclick = function(){
          $("mGo").disabled = true; $("mGo").textContent = "Sending…";
          post("/mailings", body({ key:key, planHash:d.planHash }))
            .then(function(rr){
              if (rr.status === 409 && rr.body && /changed/i.test(rr.body.error || "")){ toast(rr.body.error); return review(); }
              if (!rr.ok){ $("mGo").disabled = false; $("mGo").textContent = "Send to " + d.count; return toast((rr.body && rr.body.error) || "Couldn’t send"); }
              toast("Sending started");
              mailingView(rr.body.mailing.id);
            });
        };
      });
    }
  });
}

var MV = { seq:0, timer:null };
function mailingView(id){
  var seq = ++MV.seq; clearTimeout(MV.timer);
  mailChrome("Mailing", "", mailingsView);
  $("root").innerHTML = '<div class="wrap" style="padding-top:26px"><div id="mvBody"><div class="spin"></div></div></div>';
  function load(){
    api("/mailings/" + id).then(function(r){
      if (seq !== MV.seq || !$("mvBody")) return;
      if (!r.ok){ $("mvBody").innerHTML = '<p class="empty">Couldn’t load that mailing.</p>'; return; }
      var m = r.body.mailing, c = m.counts, recips = r.body.recipients || [];
      var active = m.status === "queued" || m.status === "sending";
      var done = c.sent + c.failed + c.simulated + c.cancelled, pct = m.total ? Math.min(100, Math.round(done / m.total * 100)) : 100;
      var STATUS = { queued:"Waiting", sending:"Sending", sent:"Sent", failed:"Failed", skipped:"Left out", cancelled:"Cancelled", simulated:"Simulated" };
      var head = { queued:"Starting", sending:"Sending", paused:"Paused", cancelled:"Cancelled", done:"Finished" }[m.status] || m.status;
      $("tSub").textContent = m.template + " · " + head;
      $("mvBody").innerHTML =
          (m.dryRun ? '<p class="hint" style="margin:0 0 14px">Dry run: nothing was actually sent.</p>' : '')
        + (m.status === "paused" ? '<p class="hint" style="color:var(--bad);margin:0 0 14px">'+esc(m.error || "Paused.")+'</p>' : '')
        + (m.waitingForDailyLimit ? '<p class="hint" style="margin:0 0 14px">Waiting for the daily sending limit to lift. It will carry on by itself.</p>' : '')
        + '<p style="margin:0 0 6px;font-size:14px"><b>'+esc(m.subject)+'</b></p>'
        + '<div class="kpis" style="margin-top:14px">'
        +   [["Sent", c.sent + c.simulated],["Waiting", c.queued + c.sending],["Failed", c.failed],["Left out", c.skipped],["Unsubscribed", m.unsubscribed]]
              .map(function(k){ return '<div class="kpi"><b>'+k[1]+'</b><span>'+k[0]+'</span></div>'; }).join("")
        + '</div>'
        + (active || m.status === "paused" ? '<div class="qbar big" style="max-width:520px;margin:0 0 18px"><i style="width:'+pct+'%"></i></div>' : '')
        + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px">'
        +   (active || m.status === "paused" ? '<button class="btn sm ghost danger" id="mvCancel" type="button">Cancel the rest</button>' : '')
        +   (m.status === "paused" ? '<button class="btn sm" id="mvResume" type="button">Resume</button>' : '')
        +   (c.failed && m.status !== "cancelled" ? '<button class="btn sm ghost" id="mvRetry" type="button">Retry '+c.failed+' failed</button>' : '')
        + '</div>'
        + '<div class="scroll"><table><tr><th>Email</th><th>Name</th><th>Gallery</th><th>Status</th><th></th></tr>'
        + recips.map(function(x){ return '<tr><td>'+esc(x.email)+'</td><td>'+esc(x.name || "—")+'</td><td class="muted">'+esc(x.gallery || "")+'</td>'
            + '<td>'+esc(STATUS[x.status] || x.status)+'</td><td class="muted">'+esc(x.status === "skipped" ? (SKIP_WHY[x.error] || x.error || "") : (x.error || ""))+'</td></tr>'; }).join("")
        + '</table></div>';
      function act(name){ return post("/mailings/" + id + "/" + name, {}).then(function(rr){ if (!rr.ok) toast((rr.body && rr.body.error) || "Couldn’t do that"); load(); }); }
      if ($("mvCancel")) $("mvCancel").onclick = function(){ if (confirm("Stop this mailing? People it hasn’t reached yet won’t get it.")) act("cancel"); };
      if ($("mvResume")) $("mvResume").onclick = function(){ act("resume"); };
      if ($("mvRetry")) $("mvRetry").onclick = function(){ act("retry"); };
      if (active) MV.timer = setTimeout(function(){ if (seq === MV.seq) load(); }, 3000);
    });
  }
  load();
}

          + (m.dryRun ? ' <span class="muted">(dry run)</span>' : '')+'</td><td>'+m.total+'</td><td>'+(m.counts.sent + m.counts.simulated)+'</td><td>'+m.counts.failed+'</td><td>'+m.unsubscribed+'</td><td>'+esc(NAME[m.status] || m.status)+'</td></tr>'; }).join("")
      + '</table></div>';
    Array.prototype.forEach.call(document.querySelectorAll(".mlOpen"), function(b){ b.onclick = function(){ mailingView(Number(b.dataset.id)); }; });
  });
}

function suppressionsView(){
  mailChrome("Unsubscribed", "People who won’t be mailed");
  $("root").innerHTML = '<div class="wrap" style="padding-top:26px"><div id="suBody"><div class="spin"></div></div></div>';
  var WHY = { unsubscribed:"Unsubscribed", bounced:"Bounced", complained:"Marked as spam", manual:"Added by you" };
  function paint(list){
    $("suBody").innerHTML =
        '<p class="lede" style="color:var(--muted);font-size:13px;line-height:1.6;max-width:620px;margin:0 0 18px">These people are left out of every mailing. '
      + '“Mailings only” still lets them get gallery notices and reminders; “Everything” stops those too. Remove someone only if they asked to be mailed again.</p>'
      + (list.length ? '<div class="scroll"><table><tr><th>Email</th><th>Why</th><th>Stops</th><th>When</th><th></th></tr>'
          + list.map(function(x){ return '<tr><td>'+esc(x.email)+'</td><td>'+esc(WHY[x.reason] || x.reason)+'</td><td>'+(x.scope === "all" ? "Everything" : "Mailings only")
              + '</td><td class="muted">'+fmtWhen(x.created_at)+'</td><td style="text-align:right"><button class="btn sm ghost danger suDel" data-e="'+esc(x.email)+'" data-w="'+esc(WHY[x.reason] || x.reason)+'">Remove</button></td></tr>'; }).join("")
          + '</table></div>'
        : '<p class="empty">Nobody has unsubscribed.</p>')
      + '<h3 class="sec">Add an address</h3><div class="row2"><div class="field"><label>Email</label><input type="text" id="suE" placeholder="someone@example.com"></div>'
      + '<div class="field"><label>Stop</label><select id="suS"><option value="marketing">Mailings only</option><option value="all">Everything</option></select></div></div>'

    $("suAdd").onclick = function(){

        if (!r.ok) return toast((r.body && r.body.error) || "Couldn’t add that");
        toast("Added"); paint(r.body.suppressions);
      });
    };
    Array.prototype.forEach.call(document.querySelectorAll(".suDel"), function(b){
      b.onclick = function(){
        if (!confirm("Remove " + b.dataset.e + " (" + b.dataset.w + ")? They will be mailed again.")) return;
        post("/suppressions", { email:b.dataset.e, confirm:true }, "DELETE").then(function(r){
          if (!r.ok) return toast((r.body && r.body.error) || "Couldn’t remove that");
          toast("Removed"); paint(r.body.suppressions);
        });
      };

  api("/suppressions").then(function(r){ if ($("suBody")) paint((r.body && r.body.suppressions) || []); });

            + '<div class="field" style="margin-bottom:10px"><label>Name</label><input type="text" data-f="name" data-id="'+t.id+'" value="'+esc(t.name)+'"></div>'
            + '<div class="field" style="margin-bottom:10px"><label>Subject</label><input type="text" data-f="subject" data-id="'+t.id+'" value="'+esc(t.subject)+'"></div>'
            + '<div class="field" style="margin-bottom:12px"><label>Message</label><textarea rows="6" data-f="body" data-id="'+t.id+'">'+esc(t.body)+'</textarea></div>'
            + '<div style="display:flex;gap:10px"><button class="btn sm mtSave" data-id="'+t.id+'" type="button">Save</button>'

        + '<button class="btn" id="mtNew" type="button">New template</button>';
      function val(id, f){ return document.querySelector('[data-id="'+id+'"][data-f="'+f+'"]').value; }
      Array.prototype.forEach.call(document.querySelectorAll(".mtSave"), function(b){
        b.onclick = function(){ post("/templates/" + b.dataset.id, { name:val(b.dataset.id,"name"), subject:val(b.dataset.id,"subject"), body:val(b.dataset.id,"body") }, "PATCH")
          .then(function(rr){ toast(rr.ok ? "Saved" : ((rr.body && rr.body.error) || "Couldn’t save")); }); };
      });

      };
    });

  paint();
}

/* ---------- connections: the keys and settings, with a Test button for each ---------- */
var CN = { seq:0, data:null };
var CN_GROUPS = [["immich","Immich"],["email","Email"],["public","Public address"],["brand","Your business"],["admin","Sign-in"],["mailings","Mailings"],
                 ["dns","Dynamic DNS"],["website","Website publishing"],["dropbox","Dropbox"],["backups","Backups"],["downloads","Downloads"],["health","Self-checks"]];
var CN_TESTS = { immich:["immich","Test Immich"], email:["email","Send a test email"], "public":["public","Test address"], dropbox:["dropbox","Test Dropbox"] };
function connectionsView(){
  var seq = ++CN.seq;
  chrome({ title:"Connections", summary:"Your keys and settings", section:"connections",
    actions:[{ label:"Download settings file", onClick:function(){ location.href = "/api/admin/connections/export"; } }] });
  $("root").innerHTML = '<div class="wrap" style="padding-top:26px"><div id="cnBody"><div class="spin"></div></div></div>';
  api("/connections").then(function(r){
    if (seq !== CN.seq || !$("cnBody")) return;
    if (!r.ok){ $("cnBody").innerHTML = '<p class="empty">Couldn’t load the settings.</p>'; return; }
    CN.data = r.body; paintConnections();
  });
}
function cnResults(box, res){
  box.innerHTML = (res.checks || []).map(function(c){
    var cls = c.ok ? (c.warn ? "warn" : "ok") : "bad", ic = c.ok ? (c.warn ? "!" : "✓") : "✗";
    return '<p class="hint" style="margin:6px 0;color:var(--'+(c.ok ? (c.warn ? "muted" : "fg") : "bad")+')"><b>'+ic+' '+esc(c.label)+'</b>'+(c.detail ? " — "+esc(c.detail) : "")
      + (c.fix ? '<br><span style="color:var(--muted)">'+esc(c.fix)+'</span>' : "")+'</p>';
  }).join("");
}
function paintConnections(){
  var d = CN.data, box = $("cnBody"); if (!box) return;
  var byGroup = {}; d.meta.forEach(function(m){ (byGroup[m.group] = byGroup[m.group] || []).push(m); });
  var hl = d.health || {}, hk = Object.keys(hl);
  var html = '<p class="lede" style="color:var(--muted);font-size:13px;line-height:1.6;max-width:640px;margin:0 0 20px">Everything this server connects to. '
    + 'A setting marked <b>compose file</b> started from your compose file; saving a different value here overrides it. '
    + (d.signedIn ? "" : '<b style="color:var(--bad)">Sign in with your password in the browser to change anything here.</b> ')
    + 'Keys are never shown again once saved.</p>';
  if (hk.length) html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px">' + hk.map(function(k){
    var v = hl[k]; return '<span class="hint" style="margin:0;border:1px solid var(--line);padding:5px 10px">'+(v.ok === true ? "✓ " : v.ok === false ? "✗ " : "")+esc(v.title || k)+': '+esc(v.detail || "")+'</span>'; }).join("") + '</div>';
  CN_GROUPS.forEach(function(g, gi){
    var rows = byGroup[g[0]]; if (!rows || !rows.length) return;
    var inner = rows.map(function(m){
      var s = d.settings[m.env] || {}, locked = false, fromEnv = !!s.fromEnv;
      var ph = locked ? "Set in your compose file" : (m.secret && s.set ? "Saved. Leave blank to keep it." : (m.def !== "" && m.def !== undefined ? "Default: " + m.def : ""));
      return '<div class="field"><label for="cn_'+m.env+'">'+esc(m.label)+(fromEnv ? ' <span class="muted" style="font-weight:400">· from compose file; saving overrides it</span>' : '')+'</label>'
        + '<input type="'+(m.secret ? "password" : "text")+'" id="cn_'+m.env+'" data-env="'+m.env+'" autocomplete="off" spellcheck="false"'
        + (locked || !d.signedIn ? " disabled" : "")+' value="'+esc(m.secret ? "" : (s.value || ""))+'" placeholder="'+esc(ph)+'">'
        + (m.help ? '<div class="hint">'+esc(m.help)+'</div>' : "")+'</div>';
    }).join("");
    var t = CN_TESTS[g[0]];
    if (g[0] === "brand") inner += '<div class="field" id="cnLogo"><label>Logo</label><div class="spin"></div></div>';
    var body = inner + '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px">'
      + '<button class="btn sm cnSave" data-g="'+g[0]+'" type="button"'+(d.signedIn ? "" : " disabled")+'>Save</button>'
      + (t ? '<button class="btn sm ghost cnTest" data-g="'+g[0]+'" data-t="'+t[0]+'" type="button">'+t[1]+'</button>' : "")
      + '</div><div id="cnRes_'+g[0]+'" style="margin-top:10px"></div>';
    html += gi < 4 ? '<div style="border:1px solid var(--line);padding:18px;margin-bottom:16px;max-width:660px"><h3 class="sec" style="margin-top:0">'+g[1]+'</h3>'+body+'</div>'
                   : '<details style="max-width:660px;margin-bottom:10px"><summary style="cursor:pointer;font-weight:600;padding:8px 0">'+g[1]+'</summary><div style="padding:6px 0 12px">'+body+'</div></details>';
  });
  box.innerHTML = html;
  paintLogo();
  function gather(g){
    var out = {};
    Array.prototype.forEach.call(box.querySelectorAll('[data-env]'), function(el){
      var m = d.meta.filter(function(x){ return x.env === el.dataset.env; })[0];
      if (m && m.group === g && !el.disabled) out[m.env] = el.value.trim();
    });
    return out;
  }
  Array.prototype.forEach.call(box.querySelectorAll(".cnSave"), function(b){
    b.onclick = function(){
      b.disabled = true;
      put("/connections", gather(b.dataset.g), "PUT").then(function(r){
        b.disabled = false;
        if (!r.ok) return toast((r.body && r.body.error) || "Couldn’t save");
        d.settings = r.body.settings;
        toast(r.body.restartNeeded && r.body.restartNeeded.length ? "Saved. Restart the server for this to take effect." : "Saved");
        paintConnections();
      });
    };
  });
  Array.prototype.forEach.call(box.querySelectorAll(".cnTest"), function(b){
    b.onclick = function(){
      var g = b.dataset.g, vals = gather(g), body = {};
      if (g === "immich"){ body = { url:vals.IMMICH_URL, key:vals.IMMICH_API_KEY, writeKey:vals.IMMICH_WRITE_KEY }; }
      else if (g === "email"){ body = { apiKey:vals.RESEND_API_KEY, from:vals.MAIL_FROM, replyTo:vals.MAIL_REPLY_TO }; }
      else if (g === "public"){ body = { url:vals.PUBLIC_URL }; }
      else if (g === "dropbox"){ body = { key:vals.DROPBOX_APP_KEY, secret:vals.DROPBOX_APP_SECRET, refresh:vals.DROPBOX_REFRESH_TOKEN }; }
      var label = b.textContent; b.disabled = true; b.textContent = "Testing…";
      post("/connections/test/" + b.dataset.t, body).then(function(r){
        b.disabled = false; b.textContent = label;
        if (!r.ok) return toast((r.body && r.body.error) || "Couldn’t run the test");
        cnResults($("cnRes_" + g), r.body);
      });
    };
  });
}

/* the logo: one PNG, black artwork on a transparent background. Shown on a light and a dark patch because that is how it
   is used (the page colours it), and refused with advice when it has a solid background. */
function paintLogo(){
  var box = $("cnLogo"); if (!box) return;
  var signed = CN.data && CN.data.signedIn;
  api("/logo").then(function(r){
    if (!$("cnLogo") || !r.ok) return;
    var mt = r.body && r.body.light, custom = !!mt, v = "/brand/logo?v=" + (mt || "default");
    var patch = function(bg, fg){ return '<span style="display:inline-block;width:96px;height:96px;background:'+bg+';border:1px solid var(--line);position:relative">'
      + '<span style="position:absolute;inset:16px;background:'+fg+';-webkit-mask:url('+v+') center/contain no-repeat;mask:url('+v+') center/contain no-repeat"></span></span>'; };
    box.innerHTML = '<label>Logo</label><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0 10px">'
      + patch("#ffffff", "#111111") + patch("#151515", "#ffffff")
      + '<span class="hint" style="margin:0">' + (custom ? "Your logo" : "The default mark. Upload your own to replace it.") + '</span></div>'
      + '<div style="display:flex;gap:10px;flex-wrap:wrap">'
      + '<button class="btn sm" type="button" id="logoUp"' + (signed ? "" : " disabled") + '>' + (custom ? "Replace logo" : "Upload a logo") + '</button>'
      + (custom ? '<button class="btn sm ghost" type="button" id="logoDel"' + (signed ? "" : " disabled") + '>Use the default</button>' : "")
      + '<input type="file" id="logoFile" accept="image/png" hidden></div>'
      + '<div class="hint">A PNG with a <b>transparent background</b> and black artwork; 512 by 512 pixels is plenty. It appears on gallery covers, in emails and as the browser tab icon. A change can take a few minutes to show in browsers that have already loaded the old one.</div>'
      + '<div id="logoMsg" class="hint" style="color:var(--bad)"></div>';
    $("logoUp").onclick = function(){ $("logoFile").click(); };
    $("logoFile").onchange = function(){
      var f = $("logoFile").files[0]; $("logoFile").value = ""; if (!f) return;
      $("logoMsg").textContent = "";
      /* a PNG can carry an alpha channel and still be solid, so look at the pixels: a logo with nothing transparent
         would be drawn as a solid block */
      var solid = function(){
        return createImageBitmap(f).then(function(bm){
          var c = document.createElement("canvas"), n = 96; c.width = c.height = n;
          var x = c.getContext("2d"); x.drawImage(bm, 0, 0, n, n);
          var d = x.getImageData(0, 0, n, n).data;
          for (var i = 3; i < d.length; i += 4) if (d[i] < 250) return false;
          return true;
        }).catch(function(){ return false; });
      };
      solid().then(function(isSolid){
        if (isSolid){ $("logoMsg").textContent = "Every pixel of this image is solid, so it would show as a block. Export it again with a transparent background: black artwork, nothing behind it."; return; }
        api("/logo?variant=light", { method:"POST", headers:{ "Content-Type":"image/png" }, body:f }).then(function(u){
          if (!u.ok){ $("logoMsg").textContent = (u.body && u.body.error) || "Couldn’t upload that"; return; }
          toast("Logo updated"); paintLogo();
        });
      });
    };
    if ($("logoDel")) $("logoDel").onclick = function(){
      api("/logo?variant=light", { method:"DELETE" }).then(function(){ toast("Back to the default mark"); paintLogo(); });
    };
  });
}
function put(p, d){ return api(p, { method:"PUT", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(d || {}) }); }
