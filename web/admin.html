<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="/brand/logo">
<link rel="icon" type="image/png" media="(prefers-color-scheme: dark)" href="/brand/logo?theme=dark">
<link rel="apple-touch-icon" href="/brand/logo">
<title>Galleries</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--muted:#8a8a8a;--line:#e6e6e6;--soft:#f7f7f7;--ok:#1f7a3f;--warn:#9a6b00;--bad:#b3261e;
  --font:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button,input,select,textarea{font-family:inherit;font-size:16px}
a{color:inherit}
[hidden]{display:none !important}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border:1px solid var(--fg);
  background:var(--fg);color:#fff;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  white-space:nowrap;cursor:pointer;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn.ghost{background:transparent;color:var(--fg)}
.btn.sm{padding:8px 13px;font-size:10px}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.4;cursor:default}
.btn[hidden]{display:none !important}
.link{background:none;border:none;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  cursor:pointer;padding:7px}
.link:hover{color:var(--fg)}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:12px;padding:0 18px;height:60px;max-width:1400px;margin:0 auto}
.back{width:34px;height:34px;display:grid;place-items:center;border:none;background:none;cursor:pointer;color:var(--fg);flex:0 0 auto}
.back:hover{background:var(--soft);border-radius:50%}
.ttl{min-width:0;flex:1 1 auto;position:relative}
.secbtn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;max-width:100%}
.secbtn svg{flex:0 0 auto;transition:transform .15s}
.secbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.secmenu{position:absolute;top:calc(100% + 12px);left:-8px;min-width:210px;background:#fff;border:1px solid var(--line);
  border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:6px;z-index:30}
.secmenu button{display:block;width:100%;text-align:left;border:0;background:none;cursor:pointer;padding:10px 12px;
  border-radius:6px;font:inherit;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--fg)}
.secmenu button:hover{background:var(--soft)}
.secmenu button.on{font-weight:800}
.secmenu button.on::after{content:"\2713";float:right;margin-left:14px}
.ttl h1{margin:0;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl .sub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;border-radius:999px;
  border:1px solid var(--line);color:var(--muted);flex:0 0 auto}
.pill.live{border-color:var(--ok);color:var(--ok)}
.pill.draft{border-color:var(--warn);color:var(--warn)}
.pill.exp{border-color:var(--bad);color:var(--bad)}
@media(max-width:700px){.topin{gap:8px;padding:0 12px}.ttl .sub{display:none}}

/* ---------- layout ---------- */
html{scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
.wrap{max-width:1400px;margin:0 auto;padding:0 18px 90px}
.detail{display:grid;grid-template-columns:230px minmax(0,1fr);gap:0;max-width:1400px;margin:0 auto}
/* ---------- the gallery rail (all of a gallery's tabs, and the Design editor) ---------- */
#app.dzwide #sidebar,#app.dzwide #tabbar{display:none!important}
#app.dzwide #appmain{padding-bottom:0}
#app.dzfull #appmain{display:flex;flex-direction:column;height:100vh;height:100dvh}
#app.dzfull #root{flex:1 1 auto;min-height:0;overflow:hidden}
.dz{display:grid;height:100%;background:var(--bg)}
.dz.dzgen{grid-template-columns:232px minmax(0,1fr);height:auto;min-height:calc(100vh - var(--hdr,60px));min-height:calc(100dvh - var(--hdr,60px))}
.dzrail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.dz.dzgen .dzrail{position:sticky;top:var(--hdr,60px);height:calc(100vh - var(--hdr,60px));height:calc(100dvh - var(--hdr,60px));overflow-y:auto}
.dzrcov{display:block;width:100%;aspect-ratio:3/2;border:0;border-bottom:1px solid var(--line);background:var(--raised) center/cover no-repeat;cursor:pointer;padding:0;color:var(--muted);font:inherit;font-size:13px;flex:0 0 auto}
.dzicons{display:flex;justify-content:space-around;border-bottom:1px solid var(--line);flex:0 0 auto}
.dzicons button{flex:1;height:50px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.dzicons button:hover{color:var(--fg)}.dzicons button.on{color:var(--fg);border-bottom-color:var(--primary)}
.dz.dzgen .main{min-width:0}
@media(max-width:899px){
  .dz.dzgen{display:block;min-height:0}
  .dz.dzgen .dzrail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .dz.dzgen .dzrcov{display:none}
}
.side{border-right:1px solid var(--line);min-height:calc(100vh - 60px);padding-bottom:40px}
.side .cov{aspect-ratio:3/2;background:var(--soft) center/cover no-repeat;border-bottom:1px solid var(--line)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;height:52px;display:grid;place-items:center;border:none;background:none;cursor:pointer;
  color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--fg);border-bottom-color:var(--fg)}
.tabs button:hover{color:var(--fg)}
.navhead{font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:20px 18px 8px}
.navitem{display:flex;align-items:center;gap:10px;width:100%;padding:12px 18px;border:none;background:none;cursor:pointer;
  font-size:13px;text-align:left;color:var(--fg)}
.navitem:hover{background:var(--soft)}
.navitem.on{background:var(--soft);font-weight:600}
.navitem .tag{margin-left:auto;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 7px;border-radius:999px;background:var(--line);color:var(--muted)}
.navitem.on .tag,.navitem .tag.on{background:var(--ok);color:#fff}
/* ---------- sets in the side rail ---------- */
.navset{display:flex;align-items:center}
.navset .navitem{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navset .sdots{border:0;background:none;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;
  padding:10px 14px 10px 4px;opacity:0}
.navset:hover .sdots,.navset.on .sdots{opacity:1}
.navset .sdots:hover{color:var(--fg)}
.navset.on{background:var(--soft)}
.addset{display:block;width:100%;text-align:left;border:0;background:none;cursor:pointer;color:var(--muted);
  padding:12px 18px;font:inherit;font-size:12px;letter-spacing:.04em}
.addset:hover{color:var(--fg);background:var(--soft)}

/* ---------- a set's own screen ---------- */
.sethead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:0 0 18px}
.sethead h2{margin:0 0 2px}
.sethead .lede{margin:0}
.setacts{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.setacts .btn.ghost{padding:8px 11px}
.dropzone{min-height:120px;transition:background .15s,outline-color .15s;outline:2px dashed transparent;outline-offset:6px}
.dropzone.over{outline-color:var(--fg);background:var(--soft)}

.main{padding:28px 30px 90px;min-width:0}
.main h2{margin:0 0 4px;font-size:17px;font-weight:600;letter-spacing:.02em}
.main .lede{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 24px}
@media(max-width:860px){
  .detail{grid-template-columns:1fr}
  .side{border-right:none;border-bottom:1px solid var(--line);min-height:0;padding-bottom:0}
  .side .cov{aspect-ratio:16/6}
  .navrow{display:flex;overflow-x:auto;gap:4px;padding:10px 12px;-webkit-overflow-scrolling:touch}
  .navhead{display:none}
  .navitem{width:auto;white-space:nowrap;padding:9px 14px;border:1px solid var(--line);font-size:12px}
  .navitem.on{border-color:var(--fg)}
  .navset{flex:0 0 auto;border:1px solid var(--line)}
  .navset.on{border-color:var(--fg)}
  .navset .navitem{border:0}
  .navset .sdots{opacity:1;padding:9px 10px 9px 0}
  .addset{width:auto;white-space:nowrap;padding:9px 14px;border:1px dashed var(--line)}
  .sethead{flex-wrap:wrap}
  .main{padding:22px 16px 90px}
}
@media(min-width:861px){.navrow{display:block}}

/* ---------- cards ---------- */
h3.sec{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin:34px 0 14px;color:var(--muted)}
h3.sec:first-child{margin-top:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{border:1px solid var(--line);cursor:pointer;transition:border-color .2s}
.card:hover{border-color:var(--fg)}
.card .ph{aspect-ratio:3/2;background:var(--soft) center/cover no-repeat}
.card .body{padding:14px 15px 16px}
.card h3{margin:0 0 3px;font-size:13px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sub{font-size:11.5px;color:var(--muted);margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
.tag2{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border:1px solid var(--line);color:var(--muted)}
.tag2.live{border-color:var(--ok);color:var(--ok)}
.tag2.draft{border-color:var(--warn);color:var(--warn)}
.tag2.exp{border-color:var(--bad);color:var(--bad)}
.stats{display:flex;gap:16px;font-size:11px;color:var(--muted)}
.stats b{display:block;font-size:16px;font-weight:600;color:var(--fg)}

/* ---------- forms ---------- */
.field{margin-bottom:18px;max-width:620px}
.field label{display:block;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin-bottom:7px}
.field input[type=text],.field input[type=date],.field input[type=password],.field input[type=email],.field select,.field textarea{
  width:100%;padding:12px 13px;border:1px solid var(--line);background:#fff;outline:none}
.field textarea{resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--fg)}
.hint{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:620px}
@media(max-width:700px){.row2{grid-template-columns:1fr}}
.toggle{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-top:1px solid var(--line);max-width:620px}
.toggle:last-of-type{border-bottom:1px solid var(--line)}
.toggle input{width:20px;height:20px;margin:2px 0 0;flex:0 0 auto;accent-color:var(--fg)}
.toggle .t{font-size:13px;font-weight:600;display:block}
.toggle .d{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5;display:block}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:7px;max-height:300px;overflow:auto;
  border:1px solid var(--line);padding:7px;max-width:620px}
.picker .p{aspect-ratio:1;background:var(--soft) center/cover no-repeat;cursor:pointer;border:2px solid transparent}
.picker .p.on{border-color:var(--fg)}

/* ---------- uploads ---------- */
.drop{border:1.5px dashed var(--line);background:var(--soft);padding:32px 20px;text-align:center;max-width:620px}
.drop.on{border-color:var(--fg);background:var(--bg)}
.drop svg{color:var(--muted)}
.drop p{margin:9px 0 14px;font-size:14px}
.drop .hint{margin-top:13px}
.queue{margin-top:22px;max-width:620px}
.qtot{display:flex;align-items:center;gap:12px;margin:0 0 11px}
.qbar.big{flex:1;height:5px}
.qpct{font-size:12px;font-variant-numeric:tabular-nums;color:var(--fg);min-width:38px;text-align:right}
.qhead{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.qhead .qdim{color:var(--muted);font-variant-numeric:tabular-nums}
.qhead .link{margin-left:8px}
.qfail{color:var(--bad)}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) 110px 104px;gap:12px;align-items:center;
  padding:8px 0;border-top:1px solid var(--line);font-size:12.5px}
.qn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qbar{height:3px;background:var(--line);position:relative;overflow:hidden}
.qbar i{position:absolute;top:0;bottom:0;left:0;background:var(--fg);transition:width .2s}
.qs{color:var(--muted);text-align:right}
.qrow.done .qs{color:var(--ok)}
.qrow.fail .qs{color:var(--bad)}
.qrow.fail .qbar i{background:var(--bad)}
@media(max-width:700px){.qrow{grid-template-columns:minmax(0,1fr) 96px}.qbar{display:none}}

/* ---------- compose ---------- */
.compose{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:26px;align-items:start}
@media(max-width:1100px){.compose{grid-template-columns:1fr}}
.pane{border:1px solid var(--line);background:var(--soft);padding:14px;position:sticky;top:76px}
@media(max-width:1100px){.pane{position:static}}
.pane h4{margin:0 0 10px;font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.pvfit{width:100%;height:600px;overflow:hidden;border:1px solid var(--line);background:#fff}
/* a gallery screen with an email preview: exactly the window tall, the form scrolls by itself, and so does the preview */
.main.fitview{height:calc(100vh - var(--hdr,89px));height:calc(100dvh - var(--hdr,89px));overflow:hidden;padding-bottom:20px;display:flex;flex-direction:column}
.main.fitview>h2,.main.fitview>.lede{flex:0 0 auto}
.main.fitview>#cp{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.main.fitview .compose{flex:1 1 auto;min-height:0;align-items:stretch}
.main.fitview .compose>div:first-child{overflow-y:auto;min-height:0;padding-bottom:20px}
.main.fitview .pane{position:static;height:100%;min-height:0;display:flex;flex-direction:column;box-sizing:border-box}
.main.fitview .pvfit{flex:1 1 auto;min-height:0;height:auto}
@media(max-width:1100px){.main.fitview{height:auto;overflow:visible;display:block}.main.fitview .compose>div:first-child{overflow:visible}.main.fitview .pane{height:auto}.main.fitview .pvfit{height:520px}}
.pvfit iframe{display:block;border:0;background:#fff;transform-origin:0 0;width:640px;height:600px}
.subjline{font-size:13px;font-weight:600;padding:10px 12px;background:#fff;border:1px solid var(--line);border-bottom:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vars code{background:var(--soft);padding:1px 5px;font-size:11px}
.tplrow{display:flex;gap:8px;align-items:center;margin-bottom:18px;flex-wrap:wrap;max-width:620px}
.tplrow select{flex:1 1 170px;padding:11px 12px;border:1px solid var(--line);background:#fff}

/* ---------- data ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:12px;margin-bottom:26px;max-width:760px}
.kpi{border:1px solid var(--line);padding:15px 14px}
.kpi b{display:block;font-size:23px;font-weight:600}
.kpi span{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:12.5px;max-width:860px}
th{text-align:left;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  padding:9px 10px;border-bottom:1px solid var(--line);font-weight:700}
td{padding:11px 10px;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.empty{color:var(--muted);font-size:13px;line-height:1.6;max-width:460px}

/* ---------- login ---------- */
#login{min-height:100svh;display:none;place-items:center;padding:24px}
#login.on{display:grid}
.lbox{width:min(360px,100%);text-align:center}
.lbox .mk{width:52px;height:52px;margin:0 auto 22px;background:var(--fg);
  -webkit-mask:url(/brand/logo) center/contain no-repeat;mask:url(/brand/logo) center/contain no-repeat}
.lbox h1{font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;margin:0 0 24px}
.lbox input{width:100%;padding:14px;border:1px solid var(--line);text-align:center;outline:none;letter-spacing:.04em;margin-bottom:10px}
.lbox .btn{width:100%}
.err{color:var(--bad);font-size:12px;margin-top:14px;min-height:18px}

#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:#111;color:#fff;padding:13px 22px;
  font-size:12px;letter-spacing:.07em;z-index:60;opacity:0;pointer-events:none;transition:.26s;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.act{pointer-events:auto}
#toast button{background:none;border:none;color:#fff;font:inherit;text-decoration:underline;
  text-underline-offset:3px;cursor:pointer;margin-left:14px;padding:0}

/* ---------- photo management ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;max-width:760px}
.grid .p{position:relative;aspect-ratio:1;background:var(--soft) center/cover no-repeat;cursor:pointer;
  border:2px solid transparent}
.grid .p.on{border-color:var(--fg)}
.grid .p.on:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.26)}
.grid .p .tick{position:absolute;top:6px;left:6px;width:19px;height:19px;border-radius:50%;z-index:2;
  background:rgba(255,255,255,.94);border:1px solid rgba(0,0,0,.2);display:none;cursor:pointer}
.grid .p:hover .tick,.grid .p.on .tick,.grid.picking .p .tick{display:block}
.grid .p.on .tick{background:var(--fg);border-color:var(--fg);box-shadow:inset 0 0 0 3px #fff}
.grid .p .dots{position:absolute;top:5px;right:5px;z-index:2;display:none;border:0;cursor:pointer;padding:0;
  width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.52);color:#fff;font-size:15px;line-height:22px}
.grid .p:hover .dots{display:block}
.grid .p .vbadge{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;
  color:#fff;font-size:19px;text-shadow:0 1px 7px rgba(0,0,0,.65);pointer-events:none}
.grid .p.cov:before{content:"Cover";position:absolute;bottom:0;left:0;right:0;z-index:1;background:rgba(0,0,0,.62);
  color:#fff;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:3px 0}
.bar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:0 0 16px;min-height:38px}
.bar .count{font-size:12px;color:var(--muted);margin-right:4px}

/* ---------- favourites ---------- */
.pick{border-top:1px solid var(--line);padding:18px 0}
.pick:first-of-type{border-top:0;padding-top:0}
.pickhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:11px;font-size:13px}
.pickhead .pmail{color:var(--muted);font-size:11.5px}
.pickhead .pn{color:var(--muted);font-size:11px;letter-spacing:.11em;text-transform:uppercase;margin-left:auto}
.picksrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;max-width:760px}
.picksrow .p{aspect-ratio:1;background:var(--soft) center/cover no-repeat;cursor:zoom-in}
.picksrow .p:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

.menu{position:fixed;z-index:90;background:var(--bg);border:1px solid var(--line);min-width:196px;padding:5px 0;
  box-shadow:0 12px 34px rgba(0,0,0,.16)}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;
  padding:9px 15px;font:inherit;font-size:12.5px;color:var(--fg)}
.menu button:hover{background:var(--soft)}
.menu button.danger{color:var(--bad)}

.lbx{position:fixed;inset:0;z-index:80;background:rgba(13,13,13,.96);display:flex;align-items:center;justify-content:center}
.lbx .stage{max-width:92vw;max-height:76vh;display:flex;align-items:center;justify-content:center}
.lbx .stage img,.lbx .stage video{max-width:92vw;max-height:76vh;object-fit:contain;display:block}
.lbx .x{position:absolute;top:10px;right:16px;background:none;border:0;color:#fff;font-size:30px;line-height:1;cursor:pointer}
.lbx .nav{position:absolute;top:50%;transform:translateY(-50%);background:none;border:0;color:#fff;
  font-size:42px;line-height:1;cursor:pointer;padding:10px 16px;opacity:.7}
.lbx .nav:hover{opacity:1}
.lbx .prev{left:4px}
.lbx .next{right:4px}
.lbxbar{position:absolute;left:0;right:0;bottom:0;padding:16px 18px;display:flex;gap:14px;align-items:center;
  justify-content:center}
.lbxbar .n{color:rgba(255,255,255,.62);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.lbdots{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:transparent;
  color:#fff;font-size:17px;line-height:32px;padding:0;cursor:pointer}
.lbdots:hover{background:rgba(255,255,255,.16)}

/* ---------- cover ---------- */
.covnow{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;max-width:620px}
.covnow .shot{width:260px;aspect-ratio:3/2;background:var(--soft) center/cover no-repeat;border:1px solid var(--line);flex:0 0 auto}
.covside{flex:1 1 220px;display:flex;flex-direction:column;align-items:flex-start;gap:9px}
.covwhat{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.focwrap{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.focpick{position:relative;max-width:360px;flex:1 1 280px;cursor:crosshair;user-select:none;line-height:0;
  border:1px solid var(--line);background:var(--soft)}
.focpick img{width:100%;height:auto;display:block;pointer-events:none}
.focdot{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
  border:2px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.5),0 2px 10px rgba(0,0,0,.4);pointer-events:none}
.focdot:after{content:"";position:absolute;inset:8px;border-radius:50%;background:#fff}
.focouts{display:flex;gap:16px;flex:0 0 auto}
.focouts > div{display:flex;flex-direction:column;gap:7px;align-items:center}
.focouts span{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.focout{background:var(--soft) center/cover no-repeat;border:1px solid var(--line)}
.focout.wide{width:190px;height:107px}
.focout.tall{width:76px;height:135px}
@media(max-width:620px){.focpick{max-width:100%}}
@media(max-width:620px){.covnow .shot{width:100%}}
.spin{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--fg);border-radius:50%;
  animation:sp .8s linear infinite;margin:50px auto}
@keyframes sp{to{transform:rotate(360deg)}}

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var S = { galleries: [], albums: [], publicUrl: null, g: null, tab: "settings", pane: "general",
          canUpload: false, uploadMaxMb: 250, uploadMaxVideoMb: 4096, caps: {}, defaultSort: "newest" };

/* ---------- icons ---------- */

 "paintbrush": "<path d=\"m14.622 17.897-10.68-2.913\"/><path d=\"M18.376 2.622a1 1 0 1 1 3.002 3.002L17.36 9.643a.5.5 0 0 0 0 .707l.944.944a2.41 2.41 0 0 1 0 3.408l-.944.944a.5.5 0 0 1-.707 0L8.354 7.348a.5.5 0 0 1 0-.707l.944-.944a2.41 2.41 0 0 1 3.408 0l.944.944a.5.5 0 0 0 .707 0z\"/><path d=\"M9 8c-1.804 2.71-3.97 3.46-6.583 3.948a.507.507 0 0 0-.302.819l7.32 8.883a1 1 0 0 0 1.185.204C12.735 20.405 16 16.792 16 15\"/>",

 "layout-grid": "<rect width=\"7\" height=\"7\" x=\"3\" y=\"3\" rx=\"1\"/><rect width=\"7\" height=\"7\" x=\"14\" y=\"3\" rx=\"1\"/><rect width=\"7\" height=\"7\" x=\"14\" y=\"14\" rx=\"1\"/><rect width=\"7\" height=\"7\" x=\"3\" y=\"14\" rx=\"1\"/>",
 "sliders-horizontal": "<path d=\"M10 5H3\"/><path d=\"M12 19H3\"/><path d=\"M14 3v4\"/><path d=\"M16 17v4\"/><path d=\"M21 12h-9\"/><path d=\"M21 19h-5\"/><path d=\"M21 5h-7\"/><path d=\"M8 10v4\"/><path d=\"M8 12H3\"/>",

 "heart": "<path d=\"M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5\"/>",
 "triangle-alert": "<path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4\"/><path d=\"M12 17h.01\"/>",
 "circle-check": "<circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m16 9-5.5 5.5L8 12\"/>",
 "circle-x": "<circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m15 9-6 6\"/><path d=\"m9 9 6 6\"/>",
 "plus": "<path d=\"M5 12h14\"/><path d=\"M12 5v14\"/>",
 "chevron-right": "<path d=\"m9 18 6-6-6-6\"/>",
 "chevron-left": "<path d=\"m15 18-6-6 6-6\"/>",
 "upload": "<path d=\"M12 3v12\"/><path d=\"m17 8-5-5-5 5\"/><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"/>"
};
function lucide(name, size, sw){
  var n = size || 20;
  return '<svg viewBox="0 0 24 24" width="' + n + '" height="' + n + '" fill="none" stroke="currentColor" stroke-width="' + (sw || 2) + '" '
    + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (LUCIDE[name] || "") + '</svg>';
}
var IC = {
  photo:    lucide("images"),
  globe:    lucide("globe"),
  home:     lucide("house"),
  users:    lucide("users"),
  mail:     lucide("mail"),
  settings: lucide("settings"),
  dots:     lucide("ellipsis"),
  logout:   lucide("log-out")
};

function toast(t, action){
  var e=$("toast"); clearTimeout(e._t);
  e.textContent=t; e.classList.toggle("act", !!action);
  if (action){
    var b=document.createElement("button"); b.textContent=action.label;
    b.onclick=function(){ e.classList.remove("on","act"); action.run(); };
    e.appendChild(b);
  }
  e.classList.add("on");
  e._t=setTimeout(function(){ e.classList.remove("on","act"); }, action ? 8000 : 2600);
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function api(path, opts){
  return fetch("/api/admin" + path, Object.assign({credentials:"same-origin"}, opts||{}))
    .then(function(r){ return r.json().catch(function(){return null;}).then(function(j){ return {ok:r.ok,status:r.status,body:j}; }); });
}
function post(p,d,m){ return api(p,{method:m||"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d||{})}); }
function fmtDate(iso){ if(!iso) return ""; var d=new Date(iso); return isNaN(d)?"":d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); }
function fmtWhen(s){ if(!s) return ""; var d=new Date(String(s).replace(" ","T")+"Z"); return isNaN(d)?s:d.toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}); }
function imgSrc(id,size){ return id ? "/api/admin/img/"+id+"?size="+(size||"thumbnail") : ""; }
/* A photo added a moment ago may not have a thumbnail yet, or Immich may be too busy making hundreds
   to answer at once. A CSS background cannot say it failed, so each tile loads through an image that
   can be asked again, a little later each time, and the picture is put on the tile once it arrives. */
function paintThumbs(root){
  Array.prototype.forEach.call(root.querySelectorAll(".p[data-id]"), function(el){
    if (el.dataset.t) return; el.dataset.t = "1";
    var id = el.dataset.id, tries = 0;
    (function go(){
      var im = new Image(), src = imgSrc(id) + (tries ? "&r=" + tries : "");
      im.onload = function(){ el.style.backgroundImage = "url('" + src + "')"; };
      im.onerror = function(){ if (++tries <= 8) setTimeout(go, Math.min(20000, 1500 * tries * tries)); };
      im.src = src;
    })();
  });
}
/* every cover in the panel is cropped the same way the client's is, or the focal
   point is something you set blind and only see on the gallery itself */
function coverCss(g){
  return "background-image:url('" + coverOf(g) + "');background-position:"
       + (g.coverFocus || "50 50").replace(" ", "% ") + "%";
}
function coverOf(g){
  /* an uploaded cover wins, same as it does for clients; the filename busts the cache */
  if (g.coverFile) return "/api/g/" + encodeURIComponent(g.slug) + "/cover?v=" + encodeURIComponent(g.coverFile);
  if (g.coverAssetId) return imgSrc(g.coverAssetId,"preview");
  /* no cover chosen: borrow the first set's album thumbnail */
  var ids = (g.sets && g.sets.length) ? g.sets.map(function(x){ return x.albumId; }) : [g.albumId];
  for (var i = 0; i < ids.length; i++){
    var a = S.albums.filter(function(x){return x.id===ids[i];})[0];
    if (a && a.thumb) return imgSrc(a.thumb,"preview");
  }
  return "";
}
/* empty-state and placeholder icon: 40px by default, muted by the theme */
/* An email is built about 560px wide. Show it at that width and scale the whole thing to fill the preview, so a wide
   screen gets a big preview, not a small email in a big box. It follows the box, and the window's height. */
function scaleEmail(frame){
  var wrap = frame && frame.parentNode; if (!wrap) return;
  /* inside a gallery the whole screen is fitted to the window, so only the preview ever scrolls */
  var main = wrap.closest ? wrap.closest(".main") : null;
  if (main) main.classList.add("fitview");
  function fit(){
    if (!frame.isConnected){ window.removeEventListener("resize", fit); return; }
    var bar = document.getElementById("tBar");
    document.documentElement.style.setProperty("--hdr", (bar ? bar.offsetHeight : 89) + "px");
    if (!main) wrap.style.height = Math.max(480, Math.round(window.innerHeight - 190)) + "px";
    var W = 640, k = Math.min(1.1, Math.max(0.5, wrap.clientWidth / W));
    frame.style.width = W + "px"; frame.style.height = Math.round(wrap.clientHeight / k) + "px"; frame.style.transform = "scale(" + k + ")";
    frame.style.marginLeft = Math.max(0, Math.round((wrap.clientWidth - W * k) / 2)) + "px";   /* centred when the box is wider than the email */
  }
  fit();
  if (window.ResizeObserver) new ResizeObserver(fit).observe(wrap);
  window.addEventListener("resize", fit);
}
function emptyIcon(inner, px){
  return '<svg viewBox="0 0 24 24" width="'+(px||40)+'" height="'+(px||40)+'" fill="none" stroke="currentColor" stroke-width="1.4" '
       + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+inner+'</svg>';
}
var EI_PHOTO = LUCIDE.image;
var EI_STACK = LUCIDE.images;
function emptyState(icon, text, btnId, btnLabel){
  return '<div class="emptyst">'+emptyIcon(icon)+'<p>'+esc(text)+'</p>'
       + (btnLabel ? '<button type="button" class="btn pri" id="'+btnId+'">'+esc(btnLabel)+'</button>' : '')+'</div>';
}
/* days until a gallery expires (whole days, rounded up); null when it has no date */
function daysLeft(g){
  if (!g.expiresAt) return null;
  var t = new Date(g.expiresAt).getTime(); if (isNaN(t)) return null;
  return Math.ceil((t - Date.now()) / 86400000);
}
function statusLine(g){
  var d = daysLeft(g);
  if (g.expired) return '<div class="status">Expired</div>';
  if (!g.publishedAt) return '<div class="status">Draft</div>';
  if (d !== null && d <= 7) return '<div class="status warn">'+(d <= 0 ? "Expires today" : "Expires in "+d+(d===1?" day":" days"))+'</div>';
  if (!g.views && !g.downloads) return '<div class="status">No views yet</div>';
  return '<div class="status">'+g.views+(g.views===1?" view":" views")+' \u00b7 '+g.downloads+(g.downloads===1?" download":" downloads")+'</div>';
}
function galleryUrl(g){ return (S.publicUrl || location.origin) + "/" + g.slug; }

/* ---------- auth ---------- */
function takeMe(b){
  S.publicUrl   = b && b.publicUrl;
  S.canUpload   = !!(b && b.canUpload);
  S.uploadMaxMb = (b && b.uploadMaxMb) || 250;
  S.uploadMaxVideoMb = (b && b.uploadMaxVideoMb) || 4096;
  S.defaultSort = (b && b.defaultSort) === "oldest" ? "oldest" : "newest";
  S.caps        = (b && b.caps) || {};
  S.brandName   = (b && b.brandName) || "";
}
var challenge = null;

/* The code arrives by email, so signing in on a phone means leaving the browser.
   iOS often reloads the tab on the way back, which used to drop the challenge and
   send you through the whole sign-in again. Park it for the life of the tab. */
var CKEY = "immichset.challenge";
function saveChallenge(o){ try { sessionStorage.setItem(CKEY, JSON.stringify(o)); } catch(e){} }
function clearChallenge(){ try { sessionStorage.removeItem(CKEY); } catch(e){} }
function loadChallenge(){
  try { var o = JSON.parse(sessionStorage.getItem(CKEY) || "null");
        return (o && o.id && o.until > Date.now()) ? o : null; } catch(e){ return null; }
}
function codeStep(sentTo){
  $("aEmail").hidden=true; $("aPass").hidden=true; $("aCode").hidden=false;
  $("aBtn").textContent="Verify";
  $("loginErr").style.color="var(--muted)";
  $("loginErr").textContent = sentTo ? ("We sent a code to "+sentTo+".") : "Enter the code we emailed you.";
  $("aCode").focus();
}

api("/me").then(function(r){
  if (r.ok){ clearChallenge(); takeMe(r.body); boot(); return; }
  $("login").classList.add("on");
  var c = loadChallenge();
  if (c){ challenge = c.id; codeStep(c.sentTo); }
});
$("loginForm").addEventListener("submit", function(e){
  e.preventDefault(); $("loginErr").textContent=""; $("aBtn").disabled=true;
  var body = challenge ? {challenge:challenge, code:$("aCode").value.replace(/\D/g,"")}
                       : {email:$("aEmail").value.trim(), password:$("aPass").value};
  post("/login", body).then(function(r){
    $("aBtn").disabled=false;
    if (!r.ok){
      var m = r.body && r.body.error;
      if (r.status===429){ $("loginErr").textContent="Too many attempts. Wait 15 minutes and try again."; clearChallenge(); }
      else if (m==="bad_code"){ $("loginErr").textContent="That code isn't right."; $("aCode").value=""; $("aCode").focus(); }
      else if (m==="code_expired"){ $("loginErr").textContent="That code expired. Start again."; resetLogin(); }
      else if (r.status===502) $("loginErr").textContent = m || "Couldn't send your code.";
      else { $("loginErr").textContent="Email or password is incorrect."; $("aPass").value=""; $("aPass").focus(); }
      return;
    }
    if (r.body && r.body.step==="code"){
      challenge = r.body.challenge;
      saveChallenge({ id: challenge, sentTo: r.body.sentTo || "",
                      until: Date.now() + ((r.body.expiresIn || 600000) - 10000) });
      codeStep(r.body.sentTo);
      return;
    }
    clearChallenge();
    $("login").classList.remove("on");
    api("/me").then(function(m){ takeMe(m.body); boot(); });
  });
});
function resetLogin(){ challenge=null; clearChallenge(); $("aEmail").hidden=false; $("aPass").hidden=false;
  $("aCode").hidden=true; $("aCode").value=""; $("aBtn").textContent="Sign in"; $("loginErr").style.color=""; }
function signOut(){
  post("/logout").then(function(r){
    if (!r.ok) return toast("Couldn’t sign out. Close this browser tab to end the session.");
    location.replace("/admin");
  });
}
$("outBtn").addEventListener("click", signOut);
$("msOut").addEventListener("click", signOut);

function boot(){
  $("app").hidden=false;
  renderNav();
  Promise.all([api("/galleries"), api("/albums")]).then(function(rs){
    S.galleries = rs[0].body || []; S.albums = rs[1].body || [];
    var first = sectionOf(savedSection()) || SECTIONS[0];   /* the lowest-order section is Home (home.js) */
    setSection(first.key);
    first.open();
  });
}

/* ---------- sections ---------- */
/* Every section of the panel sits in the sidebar (wide screens) and the bottom bar with its More
   sheet (phones). Other files add theirs with addSection; leave() runs when you switch away from
   a section, and sections are listed by order (lowest first; boot opens the first one). */
var SECTIONS = [{ key:"galleries", label:"Galleries", icon:IC.photo, order:20, n:0, open:function(){ listView(); },
                  top:function(){ if (S.g || S.editing) listView(); },
                  leave:function(){ if (window.DesignEditor) DesignEditor.close(); } }];
var curSection = "galleries";
function addSection(key, label, icon, open, leave, order){
  SECTIONS.push({ key:key, label:label, icon:icon || "", open:open, leave:leave,
                  order: typeof order === "number" ? order : 100, n:SECTIONS.length });
  SECTIONS.sort(function(x, y){ return (x.order - y.order) || (x.n - y.n); });
  renderNav();
}
/* reloading the page reopens the section you were in, not Home */
var SECKEY = "admin.section";
/* the browser tab says where you are: the section, and the gallery or page inside it, so several
   tabs of the panel can be told apart */
function setTabTitle(extra){
  var sec = sectionOf(curSection);
  document.title = (extra ? extra + " \u00b7 " : "") + (sec ? sec.label : "Admin");
}
function setSection(key){ curSection = key; try { sessionStorage.setItem(SECKEY, key); } catch(e){} setTabTitle(); }

/* ---------- chrome ---------- */
/* The page header. opts: title; crumb (small line above the title, a link back when back is set);
   summary (or sub) under the title; back (function); gallery (status pill and cover thumbnail);
   actions [{label, icon, primary, onClick, id}] right-aligned — on phones only the primary stays,
   the rest go in a "⋯" menu; section (which sidebar item is lit; sub-screens pass their parent). */
/* the header's "⋯" menu (a popMenu); remembered so Escape and a header rebuild close only that one */
var hdrMenu = null;
function hdrMenuKey(ev){ if (ev.key === "Escape") closeHdrMenu(true); }
function closeHdrMenu(refocus){
  document.removeEventListener("keydown", hdrMenuKey);

function chrome(opts){
  closeHdrMenu();

  $("app").classList.toggle("dzwide", !!(opts.full || opts.wide));   /* ...a gallery's other tabs only lose the side menu */
  if (opts.section) setSection(opts.section);
  var back = opts.back || null, crumb = $("tCrumb");
  crumb.hidden = !opts.crumb;
  if (opts.crumb){
    crumb.innerHTML = (back ? '<button type="button" class="crumbbtn" id="crumbBtn">'+esc(opts.crumb)+'</button>' : esc(opts.crumb)) + ' /';
    if (back) $("crumbBtn").onclick = back;
  }
  $("tBar").classList.toggle("hascrumb", !!(opts.crumb && back));
  $("tBar").classList.toggle("hasback", !!back);
  $("tTitle").textContent = opts.title;
  setTabTitle(opts.gallery && opts.gallery.title ? opts.gallery.title : (opts.crumb ? opts.title : ""));
  $("tSub").textContent = opts.summary || opts.sub || "";
  $("backBtn").hidden = !back;
  $("backBtn").onclick = back;
  var g = opts.gallery;
  $("tPill").hidden = !g;
  if (g){
    var cls = g.expired ? "exp" : (g.publishedAt ? "live" : "draft");
    var txt = g.expired ? "Expired" : (g.publishedAt ? "Live" : "Draft");
    $("tPill").className = "pill " + cls; $("tPill").textContent = txt;
  }
  $("tPill").onclick = g && opts.onPill ? function(){ opts.onPill($("tPill")); } : null;
  if (g && opts.onPill){ $("tPill").setAttribute("role","button"); $("tPill").tabIndex = 0; $("tPill").textContent += " \u25be"; $("tPill").style.cursor = "pointer"; }
  else { $("tPill").removeAttribute("role"); $("tPill").removeAttribute("tabindex"); $("tPill").style.cursor = ""; }
  var cov = g ? coverOf(g) : "";
  $("tCov").hidden = !g;
  $("tCov").style.cssText = cov ? coverCss(g) : "";
  $("tCov").className = "tcov" + (g && !cov ? " none" : "");
  $("tCov").innerHTML = g && !cov ? emptyIcon(EI_PHOTO, 16) : "";
  $("tCov").title = g && !cov ? "Choose a cover" : "";

  $("tCov").onclick = g && !cov ? goCov : null;
  $("tCov").onkeydown = g && !cov ? function(ev){ if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); goCov(); } } : null;
  if (g && !cov){ $("tCov").setAttribute("role","button"); $("tCov").tabIndex = 0; }
  else { $("tCov").removeAttribute("role"); $("tCov").removeAttribute("tabindex"); }
  var acts = opts.actions || [], more = [];
  $("tActs").innerHTML = acts.map(function(a, i){
    if (!a.primary) more.push(a);
    return '<button type="button" class="btn sm '+(a.primary?"pri":"ghost sec")+'" data-act="'+i+'"'
         + (a.id ? ' id="'+esc(a.id)+'"' : '') + '>' + (a.icon || "") + '<span>'+esc(a.label)+'</span></button>';
  }).join("") + (more.length ? '<button type="button" class="btn sm ghost tmore" id="tMore" aria-label="More actions" aria-haspopup="menu">'+IC.dots+'</button>' : '');
  Array.prototype.forEach.call($("tActs").querySelectorAll("[data-act]"), function(b){
    var a = acts[Number(b.dataset.act)];

    closeHdrMenu();

    hdrMenu = document.getElementById("pmenu");
    if (hdrMenu) document.addEventListener("keydown", hdrMenuKey);
  };

/* The header's real height (it wraps on a narrow screen); screens that fit the window use it for their own sizes. */

/* The header every gallery screen shares, the Design editor included: back to the list, the title and date, the

/* The focal point: which part of the photo must stay in frame when the screen is a different shape. Dragging
   previews at once (opts.onFocus) and is saved a moment after the finger or mouse lifts. */
function focalPane(host, g, opts){
  opts = opts || {};
  var focus = (g.coverFocus || "50 50").split(" ").map(Number), saveT = null;
  host.innerHTML = '<p class="hint" style="margin:0 0 14px">A cover fills whatever shape the screen is, so part of a tall '
    +   'photo is always cut off. Drag the dot onto what must stay.</p>'
    + '<div class="focwrap">'
    +   '<div class="focpick" id="focPick"><img src="' + coverOf(g) + '" alt="">'
    +     '<span class="focdot" id="focDot"></span></div>'
    +   '<div class="focouts">'
    +     '<div><div class="focout wide" id="focWide"></div><span>On a laptop</span></div>'
    +     '<div><div class="focout tall" id="focTall"></div><span>On a phone</span></div>'
    +   '</div>'
    + '</div>'
    + '<div style="margin-top:14px"><button class="btn sm ghost" id="resetFoc" type="button">Reset to centre</button></div>';
  var pick = host.querySelector("#focPick");
  /* the two frames show the same crop the client will get, including the slight zoom the gallery holds */
  var COVER_ZOOM = 1.12;
  function paint(){
    var url = coverOf(g), src = pick.querySelector("img");
    var nw = src && src.naturalWidth, nh = src && src.naturalHeight;
    ["focWide","focTall"].forEach(function(id){
      var el = host.querySelector("#" + id); if (!el) return;
      el.style.backgroundImage = 'url("' + url + '")';
      el.style.backgroundPosition = focus[0] + "% " + focus[1] + "%";
      if (nw && nh){
        var k = Math.max(el.clientWidth / nw, el.clientHeight / nh) * COVER_ZOOM;
        el.style.backgroundSize = Math.ceil(nw * k) + "px " + Math.ceil(nh * k) + "px";
      }
    });
    var dot = host.querySelector("#focDot");
    dot.style.left = focus[0] + "%"; dot.style.top = focus[1] + "%";
    if (opts.onFocus) opts.onFocus(focus);
  }
  function at(ev){
    var r = pick.getBoundingClientRect();
    focus = [Math.max(0, Math.min(100, Math.round((ev.clientX - r.left) / r.width * 100))),
             Math.max(0, Math.min(100, Math.round((ev.clientY - r.top) / r.height * 100)))];
    paint();
  }
  function saveSoon(ms){
    clearTimeout(saveT);
    saveT = setTimeout(function(){
      save({coverFocus: focus[0] + " " + focus[1]}, "Focal point saved").then(function(ok){ if (ok && opts.done) opts.done(); });
    }, ms);
  }
  var dragging = false;
  /* pointer capture keeps the drag on this element, so there is nothing on window to clean up later */
  pick.addEventListener("pointerdown", function(ev){ dragging = true; pick.setPointerCapture(ev.pointerId); at(ev); ev.preventDefault(); });
  pick.addEventListener("pointermove", function(ev){ if (dragging) at(ev); });
  pick.addEventListener("pointerup", function(){ if (!dragging) return; dragging = false; saveSoon(600); });
  pick.addEventListener("pointercancel", function(){ dragging = false; });
  pick.style.touchAction = "none";
  var im = pick.querySelector("img");
  if (im && !im.complete) im.addEventListener("load", paint);
  host.querySelector("#resetFoc").onclick = function(){ focus = [50, 50]; paint(); saveSoon(0); };
  paint();
}

/* A cover is served exactly as stored, so shrink it before it ever goes up. The browser
   already has a decoder and an encoder; the alternative is a server-side image library,
   which this app deliberately does without. */
var COVER_EDGE = 2400, COVER_EASY = 1200000;
function gb(n){
  return n >= 1073741824 ? (n/1073741824).toFixed(n >= 10737418240 ? 1 : 2) + " GB"
       : n >= 1048576 ? Math.round(n/1048576) + " MB" : n > 0 ? "<1 MB" : "0 MB";
}
function mb(n){ return n >= 1048576 ? (n/1048576).toFixed(1) + " MB" : Math.round(n/1024) + " KB"; }
function fitCover(file){
  /* a GIF may be animated, and redrawing it would keep only the first frame */
  if (/\.gif$/i.test(file.name) || file.type === "image/gif") return Promise.resolve(null);
  if (!window.createImageBitmap || !document.createElement("canvas").toBlob) return Promise.resolve(null);
  return createImageBitmap(file, { imageOrientation: "from-image" }).then(function(bm){
    var w0 = bm.width, h0 = bm.height;
    var scale = Math.min(1, COVER_EDGE / Math.max(w0, h0));
    if (scale === 1 && file.size <= COVER_EASY){ bm.close(); return null; }   /* already web-sized */
    var w = Math.max(1, Math.round(w0 * scale)), h = Math.max(1, Math.round(h0 * scale));
    var c = document.createElement("canvas"); c.width = w; c.height = h;
    var ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);    /* transparency flattens to white, not black */
    ctx.drawImage(bm, 0, 0, w, h); bm.close();
    return new Promise(function(done){
      c.toBlob(function(b){
        /* if re-encoding did not actually help, send what was chosen */
        done(b && b.size < file.size ? { blob: b, w: w, h: h, from: { w: w0, h: h0 } } : null);
      }, "image/jpeg", 0.86);
    });
  }).catch(function(){ return null; });   /* a format the browser cannot decode: let the server answer */
}

/* ---------- uploads ---------- */
var UP = { albumId:null, items:[], running:0, bps:0, lastAt:0, lastDone:0, timer:null };
var UP_PHOTO = /\.(jpe?g|png|heic|heif|webp|avif|gif|tiff?|dng)$/i;
var UP_VIDEO = /\.(mp4|mov|m4v|webm|mkv|avi|wmv|3gp|mts|m2ts|mpe?g)$/i;

function upAdd(albumId, files){
  if (UP.albumId !== albumId && !UP.running) UP.items = [];
  UP.albumId = albumId;
  Array.prototype.forEach.call(files, function(f){
    var it = { name:f.name, file:f, pct:0, state:"wait", err:null };
    var vid = UP_VIDEO.test(f.name);
    var max = (vid ? S.uploadMaxVideoMb : S.uploadMaxMb) * 1048576;
    if (!vid && !UP_PHOTO.test(f.name)) { it.state = "fail"; it.err = "Not a photo or video"; }
    else if (f.size > max) { it.state = "fail"; it.err = "Over " + Math.round(max/1048576) + " MB"; }
    else if (!f.size) { it.state = "fail"; it.err = "Empty file"; }
    UP.items.push(it);
  });
  upRender(); upPump();
}
/* A batch of video is minutes of waiting. Bytes moved, how fast, and how much
   longer are the three things worth knowing while it happens. */
function upSendable(){ return UP.items.filter(function(i){ return i.state !== "fail" || i.sent; }); }
function upBytes(){
  var done = 0, total = 0;
  upSendable().forEach(function(i){
    var sz = i.file ? i.file.size : 0;
    total += sz;
    done += (i.state === "done" || i.state === "dupe") ? sz
          : (i.state === "up") ? sz * i.pct : 0;
  });
  return { done: done, total: total };
}
function secs(n){
  if (!isFinite(n) || n <= 0) return "";
  if (n < 60) return "about " + Math.max(1, Math.round(n)) + "s left";
  if (n < 3600) return "about " + Math.round(n / 60) + " min left";
  return "about " + (n / 3600).toFixed(1) + " hr left";
}
/* sampled on a timer, not on progress events: those arrive in bursts and would
   make the figure jump around */
function upTick(){
  var b = upBytes(), now = Date.now();
  if (UP.lastAt){
    var dt = (now - UP.lastAt) / 1000;
    if (dt > 0.2){
      var inst = Math.max(0, (b.done - UP.lastDone) / dt);
      UP.bps = UP.bps ? UP.bps * 0.7 + inst * 0.3 : inst;      /* smoothed, or it flickers */
      UP.lastAt = now; UP.lastDone = b.done;
    }
  } else { UP.lastAt = now; UP.lastDone = b.done; }
  upRender();
}

function upRender(){
  var q = document.getElementById("queue"); if (!q) return;
  if (!UP.items.length){ q.innerHTML = ""; return; }
  var done = UP.items.filter(function(i){ return i.state==="done" || i.state==="dupe"; }).length;
  var fail = UP.items.filter(function(i){ return i.state==="fail"; }).length;
  var b = upBytes();
  var settled = done + fail;
  var pct = b.total ? Math.round(b.done / b.total * 100) : 0;
  /* the last bytes leave before Immich has finished taking them in, so the bar is
     held off the end until every file has actually come back */
  if (pct >= 100 && settled < UP.items.length) pct = 99;
  var waiting = UP.running && b.done >= b.total;
  var left = (UP.bps > 0 && !waiting) ? secs((b.total - b.done) / UP.bps) : "";
  q.innerHTML =
      '<div class="qtot"><span class="qbar big"><i style="width:' + pct + '%"></i></span>'
    +   '<span class="qpct">' + pct + '%</span></div>'
    + '<div class="qhead">' + done + ' of ' + UP.items.length + ' finished'
    +   ' <span class="qdim">\u00b7 ' + mb(b.done) + ' of ' + mb(b.total) + '</span>'
    +   (waiting ? ' <span class="qdim">\u00b7 finishing\u2026</span>'
        : (UP.running && UP.bps > 0 ? ' <span class="qdim">\u00b7 ' + mb(UP.bps) + '/s</span>' : ''))
    +   (UP.running && left ? ' <span class="qdim">\u00b7 ' + left + '</span>' : '')
    + (fail ? ' <span class="qfail">— ' + fail + ' failed</span>' : '')
    + (UP.running ? '' : ' <button type="button" class="link" id="qclear">Clear</button>') + '</div>'
    + UP.items.map(function(i){
        var pct = Math.round(i.pct * 100);
        var label = i.state==="done" ? "Added"
                  : i.state==="dupe" ? "Already in Immich"
                  : i.state==="fail" ? esc(i.err || "Failed")
                  : i.state==="up"   ? pct + "%" : "Waiting";
        return '<div class="qrow ' + i.state + '"><span class="qn">' + esc(i.name) + '</span>'
             + '<span class="qbar"><i style="width:' + pct + '%"></i></span>'
             + '<span class="qs">' + label + '</span></div>';
      }).join("");
  if (document.getElementById("qclear"))
    document.getElementById("qclear").onclick = function(){ UP.items = []; upRender(); };
}
function upPump(){
  while (UP.running < 3){
    var next = UP.items.filter(function(i){ return i.state==="wait"; })[0];
    if (!next) break;
    UP.running++; next.state = "up"; next.sent = true;
    upSend(next);
  }
  if (UP.running && !UP.timer) UP.timer = setInterval(upTick, 500);
  upRender();
  if (!UP.running && UP.items.length) upDone();
}

/* XHR rather than fetch: it is the only way to get upload progress per file. */
function uploadFile(file, albumId, onProgress){
  return new Promise(function(resolve){
    var x = new XMLHttpRequest();
    var qs = "?albumId=" + encodeURIComponent(albumId)
           + "&name="    + encodeURIComponent(file.name)
           + "&created=" + encodeURIComponent(new Date(file.lastModified || Date.now()).toISOString());
    x.open("POST", "/api/admin/upload" + qs);
    x.withCredentials = true;
    x.setRequestHeader("Content-Type", file.type || "application/octet-stream");
    if (onProgress) x.upload.onprogress = function(e){ if (e.lengthComputable) onProgress(e.loaded / e.total); };
    x.onload = function(){
      var b = null; try { b = JSON.parse(x.responseText); } catch(e){}
      if (x.status >= 200 && x.status < 300) resolve({ ok:true, id: b && b.id, status: b && b.status });
      else resolve({ ok:false, error: (b && b.error) || ("HTTP " + x.status) });
    };
    x.onerror = function(){ resolve({ ok:false, error:"Network error" }); };
    x.onabort = function(){ resolve({ ok:false, error:"Cancelled" }); };
    x.send(file);
  });
}
function upSend(it){
  uploadFile(it.file, UP.albumId, function(p){ it.pct = p; upRender(); }).then(function(res){
    if (res.ok){ it.pct = 1; it.state = res.status === "duplicate" ? "dupe" : "done"; }
    else { it.state = "fail"; it.err = res.error; }
    UP.running--;
    if (UP.items.filter(function(i){ return i.state==="wait"; }).length) upPump();
    else { upRender(); if (!UP.running) upDone(); }
  });
}
function upDone(){
  if (UP.timer){ clearInterval(UP.timer); UP.timer = null; }
  UP.bps = 0; UP.lastAt = 0; UP.lastDone = 0;
  var added = UP.items.filter(function(i){ return i.state==="done"; }).length;
  var fail  = UP.items.filter(function(i){ return i.state==="fail"; }).length;
  toast(added ? (added + " photo" + (added===1?"":"s") + " added")
      : fail  ? "Nothing uploaded" : "Those were already in Immich");
  if (UP.reload) UP.reload();
}

  $("pane").innerHTML =

    +   '<div class="setacts">'

    + '<div class="queue" id="queue"></div>'
    + '<input type="file" id="pick" multiple accept=".jpg,.jpeg,.png,.heic,.heif,.webp,.avif,.gif,.tif,.tiff,.dng,.mp4,.mov,.m4v,.webm,.mkv,.avi,.wmv,.3gp,.mts,.m2ts,.mpg,.mpeg" style="display:none">'
    + '<input type="file" id="repl" accept=".jpg,.jpeg,.png,.heic,.heif,.webp,.avif,.gif,.tif,.tiff,.dng,.mp4,.mov,.m4v,.webm,.mkv,.avi,.wmv,.3gp,.mts,.m2ts,.mpg,.mpeg" style="display:none">';

  $("setOpts").onclick = function(ev){ ev.stopPropagation(); setMenu($("setOpts"), setId); };
  if ($("addMedia")) $("addMedia").onclick = function(){ $("pick").click(); };
  $("pick").onchange = function(){ upAdd(set.albumId, $("pick").files); $("pick").value = ""; };
  UP.reload = function(){ refreshAlbums(); refreshGalleries(function(){ load(); }); };

  var gridEl = $("grid");
  ["dragenter","dragover"].forEach(function(e){
    gridEl.addEventListener(e, function(ev){ ev.preventDefault(); gridEl.classList.add("over"); });
  });
  ["dragleave","dragend"].forEach(function(e){
    gridEl.addEventListener(e, function(){ gridEl.classList.remove("over"); });
  });
  gridEl.addEventListener("drop", function(ev){
    ev.preventDefault(); gridEl.classList.remove("over");
    if (!S.caps || !S.caps.upload) return toast("Your Immich key cannot upload");
    if (ev.dataTransfer && ev.dataTransfer.files) upAdd(set.albumId, ev.dataTransfer.files);
  });

  function chosen(){ return Object.keys(sel).filter(function(k){ return sel[k]; }); }
  function idxOf(id){ for (var i=0;i<list.length;i++) if (list[i].id===id) return i; return -1; }

  function drawBar(){
    var n = chosen().length, c = S.caps || {};
    var h = "";
    if (n){
      h = '<span class="count">' + n + ' selected</span>';
      if (c.trash)       h += '<button class="btn sm danger" id="doTrash">Move to trash</button>';
      if (c.albumRemove) h += '<button class="btn sm ghost" id="doRemove">Remove from set</button>';
      h += '<button class="btn sm ghost" id="selNone">Clear</button>';
    } else if (list.length) {
      h = '<button class="btn sm ghost" id="selAll">Select all</button>';
    }
    $("bar").innerHTML = h;
    if ($("selAll"))   $("selAll").onclick   = function(){ list.forEach(function(a){ sel[a.id]=true; }); draw(); };
    if ($("selNone"))  $("selNone").onclick  = function(){ sel = {}; draw(); };
    if ($("doTrash"))  $("doTrash").onclick  = function(){ act("trash"); };
    if ($("doRemove")) $("doRemove").onclick = function(){ act("remove"); };
  }

  function toggle(id, range){
    var i = idxOf(id);
    if (range && lastTick != null && lastTick !== i){
      var on = !sel[id], a = Math.min(i, lastTick), b = Math.max(i, lastTick);
      for (var k = a; k <= b; k++) sel[list[k].id] = on;
    } else sel[id] = !sel[id];
    lastTick = i;
    draw();
  }

  function actionsFor(id){
    var c = S.caps || {}, out = [];
    if (id !== S.g.coverAssetId)
      out.push({ label:"Make cover", keep:true, run:function(){
        save({coverAssetId:id}, "Cover updated").then(function(ok){ if (ok){ draw(); if (lbEl) showLb(); } });
      } });
    if (c.upload && (c.trash || c.albumRemove))
      out.push({ label:"Replace…", run:function(){ replFor = id; $("repl").click(); } });
    if (c.albumRemove)
      out.push({ label:"Remove from set", run:function(){ act("remove", [id]); } });
    if (c.trash)
      out.push({ label:"Move to trash", danger:true, run:function(){ act("trash", [id]); } });
    return out;
  }

  function draw(){
    gridEl.className = "grid dropzone" + (chosen().length ? " picking" : "");
    gridEl.innerHTML = list.map(function(a){
      return '<div class="p' + (sel[a.id] ? " on" : "") + (a.id===S.g.coverAssetId ? " cov" : "") + '" data-id="' + a.id
           + '">'
           + '<span class="tick" data-act="sel" title="Select"></span>'
           + '<button class="dots" data-act="menu" title="More">⋮</button>'
           + (a.isImage ? '' : '<span class="vbadge">▶</span>')
           + '</div>';
    }).join("") || emptyState(EI_PHOTO, "Add photos to this set", "emptyAdd", S.caps && S.caps.upload ? "Add photos" : "");
    if ($("emptyAdd")) $("emptyAdd").onclick = function(ev){ ev.stopPropagation(); $("pick").click(); };
    paintThumbs(gridEl);
    gridEl.onclick = function(ev){
      if (busy) return;
      var el = ev.target.closest(".p"); if (!el) return;
      var id = el.dataset.id, what = ev.target.dataset.act;
      if (what === "sel")  return toggle(id, ev.shiftKey);
      if (what === "menu") return popMenu(ev.target, actionsFor(id));
      openLb(idxOf(id));
    };
    $("setN").textContent = list.length + " photo" + (list.length===1?"":"s")
      + (list.length >= 400 ? " · showing the first 400" : "");
    drawBar();
  }

  function load(then){
    api("/albums/" + set.albumId + "/assets?sort=" + (S.g.sortOrder || "newest")).then(function(r){
      list = (r.body && r.body.assets) || [];
      Object.keys(sel).forEach(function(k){
        if (!list.some(function(a){ return a.id===k; })) delete sel[k];
      });
      draw(); if (then) then();
    });
  }

  function act(kind, ids, quiet){
    ids = ids || chosen();
    if (!ids.length) return;
    if (kind === "remove" && !quiet &&
        !confirm("Take " + ids.length + " photo" + (ids.length===1?"":"s") + " out of this set?\n\nThey stay in Immich.")) return;
    busy = true;
    return post("/photos/" + kind, {albumId: set.albumId, ids: ids}).then(function(r){
      busy = false;
      if (!r.ok){ toast((r.body && r.body.error) || "That didn't work"); return false; }
      var n = r.body.n;
      sel = {};
      load(function(){ refreshAlbums(); refreshGalleries(draw); });
      if (kind === "trash")
        toast(n + " photo" + (n===1?"":"s") + " moved to trash", { label:"Undo", run:function(){ act("restore", r.body.ids, true); } });
      else if (kind === "restore") toast("Brought back");
      else toast(n + " photo" + (n===1?"":"s") + " removed from the set");
      return true;
    });
  }

  $("repl").onchange = function(){
    var f = $("repl").files[0], old = replFor || chosen()[0];
    $("repl").value = ""; replFor = null;
    if (!f || !old) return;
    var wasCover = old === S.g.coverAssetId;
    busy = true; toast("Uploading the replacement…");
    uploadFile(f, set.albumId).then(function(res){
      busy = false;
      if (!res.ok) return toast(res.error || "Couldn't upload that one");
      /* only drop the old one once the new one is safely in */
      act((S.caps && S.caps.trash) ? "trash" : "remove", [old], true).then(function(){
        if (wasCover && res.id) save({coverAssetId: res.id}, "Replaced, and it's the new cover");
        else toast("Replaced");
      });
    });
  };

  /* ---- lightbox ---- */
  var lbIdx = -1, lbEl = null;
  function openLb(i){
    if (i < 0 || !list[i]) return;
    lbIdx = i;
    if (!lbEl){
      lbEl = document.createElement("div");
      lbEl.className = "lbx"; lbEl.id = "lbx";
      lbEl.innerHTML = '<button class="x" data-lb="close" title="Close">×</button>'
        + '<button class="nav prev" data-lb="prev" title="Previous">‹</button>'
        + '<button class="nav next" data-lb="next" title="Next">›</button>'
        + '<div class="stage" id="lbxStage"></div>'
        + '<div class="lbxbar"><span class="n" id="lbxN"></span><span id="lbxActs"></span></div>';
      document.body.appendChild(lbEl);
      lbEl.onclick = function(ev){
        var k = ev.target.dataset.lb;
        if (k === "menu"){
          var a = list[lbIdx];
          return popMenu(ev.target, a ? actionsFor(a.id) : [], closeLb);
        }
        if (k === "close" || ev.target === lbEl || ev.target.id === "lbxStage") closeLb();
        else if (k === "prev") stepLb(-1);
        else if (k === "next") stepLb(1);
      };
      document.addEventListener("keydown", lbKeys);
      OVERLAY = { close: closeLb };
    }
    showLb();
  }
  function lbKeys(e){
    if (!lbEl) return;
    if (e.key === "Escape") closeLb();
    else if (e.key === "ArrowLeft")  stepLb(-1);
    else if (e.key === "ArrowRight") stepLb(1);
  }
  function stepLb(d){ if (list.length){ lbIdx = (lbIdx + d + list.length) % list.length; showLb(); } }
  function showLb(){
    var a = list[lbIdx]; if (!a) return closeLb();
    var st = document.getElementById("lbxStage"); st.innerHTML = "";
    if (a.isImage){
      var im = document.createElement("img"); im.src = imgSrc(a.id, "preview"); st.appendChild(im);
    } else {
      var v = document.createElement("video");
      v.src = "/api/admin/img/" + a.id + "?size=video";
      v.poster = imgSrc(a.id, "preview");
      v.controls = true; v.playsInline = true; v.preload = "metadata";
      st.appendChild(v);
    }
    document.getElementById("lbxN").textContent =
      (lbIdx + 1) + " / " + list.length + (a.id === S.g.coverAssetId ? "  ·  cover" : "");
    document.getElementById("lbxActs").innerHTML = actionsFor(a.id).length
      ? '<button class="lbdots" data-lb="menu" title="More">⋮</button>' : '';
  }
  function closeLb(){
    document.removeEventListener("keydown", lbKeys);
    if (lbEl) lbEl.remove();
    lbEl = null; lbIdx = -1; OVERLAY = null;
  }

  load();
}

function paneCompose(g){
  var fresh = !!S.newTpl, want = S.selectTpl;     /* "New template" on the Templates page lands here with a blank one */
  S.newTpl = false; S.selectTpl = null;
  $("pane").innerHTML = head("Compose", "") + '<div id="cp"><div class="spin"></div></div>';
  Promise.all([api("/templates"), api("/mail-status"), api("/galleries/"+g.id+"/invites")]).then(function(rs){
    var tpls = (rs[0].body && rs[0].body.templates) || [];
    var last = rs[0].body && rs[0].body.lastUsed;
    var mail = rs[1].body || {};
    var invites = ((rs[2].body && rs[2].body.invites) || []).map(function(i){ return i.email; });

    if (!mail.configured){
      $("cp").innerHTML = '<p class="empty">Email isn\'t configured yet, so nothing can be sent.</p>';
      return;
    }
    $("cp").innerHTML =
        '<div class="compose"><div>'
      +   (fresh ? '<p class="hint" style="margin:0 0 12px"><b>New template.</b> Write a subject and message, then press <b>Save as new template</b>. It appears on the Templates page and in this list.</p>' : '')
      +   '<div class="tplrow"><select id="cTpl">'
      +     (fresh ? '<option value="" selected>New template</option>' : '')
      +     tpls.map(function(t){ return '<option value="'+t.id+'"'+((want ? t.id===want : (!fresh && t.id===last))?" selected":"")+'>'+esc(t.name)+'</option>'; }).join("")
      +   '</select><button class="btn sm ghost" id="cSaveTpl">'+(fresh ? "Save as new template" : "Save as template")+'</button></div>'
      +   '<div class="field"><label>To</label><textarea id="cTo" rows="2" placeholder="anna@example.com">'+esc(invites.join(", "))+'</textarea>'
      +     '<div class="hint">Separate with commas. Defaults to the clients on this gallery.</div></div>'
      +   '<div class="field"><label>Subject</label><input type="text" id="cSubj"></div>'
      +   '<div class="field"><label>Message</label><textarea id="cBody" rows="9"></textarea>'
      +     '<div class="hint vars">Placeholders: <code>{{title}}</code> <code>{{subtitle}}</code> <code>{{link}}</code> '
      +     '<code>{{expiry}}</code> <code>{{brand}}</code></div></div>'
      +   tog("cExpiry","Show the expiry date", g.expiresAt ? "Adds “Available until "+fmtDate(g.expiresAt)+"” under the button." : "This gallery has no expiry date.", !!g.expiresAt, !g.expiresAt)
      +   tog("cCopy","Send me a copy","Also sends it to your admin address.",false)
      +   '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:22px">'
      +     '<button class="btn" id="cSend">Send</button>'
      +     '<button class="btn ghost" id="cTest">Send a test to me</button></div>'
      + '</div>'
      + '<div class="pane"><h4>Preview</h4><div class="subjline" id="cPrevSubj">&nbsp;</div>'
      +   '<div class="pvfit"><iframe id="cPrev" title="Email preview"></iframe></div></div></div>';
    scaleEmail($("cPrev"));

    function apply(){
      var t = tpls.filter(function(x){ return String(x.id)===$("cTpl").value; })[0];
      if (!t) return;
      $("cSubj").value = t.subject; $("cBody").value = t.body; refresh();
    }
    var timer;
    function refresh(){
      clearTimeout(timer);
      timer = setTimeout(function(){
        post("/galleries/"+g.id+"/preview", {subject:$("cSubj").value, body:$("cBody").value, showExpiry:$("cExpiry").checked})
          .then(function(r){ if(!r.ok) return;
            $("cPrevSubj").textContent = r.body.subject || "";
            $("cPrev").srcdoc = r.body.html; });
      }, 320);
    }
    $("cTpl").onchange = apply;
    ["cSubj","cBody"].forEach(function(id){ $(id).addEventListener("input", refresh); });
    $("cExpiry").addEventListener("change", refresh);
    if (fresh){ $("cSubj").value = ""; $("cBody").value = "Hi,\n\n"; refresh(); $("cSubj").focus(); }
    else apply();

    $("cSaveTpl").onclick = function(){
      var name = prompt("Name this template:"); if (!name) return;
      post("/templates", {name:name, subject:$("cSubj").value, body:$("cBody").value}).then(function(r){
        toast(r.ok ? "Template saved" : ((r.body&&r.body.error)||"Couldn't save"));
        if (r.ok){
          var made = ((r.body && r.body.templates) || []).filter(function(x){ return x.name === name.trim(); })[0];
          S.selectTpl = made ? made.id : null;      /* the one just made is the one showing afterwards */
          paneCompose(g);
        }
      });
    };
    function payload(extra){
      var to = $("cTo").value.split(/[\s,;]+/).map(function(x){return x.trim();}).filter(Boolean);
      return Object.assign({to:to, subject:$("cSubj").value, body:$("cBody").value, templateId:Number($("cTpl").value),
                            showExpiry:$("cExpiry").checked, sendCopy:$("cCopy").checked}, extra||{});
    }
    $("cTest").onclick = function(){
      $("cTest").disabled=true; $("cTest").textContent="Sending…";
      post("/galleries/"+g.id+"/send", payload({testOnly:true})).then(function(r){
        $("cTest").disabled=false; $("cTest").textContent="Send a test to me";
        toast(r.ok ? ("Test sent to "+r.body.testSentTo) : ((r.body&&r.body.error)||"Couldn't send"));
      });
    };
    $("cSend").onclick = function(){
      var p = payload();
      if (!p.to.length) return toast("Add at least one recipient");
      if (!confirm("Send to "+p.to.length+" recipient"+(p.to.length===1?"":"s")+"?")) return;
      $("cSend").disabled=true; $("cSend").textContent="Sending…";
      post("/galleries/"+g.id+"/send", p).then(function(r){
        $("cSend").disabled=false; $("cSend").textContent="Send";
        if (!r.ok) return toast((r.body&&r.body.error)||"Couldn't send");
        toast("Sent to "+r.body.sent+(r.body.copySentTo?" (+ copy to you)":"")+(((r.body.failed||[]).length)?", "+r.body.failed.length+" failed":""));
        S.pane = "overview"; S.tab = "activity"; renderShell();
      });
    };
  });
}

/* A viewer for a list of photos in the Activity section (a client's picks, what they downloaded): the big preview, arrows,
   the arrow keys, swipe, Escape. It uses the same look as the Photos tab's lightbox. */
function viewPhotos(ids, start, label){
  if (!ids.length) return;
  if (OVERLAY) OVERLAY.close();
  var i = Math.max(0, Math.min(ids.length - 1, start || 0)), many = ids.length > 1;
  var el = document.createElement("div");
  el.className = "lbx"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", "Photo viewer");
  el.innerHTML = '<button class="x" data-lb="close" title="Close" aria-label="Close">×</button>'

    n.textContent = (i + 1) + " / " + ids.length + (label ? "  ·  " + label : "");

  }
  function step(d){ if (many){ i = (i + d + ids.length) % ids.length; show(); } }
  function keys(e){ if (e.key === "Escape") close(); else if (e.key === "ArrowLeft") step(-1); else if (e.key === "ArrowRight") step(1); }
  function close(){ document.removeEventListener("keydown", keys); el.remove(); if (OVERLAY && OVERLAY.viewer === el) OVERLAY = null; }
  el.onclick = function(ev){
    var k = ev.target.dataset.lb;

  };

  el.addEventListener("touchend", function(ev){ if (x0 === null) return; var dx = ev.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1); });

function paneDownloads(g){
  $("pane").innerHTML = head("Downloads", "Which photos each client saved. Zips list the photos they contained.")
    + '<div id="zipbox"></div><div id="dls"><div class="spin"></div></div>';
  /* the ready-made zips: what is on disk, how it is doing, and who is downloading right now */
  function gb(n){ return n >= 1e9 ? (n/1e9).toFixed(2) + " GB" : Math.max(1, Math.round(n/1e6)) + " MB"; }
  function mins(ms){ var m = Math.round(ms / 60000); return m < 1 ? Math.max(1, Math.round(ms / 1000)) + " s" : m + " min"; }
  function when(h){ var d = new Date(h + ":00:00Z"); return isNaN(d) ? h : d.toLocaleString(undefined,{weekday:"short",hour:"numeric"}); }
  /* what downloads have cost over the last month: the numbers that say whether the uplink is the limit */
  function usageLine(u){
    if (!u || !u.downloads) return '<p class="hint" style="margin:10px 0 0">No full downloads in the last ' + u.days + ' days.</p>';
    var mine = (u.byGallery || []).filter(function(x){ return x.id === g.id; })[0];
    var h = '<p class="hint" style="margin:10px 0 0">Last ' + u.days + ' days: <b>' + u.downloads + '</b> full download' + (u.downloads === 1 ? "" : "s")

      + (mine ? ' (this gallery: ' + mine.downloads + ', ' + gb(mine.bytes) + ')' : "") + '.</p>';
    h += '<p class="hint" style="margin:6px 0 0">'

      + (u.backedUpHours ? ' The line backed up in ' + u.backedUpHours + ' hour' + (u.backedUpHours === 1 ? "" : "s")
        + (u.busiest && u.busiest[0] ? ' (worst: ' + when(u.busiest[0].hour) + ')' : "") + '. If that keeps happening, your upload speed is the limit.' : "")
      + '</p>';

        + ' · ' + gb(z.usedBytes) + ' of ' + gb(z.budgetBytes) + ' used</span></div>';
      if (!mine.length) h += '<p class="hint" style="margin:10px 0 0">None yet. A zip is built for each part of a published gallery that allows downloads.</p>';
      mine.forEach(function(x){
        var what = x.status === "ready" ? gb(x.bytes) + ' · ' + x.assets + ' photos · built ' + fmtWhen(x.builtAt) + ' · sent ' + x.served + '\u00d7'
          : x.status === "building" ? 'building' + (x.building && x.building.total ? ' ' + Math.min(99, Math.round(x.building.done / x.building.total * 100)) + '%' : '\u2026')
          : x.status === "failed" ? 'failed: ' + esc(x.error || "unknown")
          : x.status === "evicted" ? 'removed to save space; built again if someone asks' : 'not built yet';
        h += '<p class="hint" style="margin:10px 0 0"><b>' + esc(x.set) + '</b> \u2014 ' + what + '</p>';
      });
      if (us.ok) h += usageLine(us.body);
      if (mine.length) h += '<p style="margin:12px 0 0"><button class="btn sm ghost sec" id="zRebuild">Rebuild now</button> '
        + '<button class="btn sm ghost sec" id="zDelete">Delete zips</button></p>';
      box.innerHTML = h + '</div>';
      var rb = $("zRebuild"), dl = $("zDelete");
      if (rb) rb.onclick = function(){ post("/galleries/"+g.id+"/zips", {action:"rebuild"}).then(function(){ toast("Rebuilding"); setTimeout(zipBox, 800); }); };
      if (dl) dl.onclick = function(){ post("/galleries/"+g.id+"/zips", {action:"delete"}).then(function(){ toast("Zips deleted"); zipBox(); }); };
      if (mine.some(function(x){ return x.status === "building"; })) setTimeout(function(){ if ($("zipbox")) zipBox(); }, 3000);

    function thumbs(ids){
      return '<div class="picksrow">' + ids.map(function(id){

    }
    var total = r.body.total, everything = !total ? "" : total === 1 ? "the only photo" : "all " + total + " photos";
    $("dls").innerHTML = people.map(function(p){
      var zipN = p.zips.length;

        + '<span class="pn">' + summary

      if (p.ids.length && !p.all) h += thumbs(p.ids);

}

/* ---------- mailings: one template to many of the people in Contacts ---------- */
var MAILVARS = ["name","title","subtitle","link","expiry","brand","site","unsubscribe"];
var SKIP_WHY = { unsubscribed:"unsubscribed", bounced:"bounced or complained", reserved:"test addresses",
                 no_live_gallery:"no matching live gallery for the placeholders used", not_a_contact:"not in your contacts" };
function mailChrome(title, summary, back){
  chrome({ title:title, summary:summary || "", section:"contacts", crumb:"Contacts", back:back || contactsView, actions:[] });
}
function mailKey(){
  try { return window.crypto.randomUUID(); } catch(e){ return "k" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
}

/* shrink a chosen picture in the browser before it is uploaded: an email image never needs more than ~1200px */
function mailPicture(file){
  return new Promise(function(resolve, reject){
    var img = new Image(), u = URL.createObjectURL(file);
    img.onload = function(){
      var w = img.naturalWidth, hgt = img.naturalHeight, s = Math.min(1, 1200 / w);
      var c = document.createElement("canvas"); c.width = Math.round(w * s); c.height = Math.round(hgt * s);
      var x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      c.toBlob(function(b){ b ? resolve(b) : reject(new Error("blob")); }, "image/jpeg", 0.86);
    };
    img.onerror = function(){ URL.revokeObjectURL(u); reject(new Error("load")); };
    img.src = u;
  });
}

    scaleEmail($("mPrev"));

        toast(r.ok ? "Template updated" : ((r.body && r.body.error) || "Couldn’t save"));
        if (r.ok) (r.body.templates || []).forEach(function(n){ for (var i = 0; i < tpls.length; i++) if (tpls[i].id === n.id) tpls[i] = n; });
      });
    };
