<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="/brand/logo">
<link rel="icon" type="image/png" media="(prefers-color-scheme: dark)" href="/brand/logo?theme=dark">
<link rel="apple-touch-icon" href="/brand/logo">
<title>Gallery</title>
<!--ims:font--><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet"><!--/ims:font-->
<style>
:root{
  --brand-fg:#ffffff;
  --page-bg:#ffffff;
  --page-fg:#1a1a1a;
  --muted:#8a8a8a;
  --line:#e6e6e6;
  --cover-scrim:0.28;
  --gap:10px;
  --maxw:3840px;
  /* Set by a gallery design (see design/design.mjs); these defaults are the original look. */
  --accent:#1a1a1a;
  --accent-fg:#ffffff;
  --tile-bg:#f2f2f2;
  --header-bg:rgba(255,255,255,.93);
  --surface:#ffffff;
  --radius:0px;
  --row-h:330;
  --row-h-tablet:260;
  --tile-min:240px;
  --tile-aspect:1;
  --font:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page-bg);color:var(--page-fg);font-family:var(--font);-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer}

.mark{display:inline-block;background-color:currentColor;
  -webkit-mask-image:url(/brand/logo);mask-image:url(/brand/logo);
  -webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:center;mask-position:center}

/* ---------- loading / message ---------- */
#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--page-bg);z-index:60;transition:opacity .4s}
#boot.hide{opacity:0;pointer-events:none}
.spin{width:26px;height:26px;border:2px solid var(--line);border-top-color:var(--page-fg);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.msg{max-width:420px;padding:0 24px;text-align:center}
.msg h2{font-weight:600;font-size:18px;letter-spacing:.04em;text-transform:uppercase;margin:0 0 10px}
.msg p{color:var(--muted);font-size:14px;line-height:1.6;margin:0}

/* ---------- password gate ---------- */
#gate{position:fixed;inset:0;display:none;place-items:center;background:var(--page-bg);z-index:55}
#gate.on{display:grid}
.gate-box{width:min(380px,88vw);text-align:center}
.gate-box h1{font-size:15px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;margin:0 0 6px}
.gate-box p{color:var(--muted);font-size:13px;margin:0 0 26px}
.gate-box input{width:100%;padding:14px 16px;border:1px solid var(--line);background:transparent;font-family:inherit;font-size:15px;outline:none;text-align:center;letter-spacing:.04em}
.gate-box input:focus{border-color:var(--page-fg)}
.gate-box button{width:100%;margin-top:12px;padding:14px;border:none;background:var(--accent);color:var(--accent-fg);font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
.gate-x{position:absolute;top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));width:44px;height:44px;display:none;place-items:center;
  border:0;background:none;color:var(--page-fg);opacity:.7;border-radius:50%;cursor:pointer;padding:0}
.gate-x:hover{opacity:1;background:rgba(0,0,0,.06)}
#gate.dismissible .gate-x{display:grid}
.gate-field{position:relative}
.gate-box .gate-eye{position:absolute;right:4px;top:0;bottom:0;width:auto;margin:0;padding:0 14px;background:none;color:var(--muted);
  font-size:11px;font-weight:600;letter-spacing:.12em;cursor:pointer}
.gate-box .gate-eye:hover{color:var(--page-fg)}
.gate-box[data-kind=password] .gate-field input{padding-right:70px}
.gate-box:not([data-kind=password]) .gate-eye{display:none}
.gate-err{color:#c0392b;font-size:12.5px;margin-top:14px;min-height:18px;letter-spacing:.02em}

/* ---------- cover ---------- */
#cover{position:relative;height:100svh;min-height:520px;width:100%;overflow:hidden;display:grid;place-items:center;color:var(--brand-fg)}
#cover .bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.04);opacity:0;transition:opacity 1.1s ease,transform 7s ease-out}
#cover.ready .bg{opacity:1;transform:scale(1)}
#cover .scrim{position:absolute;inset:0;background:rgba(0,0,0,var(--cover-scrim))}
.cover-inner{position:relative;text-align:center;padding:0 24px;opacity:0;transform:translateY(14px);transition:opacity .9s .25s ease,transform .9s .25s ease}
#cover.ready .cover-inner{opacity:1;transform:none}
.cover-inner h1{margin:0;font-size:clamp(30px,6.2vw,62px);font-weight:700;letter-spacing:.085em;text-transform:uppercase;line-height:1.08;text-shadow:0 2px 26px rgba(0,0,0,.3)}
.heart{position:absolute;top:7px;right:7px;z-index:2;width:30px;height:30px;border:0;padding:0;border-radius:50%;
  background:rgba(0,0,0,.3);color:rgba(255,255,255,.92);display:grid;place-items:center;cursor:pointer;
  opacity:0;transition:opacity .18s,transform .14s}
.heart svg{fill:none;stroke:currentColor;stroke-width:1.7}
.cell:hover .heart,.heart.on{opacity:1}
.heart.on{color:#fff}
.heart.on svg{fill:currentColor}
.heart:active{transform:scale(.88)}
@media(hover:none){.heart{opacity:.85}}
#lbFav.on svg{fill:currentColor}
.hbtn.on{opacity:1}
.hbtn.on svg{fill:currentColor}

.dlpop{position:absolute;z-index:4;background:var(--surface);color:var(--page-fg);min-width:218px;box-shadow:0 14px 40px rgba(0,0,0,.34);
  border-radius:2px;overflow:hidden}
.dlpop button{display:block;width:100%;text-align:left;border:0;background:none;cursor:pointer;padding:12px 16px;
  font:inherit;font-size:12.5px;color:inherit}
.dlpop button+button{border-top:1px solid var(--line)}
.dlpop button:hover{background:var(--tile-bg)}
.dlpop small{display:block;color:var(--muted);font-size:10.5px;letter-spacing:.04em;margin-top:3px;text-transform:none}

.cover-date[hidden]{display:none}
.cover-date{margin-top:20px;font-size:clamp(10px,1.2vw,12px);letter-spacing:.3em;text-transform:uppercase;opacity:.95}
.cover-cta{margin-top:40px;display:inline-block;padding:15px 44px;border:1px solid rgba(255,255,255,.75);background:transparent;color:#fff;font-size:11px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;transition:background .3s,color .3s}
.cover-cta:hover{background:#fff;color:#111}
.cover-mark{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);opacity:.92}
.cover-mark .mark{width:clamp(54px,9.5vw,72px);height:clamp(54px,9.5vw,72px)}

/* ---------- header ---------- */
body.lb-open header{visibility:hidden}
.sets{display:flex;gap:4px 24px;flex-wrap:wrap;align-items:center}
.sets[hidden]{display:none}
.sets button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:6px 0;cursor:pointer;white-space:nowrap;color:var(--page-fg);
  opacity:.5;font-size:12.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  transition:opacity .2s,border-color .2s;font-family:inherit}
.sets button:hover{opacity:.85}
.sets button.on{opacity:1;border-bottom-color:currentColor}

header{position:sticky;top:0;z-index:30;background:var(--header-bg);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
/* the header and the grid share one width and one side margin, so the title lines up with the first photo */
:root{--edge:max(var(--gap),14px)}
.hwrap{max-width:var(--maxw);margin:0 auto;padding:14px var(--edge);min-height:78px;display:flex;align-items:center;flex-wrap:wrap;gap:8px 36px}
.hhead{min-width:0;flex:0 1 auto}
.htitle{font-size:20px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;line-height:1.2;overflow-wrap:anywhere}
.hsub{margin-top:6px;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:.24em;text-transform:uppercase}
.hsub:empty{display:none}
.hact{margin-left:auto;display:flex;align-items:center;gap:6px;flex:0 0 auto}
.hcount{color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;margin-right:10px}
.hbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;padding:10px 8px;border:none;background:transparent;color:var(--page-fg);opacity:.72;font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;transition:opacity .22s}
.hbtn:hover{opacity:1}
.hbtn[hidden]{display:none}
.hbtn svg{display:none;flex:0 0 auto}
.hbtn[disabled]{opacity:.3;cursor:default}
@media(max-width:700px){
  .hcount{display:none}
  .hwrap{gap:6px 12px;padding:10px var(--edge);min-height:64px}
  .hhead{flex:1 1 0}
  .htitle{font-size:15px;letter-spacing:.1em}
  .hsub{margin-top:4px;font-size:10px}
  .sets{order:3;flex:0 0 100%;gap:2px 20px}
  .sets button{font-size:11.5px}
  .hbtn span{display:none}
  .hbtn svg{display:block;width:19px;height:19px}
  .hbtn{width:40px;height:40px;padding:0;gap:0;flex:0 0 auto;opacity:.85}
  .hact{gap:0}
}
/* tablets: a little more room than a phone, less than a desktop */
@media(min-width:701px) and (max-width:1100px){
  .hwrap{gap:8px 24px}
  .cover-inner h1{font-size:clamp(34px,6vw,54px)}
}
/* touch screens: bigger targets, and clear of a notch in landscape */
@media(pointer:coarse){
  .heart{width:36px;height:36px}
  .ibtn{width:44px;height:44px}
  .nav{width:56px;height:56px}
  #toTop{width:48px;height:48px}
}
@media(pointer:coarse){
  .hwrap{padding-left:max(var(--edge),env(safe-area-inset-left));padding-right:max(var(--edge),env(safe-area-inset-right))}
}

/* ---------- grid ---------- */
#grid{max-width:var(--maxw);margin:0 auto;padding:var(--gap)}
@media(pointer:coarse){#grid{padding-left:max(var(--gap),env(safe-area-inset-left));padding-right:max(var(--gap),env(safe-area-inset-right))}}
.row{display:flex;gap:var(--gap);margin-bottom:var(--gap)}
.cell{position:relative;overflow:hidden;background:var(--tile-bg);border-radius:var(--radius);cursor:zoom-in}
.cell img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .55s ease,transform .7s ease}
.cell img.in{opacity:1}
.cell:hover img{transform:scale(1.035)}
.cell .vid{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.cell .vid span{background:rgba(0,0,0,.45);color:#fff;border-radius:50%;width:48px;height:48px;display:grid;place-items:center}
footer{padding:70px 20px 90px;text-align:center;color:var(--muted);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase}
footer .mark{width:42px;height:42px;opacity:.6;margin-bottom:18px}
footer a{color:inherit;text-decoration:none;transition:color .25s,opacity .25s}
footer a:hover{color:var(--page-fg)}
#footMark a{display:inline-block;color:var(--page-fg);opacity:.6}
#footMark a:hover{opacity:1}
.flinks{margin-top:16px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:10.5px;letter-spacing:.2em}
.fdot{opacity:.45}
.cover-mark a{color:inherit;display:inline-block;transition:opacity .25s}
.cover-mark a:hover{opacity:.7}

/* ---------- lightbox ---------- */
/* A phone browser's toolbars overlap a fixed, full-height overlay, which used to hide the
   close and download buttons. --lbh follows the visible viewport; svh is the fallback.
   `position:fixed` is measured against the layout viewport, and on iOS the visible area can
   end up sitting lower inside it -- after a keyboard closes, or when locking the body
   collapses the page. The overlay then renders above the screen and takes the close button
   with it, so --lbt pushes it back down to where the visible area actually starts. */
#lb{position:fixed;left:0;right:0;top:var(--lbt,0px);height:100vh;height:100svh;height:var(--lbh,100svh);
  z-index:50;overscroll-behavior:contain;touch-action:none;background:#0d0d0d;display:none;opacity:0;transition:opacity .28s}
#lb.on{display:block}
#lb.vis{opacity:1}
/* minmax(0,1fr), not the default auto: an auto track grows to the image's natural
   height, and `max-height:100%` then measures against that inflated track and does
   nothing, so a tall photo ran off the bottom of the screen. */
#lb .stage{position:absolute;inset:0;display:grid;grid-template:minmax(0,1fr)/minmax(0,1fr);
  place-items:center;padding:62px 70px;touch-action:none;overflow:hidden}
#lb img,#lb video{max-width:100%;max-height:100%;object-fit:contain;width:auto;height:auto}
#lb video{width:100%;height:100%;background:#000}
#lb img{transform-origin:50% 50%;will-change:transform}
#lb .bar{position:absolute;top:0;left:0;right:0;min-height:60px;display:flex;align-items:center;gap:8px;z-index:2;
  padding:env(safe-area-inset-top) calc(14px + env(safe-area-inset-right)) 0 calc(14px + env(safe-area-inset-left));color:#fff;
  background:linear-gradient(rgba(0,0,0,.58),rgba(0,0,0,0));pointer-events:none}
#lb .bar .ibtn{pointer-events:auto}
#lb .bar .idx{font-size:11px;letter-spacing:.18em;opacity:.75;margin-right:auto}
.ibtn{width:42px;height:42px;display:grid;place-items:center;background:transparent;border:none;color:#fff;opacity:.8;border-radius:50%}
.ibtn:hover{opacity:1;background:rgba(255,255,255,.12)}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.08);border:none;color:#fff;display:grid;place-items:center}
.nav:hover{background:rgba(255,255,255,.2)}
.nav.prev{left:14px}.nav.next{right:14px}
@media(max-width:700px){
  #lb .stage{padding:calc(60px + env(safe-area-inset-top)) 8px calc(86px + env(safe-area-inset-bottom))}
  .nav{display:none}
}
#lb .mbar{position:absolute;left:0;right:0;bottom:0;min-height:74px;display:none;align-items:center;justify-content:center;gap:10px;z-index:2;
  padding-bottom:env(safe-area-inset-bottom);background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.6))}
@media(max-width:700px){#lb .mbar{display:flex}}
.mbtn{padding:12px 20px;border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;font-size:11px;letter-spacing:.16em;text-transform:uppercase;border-radius:2px}

/* ---------- video quality ---------- */
#lbQ{width:auto;padding:0 14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;border:1px solid rgba(255,255,255,.4);border-radius:999px;height:34px;display:none;white-space:nowrap}
#lbQ.on{display:block}
#lbQm{position:absolute;z-index:4;top:calc(56px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));display:none;min-width:190px;
  background:#1b1b1b;color:#fff;border:1px solid rgba(255,255,255,.18);box-shadow:0 14px 40px rgba(0,0,0,.5);padding:6px}
#lbQm.on{display:block}
#lbQm button{display:block;width:100%;text-align:left;border:0;background:none;color:inherit;font:inherit;font-size:13px;padding:12px 14px;cursor:pointer}
#lbQm button:hover{background:rgba(255,255,255,.1)}
#lbQm button.on:after{content:"\2713";float:right}
#lbQm small{display:block;opacity:.6;font-size:11px;margin-top:2px}

/* ---------- progress modal ---------- */
#prog{position:fixed;inset:0;z-index:80;background:rgba(12,12,12,.72);backdrop-filter:blur(3px);display:none;place-items:center;padding:24px}
#prog.on{display:grid}
.pbox{width:min(420px,100%);background:var(--page-bg);color:var(--page-fg);padding:34px 30px 26px;text-align:center}
.pbox h3{margin:0 0 10px;font-size:13px;font-weight:600;letter-spacing:.2em;text-transform:uppercase}
.pbox p{margin:0 0 22px;color:var(--muted);font-size:13px;line-height:1.6}
.pbar{height:3px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s ease}
.pbar.indet i{width:35%;animation:slide 1.3s ease-in-out infinite}
@keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
.pstat{margin-top:14px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);min-height:16px}
.pcancel{margin-top:24px;padding:11px 26px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;transition:color .2s,border-color .2s}
.pcancel:hover{color:var(--page-fg);border-color:var(--page-fg)}
.pgo{display:none;margin:24px 8px 0 0;padding:11px 26px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
#prog.ready .pgo{display:inline-block}
#prog.ready .pbar{display:none}
.pgo+.pcancel{margin-top:24px}

/* ---------- share ---------- */
#share{position:fixed;inset:0;z-index:75;background:rgba(12,12,12,.62);display:none;place-items:center;padding:20px}
#share.on{display:grid}
.sbox{position:relative;width:min(460px,100%);background:var(--surface);color:var(--page-fg);padding:38px 38px 34px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sbox h3{margin:0 0 26px;font-size:16px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.sx{position:absolute;top:12px;right:12px;width:40px;height:40px;border:0;background:none;color:var(--muted);display:grid;place-items:center;padding:0;cursor:pointer}
.sx:hover{color:var(--page-fg)}
.slink{display:flex;margin-bottom:34px;background:var(--tile-bg)}
.slink input{flex:1 1 auto;min-width:0;border:0;background:none;padding:16px;font:inherit;font-size:14px;color:inherit;outline:none}
.slink button{flex:0 0 auto;border:0;background:var(--accent);color:var(--accent-fg);padding:0 26px;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 8px}
.sgrid button{display:flex;flex-direction:column;align-items:center;gap:10px;border:0;background:none;color:var(--muted);font-size:12.5px;letter-spacing:.02em;padding:0;cursor:pointer}
.sgrid button:hover{color:var(--page-fg)}
.sgrid i{width:56px;height:56px;border-radius:50%;background:var(--muted);color:var(--surface);display:grid;place-items:center;font-style:normal;transition:background .2s}
.sgrid button:hover i{background:var(--page-fg)}
.sgrid svg{width:28px;height:28px;fill:currentColor}
@media(max-width:420px){.sbox{padding:30px 22px 26px}.sgrid{gap:22px 4px}.sgrid i{width:48px;height:48px}.sgrid button{font-size:11px}}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,16px);background:#111;color:#fff;padding:13px 22px;font-size:12px;letter-spacing:.09em;z-index:70;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- back to top ---------- */
#toTop{position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);padding:0;
  background:var(--surface);color:var(--page-fg);box-shadow:0 4px 16px rgba(0,0,0,.16);cursor:pointer;z-index:40;
  display:grid;place-items:center;opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .25s,transform .25s,visibility .25s}
#toTop.on{opacity:1;visibility:visible;transform:none}
#toTop:hover{border-color:var(--page-fg)}
#toTop svg{display:block}
@media(max-width:700px){#toTop{right:calc(14px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));width:48px;height:48px}}
</style>
</head>
<body>

<div id="boot"><div class="spin"></div></div>

<div id="gate">
  <button type="button" class="gate-x" id="gateX" aria-label="Close"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
  <form class="gate-box" id="gateForm">
    <h1 id="gateTitle">Private Gallery</h1>
    <p id="gateSub">Enter the password you were given</p>
    <div class="gate-field">
      <input id="gatePw" type="password" autocomplete="current-password" placeholder="Password" autofocus>
      <button type="button" class="gate-eye" id="gateEye" aria-label="Show password" aria-pressed="false">SHOW</button>
    </div>
    <button type="submit" id="gateBtn">Enter</button>
    <div class="gate-err" id="gateErr"></div>
  </form>
</div>

<main id="app" hidden>
  <section id="cover">
    <div class="bg" id="coverBg"></div>
    <div class="scrim"></div>
    <div class="cover-inner">
      <h1 id="coverTitle"></h1>
      <div class="cover-date" id="coverDate"></div>
      <button class="cover-cta" id="coverCta">View Gallery</button>
    </div>
    <div class="cover-mark" id="coverMark"></div>
  </section>

  <header id="hdr">
    <div class="hwrap">
      <div class="hhead"><div class="htitle" id="hTitle"></div><div class="hsub" id="hSub"></div></div>
      <nav class="sets" id="setRow" hidden></nav>
      <div class="hact">
        <div class="hcount" id="hCount"></div>

<script>
(function(){
"use strict";

var API = "/api";
var BRAND = {};   /* filled from the gallery descriptor */
var HEART = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">'
  + '<path d="M12 20.3l-1.3-1.2C6.1 15 3.2 12.4 3.2 9.2 3.2 6.7 5.2 4.8 7.7 4.8c1.4 0 2.8.7 3.6 1.8l.7.9.7-.9'
  + 'c.8-1.1 2.2-1.8 3.6-1.8 2.5 0 4.5 1.9 4.5 4.4 0 3.2-2.9 5.8-7.5 9.9z"/></svg>';
var MARK = '<span class="mark" aria-hidden="true"></span>';

/* ---------- helpers ---------- */
var $ = function(id){ return document.getElementById(id); };
function toast(t){ var e=$("toast"); e.textContent=t; e.classList.add("on"); clearTimeout(e._t); e._t=setTimeout(function(){e.classList.remove("on");},2600); }
function fail(title, body){
  $("boot").innerHTML = '<div class="msg"><h2>'+title+'</h2><p>'+body+'</p></div>';
  $("boot").classList.remove("hide");
}
function hashColor(h){
  /* decode only the DC (average colour) from a thumbhash - no image decode needed */
  if (!h) return null;
  try{
    var bin = atob(h.replace(/-/g,"+").replace(/_/g,"/"));
    if (bin.length < 3) return null;
    var h24 = bin.charCodeAt(0) | (bin.charCodeAt(1)<<8) | (bin.charCodeAt(2)<<16);
    var l = (h24 & 63)/63, pp = ((h24>>6)&63)/31.5 - 1, q = ((h24>>12)&63)/31.5 - 1;
    var b = l - 2/3*pp, r = (3*l - b + q)/2, g = r - q;
    var cl = function(v){ return Math.max(0, Math.min(255, Math.round(v*255))); };
    return "rgb(" + cl(r) + "," + cl(g) + "," + cl(b) + ")";
  }catch(e){ return null; }
}
var dlAbort = null;
function mb(n){ return (n/1048576).toFixed(n > 10485760 ? 0 : 1) + " MB"; }
function progOpen(title, msg, onCancel){
  $("progTitle").textContent = title;
  $("progMsg").textContent = msg;
  $("progStat").textContent = "Starting\u2026";
  $("progBar").style.width = "0";
  document.querySelector(".pbar").classList.add("indet");
  $("prog").classList.add("on");
  $("progCancel").onclick = function(){ if (onCancel) onCancel(); progClose(); };
}
function progClose(){ $("prog").classList.remove("on", "ready"); $("progCancel").onclick = null; $("progGo").onclick = null; }
function progSet(loaded, total){
  var bar = document.querySelector(".pbar");
  if (total > 0){
    bar.classList.remove("indet");
    $("progBar").style.width = Math.min(100, loaded/total*100) + "%";
    $("progStat").textContent = mb(loaded) + " of " + mb(total);
  } else {
    $("progStat").textContent = mb(loaded) + " downloaded";
  }
}
/* fetch that reports progress and can be cancelled */
function fetchProgress(url, opts, onProg){
  opts = opts || {};
  var ctl = new AbortController();
  dlAbort = ctl;
  opts.signal = ctl.signal;
  opts.credentials = "include";
  return fetch(url, opts).then(function(r){
    if (!r.ok) throw new Error("http " + r.status);
    var total = parseInt(r.headers.get("content-length") || "0", 10);
    var type = r.headers.get("content-type") || "";
    var name = filenameFrom(r, 0);
    if (!r.body || !r.body.getReader) {
      return r.blob().then(function(b){ return {blob:b, name:name, type:type}; });
    }
    var reader = r.body.getReader(), chunks = [], loaded = 0;
    return (function pump(){
      return reader.read().then(function(res){
        if (res.done) return {blob: new Blob(chunks, {type:type}), name:name, type:type};
        chunks.push(res.value); loaded += res.value.length;
        if (onProg) onProg(loaded, total);
        return pump();
      });
    })();
  });
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

/* auth: either a slug (from the path) or an explicit key (query) */
var slug = null;
(function parse(){
  var m = location.pathname.replace(/\/+$/,"").split("/").filter(Boolean);
  var i = m.indexOf("g");
  /* a gallery is /<slug>; /g/<slug> is the old form, still honoured for links in the wild */
  if (i >= 0 && m[i+1]) slug = decodeURIComponent(m[i+1]);
  else if (m.length === 1) slug = decodeURIComponent(m[0]);
})();
/* The admin's device preview loads this same page with a marker, and reads its photos from the admin's own
   preview routes (no gate, no activity log, never the originals). The marker only changes where data comes from. */
var PREVIEW = (document.querySelector('meta[name="ims-preview"]') || {}).content || null;
if (PREVIEW) slug = "preview";
/* ?picks=<token> is somebody's shared list of favourites: the same page and the same gate, narrowed to those photos */
var SHARED = (!PREVIEW && /^[A-Za-z0-9_-]{16,64}$/.test(new URLSearchParams(location.search).get("picks") || ""))
  ? new URLSearchParams(location.search).get("picks") : null;
var BASE = PREVIEW ? (API + "/admin/design-preview/" + PREVIEW) : (slug ? (API + "/g/" + encodeURIComponent(slug)) : null);
if (PREVIEW) window.addEventListener("message", function(ev){
  /* only the admin page that framed this one, and only these two messages; the CSS is the server's own output */
  if (ev.origin !== location.origin || ev.source !== window.parent) return;
  var m = ev.data || {};
  if (m.type === "ims-design"){
    var st = document.getElementById("ims-design");
    if (!st){ st = document.createElement("style"); st.id = "ims-design"; document.head.appendChild(st); }
    st.textContent = String(m.css || "");
    if (typeof m.fontHref === "string" && (m.fontHref === "" || m.fontHref.indexOf("https://fonts.googleapis.com/css2?") === 0)){
      var fl = document.querySelector('link[rel="stylesheet"][href^="https://fonts.googleapis.com/"]');
      if (!m.fontHref){ if (fl) fl.remove(); }
      else if (fl){ if (fl.getAttribute("href") !== m.fontHref) fl.setAttribute("href", m.fontHref); }
      else { fl = document.createElement("link"); fl.rel = "stylesheet"; fl.href = m.fontHref; document.head.appendChild(fl); }
    }
    fitCover();
    if (!$("app").hidden) layout();
  } else if (m.type === "ims-scroll"){
    /* show the part of the page being edited; nothing else is accepted */
    var to = m.to === "grid" ? $("hdr") : (m.to === "cover" ? $("cover") : null);
    if (to) to.scrollIntoView({block:"start", behavior: (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) ? "auto" : "smooth"});
  } else if (m.type === "ims-cover"){
    if (typeof m.focus === "string" && /^\d{1,3}(\.\d+)? \d{1,3}(\.\d+)?$/.test(m.focus)) $("coverBg").style.backgroundPosition = m.focus.replace(" ", "% ") + "%";
    if (typeof m.src === "string" && m.src.indexOf("/api/admin/") === 0){
      var im = new Image();
      im.onload = function(){ coverNat = { w: im.naturalWidth, h: im.naturalHeight }; $("coverBg").style.backgroundImage = 'url("' + m.src + '")'; fitCover(); $("cover").classList.add("ready"); };
      im.src = m.src;
    }
  }
});

function imgUrl(id, size){ return BASE + "/img/" + id + "?size=" + size; }
function getJSON(path, opts){
  return fetch(BASE + (path||""), Object.assign({credentials:"same-origin"}, opts||{}))
    .then(function(r){
      return r.json().then(function(j){ return {ok:r.ok, status:r.status, body:j}; },
                           function(){ return {ok:r.ok, status:r.status, body:null}; });
    });
}
function postJSON(path, data){
  return getJSON(path, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(data)});
}

/* ---------- state ---------- */
var link=null, album=null, assets=[], slideTimer=null, cur=0;
var lastW = 0;
var scrollLockY = 0;
var shareCache = {};   /* assetId -> {file:File} prepared ahead of the tap */

function fetchOriginal(a){
  /* resolves to a File of the untouched original, cached per asset */
  if (shareCache[a.id]) return Promise.resolve(shareCache[a.id]);
  return fetch(imgUrl(a.id, "original"), {credentials:"same-origin"}).then(function(r){
    if (!r.ok) throw new Error("fetch");
    var name = filenameFrom(r, 0);
    var type = r.headers.get("content-type") || "image/jpeg";
    return r.blob().then(function(bl){
      var f = null;
      try { f = new File([bl], name, {type: type}); } catch(e){}
      if (f) shareCache[a.id] = f;
      return f;
    });
  });
}
function lockScroll(){
  scrollLockY = window.scrollY || window.pageYOffset || 0;
  var b = document.body;
  b.style.position = "fixed";
  b.style.top = (-scrollLockY) + "px";
  b.style.left = "0";
  b.style.right = "0";
  b.style.width = "100%";
  b.style.overflow = "hidden";
}
function unlockScroll(){
  var b = document.body;
  b.style.position = ""; b.style.top = ""; b.style.left = "";
  b.style.right = ""; b.style.width = ""; b.style.overflow = "";
  window.scrollTo(0, scrollLockY);
}

/* ---------- boot ---------- */
if (!slug){
  fail("No gallery specified", "This link is missing its gallery address. Please use the full link you were sent.");
  return;
}
resolve();

function resolve(){
  getJSON("").then(function(r){
    if (r.status === 410) return fail("This gallery has expired","The link is no longer available. Please contact your photographer for access.");
    if (!r.ok) return fail("Gallery not found","This link doesn't appear to be valid. Please check the address you were sent.");
    link = r.body;
    BRAND = (r.body && r.body.brand) || {};
    album = {albumName: r.body.title, description: r.body.subtitle};
    if (r.body.gate === "password") return showGate("password");
    if (r.body.gate === "email")    return showGate("email");
    loadGallery();
  }).catch(function(){ fail("Can't connect","The gallery could not be reached. Please check your connection and try again."); });
}

function notFound(r){
  var m = (r.body && r.body.message) || "";
  if (/expired/i.test(m)) fail("This gallery has expired","The link is no longer available. Please contact your photographer for access.");
  else fail("Gallery not found","This link doesn't appear to be valid. Please check the address you were sent.");
}

/* ---------- password ---------- */
function showGate(kind){
  $("gate").classList.remove("dismissible");     /* only a heart's email prompt can be closed; the door cannot */
  $("boot").classList.add("hide");
  $("gate").classList.add("on");
  $("gate").dataset.kind = kind;
  $("gateForm").dataset.kind = kind;
  gateEye(false);
  if (kind === "email"){
    $("gateTitle").textContent = link && link.title ? link.title : "View this gallery";
    $("gateSub").textContent = "Enter your email to view these photos";
    $("gatePw").type = "email";
    $("gatePw").placeholder = "you@example.com";
    $("gatePw").autocomplete = "email";
    $("gateBtn").textContent = "View Gallery";
  } else {
    $("gateTitle").textContent = "Private Gallery";
    $("gateSub").textContent = "Enter the password you were given";
    $("gatePw").type = "password";
    $("gatePw").placeholder = "Password";
    $("gatePw").autocomplete = "current-password";
    $("gateBtn").textContent = "Enter";
  }
  $("gatePw").value = "";
  $("gateErr").textContent = "";
  setTimeout(function(){ $("gatePw").focus(); }, 60);
}

function gateEye(show){
  var i = $("gatePw"), b = $("gateEye");
  if ($("gateForm").dataset.kind === "password") i.type = show ? "text" : "password";
  b.textContent = show ? "HIDE" : "SHOW";
  b.setAttribute("aria-pressed", show ? "true" : "false");
  b.setAttribute("aria-label", show ? "Hide password" : "Show password");
}
$("gateEye").addEventListener("click", function(){ gateEye($("gatePw").type === "password"); $("gatePw").focus(); });
function gateClose(){ $("gate").classList.remove("on","dismissible"); favPending = null; }
$("gateX").addEventListener("click", gateClose);
document.addEventListener("keydown", function(e){
  if (e.key === "Escape" && $("gate").classList.contains("dismissible")) { e.stopPropagation(); gateClose(); }
}, true);
$("gateForm").addEventListener("submit", function(e){
  e.preventDefault();
  var kind = $("gate").dataset.kind;
  var v = $("gatePw").value.trim();
  if (!v) return;
  $("gateErr").textContent = "";
  $("gateBtn").disabled = true;

  var call = (kind === "email") ? postJSON("/register", {email: v}) : postJSON("/unlock", {password: v});
  call.then(function(r){
    $("gateBtn").disabled = false;
    if (r.status === 429) { $("gateErr").textContent = "Too many attempts. Please wait a few minutes."; return; }
    if (!r.ok){
      $("gateErr").textContent = (kind === "email")
        ? "That doesn't look like a valid email address."
        : "That password didn't work. Please try again.";
      $("gatePw").value = ""; $("gatePw").focus();
      return;
    }
    if (r.body && r.body.gate === "email") return showGate("email");   /* password cleared, now ask for email */
    $("gate").classList.remove("on");
    $("boot").classList.remove("hide");
    $("boot").innerHTML = '<div class="spin"></div>';
    loadGallery();
  }).catch(function(){
    $("gateBtn").disabled = false;
    $("gateErr").textContent = "Something went wrong. Please try again.";
  });
});

/* ---------- load ---------- */
var curSet = null;
var favs = {}, favNamed = false, favOnly = false;

function loadFavs(then){
  getJSON("/favourites").then(function(r){
    favs = {}; favNamed = !!(r.body && r.body.named);
    ((r.body && r.body.ids) || []).forEach(function(id){ favs[id] = true; });
    if (then) then();
  }).catch(function(){ if (then) then(); });
}
function favCount(){ return Object.keys(favs).filter(function(k){ return favs[k]; }).length; }

/* The heart is the only thing that needs to know who you are. A gallery with no gate
   asks here rather than at the door, so browsing stays open. */
var favPending = null;
function toggleFav(id, el){
  var on = !favs[id];
  postJSON("/favourites", {assetId:id, on:on}).then(function(r){
    if (r.status === 401 && r.body && r.body.error === "who"){
      favPending = id;
      showGate("email");
      $("gateSub").textContent = "Enter your email so your picks are saved against your name";
      $("gate").classList.add("dismissible");
      return;
    }
    if (!r.ok) return toast("Couldn't save that pick");
    favs[id] = on;
    paintFavUi();
    if (favOnly && !on) render();
  }).catch(function(){ toast("Couldn't save that pick"); });
}
function paintHearts(){
  Array.prototype.forEach.call(document.querySelectorAll(".cell .heart"), function(h){
    h.classList.toggle("on", !!favs[h.dataset.id]);
  });
}
function paintFavUi(){
  if (SHARED) return;
  paintHearts();
  var n = favCount();
  var b = $("btnFav");
  if (b){
    b.hidden = n === 0 && !favOnly;
    $("btnShareFav").hidden = !(favOnly && n > 0);
    b.classList.toggle("on", favOnly);
    var lab = b.querySelector("span");
    if (lab) lab.textContent = favOnly ? "All Photos" : ("Favourites \u00b7 " + n);
  }
  var h = $("lbFav");
  if (h && view[cur]) h.classList.toggle("on", !!favs[view[cur].id]);
}

/* A gallery may be delivered in named parts. One part needs no name - it is just
   "the photos" - so the row only appears when there is a choice to make. */
function drawSets(){
  var sets = (link && link.sets) || [];
  var row = $("setRow");
  if (sets.length < 2){ row.hidden = true; row.innerHTML = ""; return; }
  row.hidden = false;
  row.innerHTML = sets.map(function(s){
    return '<button data-set="' + s.id + '"' + (s.id === curSet ? ' class="on"' : '') + '>' + esc(s.name) + '</button>';
  }).join("");
  row.onclick = function(ev){
    var b = ev.target.closest("button"); if (!b) return;
    var id = Number(b.dataset.set);
    if (id === curSet) return;
    loadGallery(id);
  };
}

function loadGallery(setId){
  var q = setId ? "/assets?set=" + encodeURIComponent(setId) : "/assets";
  if (SHARED) q = "/assets?picks=" + SHARED;
  getJSON(q).then(function(r){
    if (r.status === 401) { var g = r.body && r.body.gate; return showGate(g || "email"); }
    if (!r.ok) return fail("Couldn't load photos","Something went wrong loading this gallery. Please try again shortly.");
    assets = (r.body && r.body.assets) || [];
    curSet = (r.body && r.body.setId) || null;
    loadFavs(function(){
      render();
      paintFavUi();
      if (favPending){ var id = favPending; favPending = null; toggleFav(id, null); }
    });
    drawSets();
    if (setId) window.scrollTo({ top: $("hdr").offsetTop, behavior: "smooth" });
  }).catch(function(){ fail("Couldn't load photos","Something went wrong loading this gallery. Please try again shortly."); });
}

/* ---------- render ---------- */

var view = [];                      /* what is on screen: all photos, or only the picks */
/* `cover` sizing leaves no slack when the photo and the screen are the same shape,
   and with no slack the focal point has nothing to move. Hold it a little larger
   than it needs to be so there is always somewhere to go. */
var COVER_ZOOM = 1.12, coverNat = null;
function fitCover(){
  var bg = document.getElementById("coverBg"), host = document.getElementById("cover");
  if (!bg || !host || !coverNat || !coverNat.w || !coverNat.h) return;
  /* the photo's own box: the whole cover normally, a smaller area in the layouts that inset it */
  var cw = bg.clientWidth, ch = bg.clientHeight;
  if (!cw || !ch) return;
  var k = Math.max(cw / coverNat.w, ch / coverNat.h) * COVER_ZOOM;
  bg.style.backgroundSize = Math.ceil(coverNat.w * k) + "px " + Math.ceil(coverNat.h * k) + "px";

window.addEventListener("orientationchange", function(){ setTimeout(fitCover, 250); });

function shown(){

  return view;
}
function render(){
  var title = album.albumName || "Gallery";
  document.title = title;
  $("coverTitle").textContent = title;
  $("hTitle").textContent = title;
  $("hSub").textContent = BRAND.name || "";
  $("coverMark").innerHTML = BRAND.url
    ? '<a href="'+esc(BRAND.url)+'" target="_blank" rel="noopener">'+MARK+'</a>' : MARK;
  $("footMark").innerHTML = BRAND.url
    ? '<a href="'+esc(BRAND.url)+'" target="_blank" rel="noopener">'+MARK+'</a>' : MARK;
  $("footText").textContent = BRAND.name || title;
  var fl = [];
  if (BRAND.url) fl.push('<a href="'+esc(BRAND.url)+'" target="_blank" rel="noopener">'
                         + esc(BRAND.url.replace(/^https?:\/\//,"").replace(/\/$/,"")) + '</a>');
  if (BRAND.social) fl.push('<a href="'+esc(BRAND.social)+'" target="_blank" rel="noopener">'
                         + esc(BRAND.socialLabel || BRAND.social.replace(/^https?:\/\//,"")) + '</a>');
  $("flinks").innerHTML = fl.join('<span class="fdot">&middot;</span>');

     blank - guessing a date from the first photo was wrong as often as it was right. */
  var desc = (album.description || "").trim();
  $("coverDate").textContent = desc;
  $("coverDate").hidden = !desc;

  var n = shown().length;
  $("hCount").textContent = n + (n===1 ? " Photo" : " Photos");

  var coverSrc = (link && link.cover) || (assets[0] ? imgUrl(assets[0].id, "preview") : null);
  var coverLow = link && link.coverSmall;
  if (coverSrc){
    /* where to hold the crop when the cover does not match the shape of the screen */
    $("coverBg").style.backgroundPosition = ((link && link.coverFocus) || "50 50").replace(" ", "% ") + "%";

    /* the small one is a fifth of the bytes: show it the moment it lands, then let the
       full one replace it. The swap is invisible; the wait was not. */
    var full = new Image();
    full.onload = function(){
      coverNat = { w: full.naturalWidth, h: full.naturalHeight };
      $("coverBg").style.backgroundImage = 'url("' + coverSrc + '")';
      fitCover();
      $("cover").classList.add("ready");
    };
    full.onerror = function(){ $("cover").classList.add("ready"); };

    if (coverLow){
      var low = new Image();
      low.onload = function(){
        if (!$("cover").classList.contains("ready")){
          coverNat = { w: low.naturalWidth, h: low.naturalHeight };
          $("coverBg").style.backgroundImage = 'url("' + coverLow + '")';
          fitCover();
          $("cover").classList.add("ready");
        }
      };
      low.src = coverLow;
    }
    full.src = coverSrc;
  } else { $("cover").classList.add("ready"); }

  if (SHARED){
    $("btnFav").style.display = "none";
    $("lbFav").style.display = "none";
  }
  if (link && link.allowDownload === false){
    $("btnAll").setAttribute("disabled","");
    $("lbDl").style.display = "none";
    $("mDl").style.display = "none";
  }

  $("app").hidden = false;
  $("boot").classList.add("hide");

/* Loads images as they approach the viewport, nearest the middle of the screen first. Only a few are
   in flight at once, so a photo scrolled to is never queued behind dozens already asked for further
   up the page; and when scrolling stops, anything still loading well off screen is called back. */
var pending = [], loading = [], inflight = 0, MAXF = 8;
var lastY = window.scrollY, lastT = Date.now(), fast = false, idleT, dwellT;
window.addEventListener("scroll", function(){
  var now = Date.now(), dy = Math.abs(window.scrollY - lastY), dt = Math.max(1, now - lastT);
  fast = (dy/dt) > 2.2;           /* px per ms */
  lastY = window.scrollY; lastT = now;
  clearTimeout(idleT); clearTimeout(dwellT);
  idleT = setTimeout(function(){ fast = false; recall(); drain(); dwellT = setTimeout(prefetchDwelt, 350); }, 120);
}, {passive:true});

function recall(){
  var vh = window.innerHeight;
  loading.slice().forEach(function(im){
    var r = im.getBoundingClientRect();
    if (r.bottom > -vh && r.top < vh * 2) return;       /* near the screen: let it finish */
    var src = im._src;
    im.removeAttribute("src");                           /* the browser drops the request */
    im.dataset.src = src;
    if (im._release) im._release();
    if (pending.indexOf(im) < 0) pending.push(im);
  });
}

function drain(){
  if (fast || inflight >= MAXF || !pending.length) return;
  var vh = window.innerHeight;
  var keyed = pending.map(function(im){ return [Math.abs(im.getBoundingClientRect().top - vh/2), im]; });
  keyed.sort(function(a,b){ return a[0] - b[0]; });
  pending = keyed.map(function(k){ return k[1]; });
  pending.splice(0, MAXF - inflight).forEach(function(im){
    if (!im.dataset.src) return;
    var r = im.getBoundingClientRect();
    im.fetchPriority = (r.bottom > 0 && r.top < vh) ? "high" : "low";
    var src = im.dataset.src, tries = 0, freed = false;
    im._src = src;
    inflight++; loading.push(im);
    function release(){
      if (freed) return; freed = true;
      inflight--; var i = loading.indexOf(im); if (i >= 0) loading.splice(i, 1);
      im._release = null;
      drain();
    }
    im._release = release;
    im.addEventListener("load", release, {once:true});
    im.onerror = function(){
      release();
      /* a photo added a moment ago may not have its thumbnail yet: ask again, a little later each time */
      if (++tries > 6) { im.onerror = null; return; }
      setTimeout(function(){ im.src = src + (src.indexOf("?") < 0 ? "?" : "&") + "r=" + tries; }, 1200 * tries * tries);
    };
    im.src = src;
    delete im.dataset.src;
  });
}

/* Someone who stops on a photo is likely to open it: fetch the screen-size version of the few nearest
   the middle now, so the lightbox opens on a finished picture. Quietly skipped on a data saver. */
var warmed = {};
function prefetchDwelt(){
  if (inflight || (navigator.connection && navigator.connection.saveData)) return;
  var vh = window.innerHeight, cells = [];
  Array.prototype.forEach.call(document.querySelectorAll("#grid .cell"), function(c){
    var r = c.getBoundingClientRect();
    if (r.bottom > 0 && r.top < vh) cells.push([Math.abs((r.top + r.bottom) / 2 - vh / 2), c]);
  });
  cells.sort(function(a,b){ return a[0] - b[0]; });
  cells.slice(0, 4).forEach(function(k){
    var a = view[Number(k[1].dataset.idx)];
    if (!a || !a.isImage || warmed[a.id]) return;
    warmed[a.id] = true;
    var im = new Image(); im.fetchPriority = "low"; im.src = imgUrl(a.id, "preview");
  });
}

var io = new IntersectionObserver(function(entries){
  entries.forEach(function(e){
    if (!e.isIntersecting) return;
    io.unobserve(e.target);
    if (e.target.dataset.src && pending.indexOf(e.target) < 0) pending.push(e.target);
  });
  drain();
}, {rootMargin: "700px 0px", threshold: 0});

/* justified rows, Pixieset-style */
/* one photo tile; w and h are set for justified rows, and left to the stylesheet for the tile grid */
function makeCell(a, w, h){
  var c = document.createElement("div");
  c.className = "cell";
  if (w){ c.style.width = w + "px"; c.style.height = h + "px"; c.style.flex = "0 0 auto"; }
  c.dataset.idx = a._i;
  var bg = hashColor(a.hash);
  if (bg) c.style.background = bg;
  var im = document.createElement("img");
  im.decoding = "async"; im.alt = "";
  im.dataset.src = imgUrl(a.id, "thumbnail");
  im.addEventListener("load", function(){ im.classList.add("in"); });
  c.appendChild(im);
  io.observe(im);
  if (!a.isImage){
    var v = document.createElement("div"); v.className="vid";
    v.innerHTML = '<span>&#9654;</span>'; c.appendChild(v);
  }
  var hb = document.createElement("button");
  hb.dataset.id = a.id;
  hb.className = "heart" + (favs[a.id] ? " on" : "");
  hb.setAttribute("aria-label", "Favourite");
  hb.innerHTML = HEART;
  hb.addEventListener("click", function(ev){ ev.stopPropagation(); toggleFav(a.id, hb); });
  if (!SHARED) c.appendChild(hb);
  c.addEventListener("click", function(){ open(Number(c.dataset.idx)); });
  return c;
}

function layout(){
  var host = $("grid");
  pending = [];
  host.innerHTML = "";
  if (!shown().length){
    host.innerHTML = favOnly
      ? '<div class="msg" style="margin:90px auto"><h2>No favourites yet</h2><p>Tap the heart on a photo to build your list.</p></div>'
      : '<div class="msg" style="margin:90px auto"><h2>No photos yet</h2><p>This gallery is empty right now.</p></div>';
    return;
  }
  var rootStyle = getComputedStyle(document.documentElement);
  var cssNum = function(name, fallback){ var n = parseFloat(rootStyle.getPropertyValue(name)); return n >= 0 ? n : fallback; };
  var gap = cssNum("--gap", 10);
  var W = host.clientWidth - gap*2;
  lastW = host.clientWidth;
  /* a gallery design can swap the justified rows for an even grid of tiles; the grid itself is laid out by CSS */
  var mode = rootStyle.getPropertyValue("--ims-grid").trim();
  var tiles = mode === "tiles" || mode === "columns";
  host.className = tiles ? mode : "";
  var target = W < 620 ? Math.max(200, W*0.62) : (W < 1100 ? cssNum("--row-h-tablet", 260) : cssNum("--row-h", 330));
  var row = [], sum = 0;

  function flush(last){
    if (!row.length) return;
    var avail = W - gap*(row.length-1);
    var h = avail / sum;
    if (last) h = Math.min(h, target*1.35);
    var el = document.createElement("div"); el.className = "row";
    row.forEach(function(a){ el.appendChild(makeCell(a, a.ratio * h, h)); });
    host.appendChild(el);
    row = []; sum = 0;
  }

  /* columns: each photo goes into the shortest column, so the order still reads left to right
     along the top and then fills in whichever column has room, and the bottoms stay level */
  if (mode === "columns"){
    var minW = cssNum("--tile-min", 240);
    var n = Math.max(1, Math.floor((W + gap) / (minW + gap)));
    var cols = [], heights = [];
    for (var ci = 0; ci < n; ci++){
      var col = document.createElement("div"); col.className = "col";
      host.appendChild(col); cols.push(col); heights.push(0);
    }
    view.forEach(function(a,i){
      a._i = i;
      var c = makeCell(a);
      var r = a.ratio || 1;
      c.style.aspectRatio = String(r);
      var k = 0;
      for (var j = 1; j < n; j++) if (heights[j] < heights[k] - 0.001) k = j;
      cols[k].appendChild(c);
      heights[k] += 1 / r;   /* equal widths, so height is proportional to 1 / ratio */
    });
    return;
  }
  if (tiles){
    view.forEach(function(a,i){
      a._i = i;
      var c = makeCell(a);
      if (mode === "columns") c.style.aspectRatio = String(a.ratio || 1);   /* a column keeps each photo's own shape */
      host.appendChild(c);
    });
    return;
  }
  view.forEach(function(a,i){
    a._i = i;
    row.push(a); sum += a.ratio;
    if (sum * target >= W) flush(false);
  });

}
/* Only re-flow when the WIDTH changes. Mobile browsers fire resize when the
   address bar hides/shows, and rebuilding the grid there would reset scroll. */
var rt;
function maybeLayout(){
  var w = $("grid").clientWidth;
  if (w === lastW) return;
  clearTimeout(rt);
  rt = setTimeout(function(){
    var y = window.scrollY, docH = document.body.scrollHeight;
    layout();
    /* keep the viewer roughly where they were after a real re-flow */
    if (docH > 0) {
      var ratio = y / docH;
      window.scrollTo(0, Math.round(ratio * document.body.scrollHeight));
    }
  }, 160);
}
window.addEventListener("resize", maybeLayout);
window.addEventListener("orientationchange", function(){ setTimeout(maybeLayout, 250); });

/* ---------- cover cta ---------- */
$("coverCta").addEventListener("click", function(){
  $("hdr").scrollIntoView({behavior:"smooth", block:"start"});
});

/* ---------- lightbox ---------- */
function open(i){
  cur = i; document.body.classList.add("lb-open"); $("lb").classList.add("on");
  requestAnimationFrame(function(){ $("lb").classList.add("vis"); });
  lockScroll();
  /* Locking the body leaves the page unscrollable, which brings a phone's toolbars back and
     moves the visible area. Re-read it, and again once that has settled. */
  syncViewport();
  setTimeout(syncViewport, 150); setTimeout(syncViewport, 500);
  show();
}
function close(){
  stopSlides(); vqSeq++; vqMenuClose();
  $("lb").classList.remove("vis");
  setTimeout(function(){ $("lb").classList.remove("on"); $("lbStage").innerHTML=""; document.body.classList.remove("lb-open"); }, 260);
  unlockScroll();
  /* leave off at the photo last looked at, not where the lightbox was opened */
  var cell = document.querySelector('#grid .cell[data-idx="' + cur + '"]');
  if (cell){
    var r = cell.getBoundingClientRect(), vh = window.innerHeight;
    if (r.top < 0 || r.bottom > vh) window.scrollTo(0, Math.max(0, window.scrollY + r.top + r.height / 2 - vh / 2));
  }
}
function show(){
  var a = view[cur]; if (!a) return;
  lbZoomReset(false);
  $("lbIdx").textContent = (cur+1) + " / " + view.length;
  $("lbFav").classList.toggle("on", !!favs[a.id]);
  var st = $("lbStage"); st.innerHTML = "";
  vqMenuClose(); $("lbQ").classList.remove("on");
  if (a.isImage){
    var im = document.createElement("img");
    im.src = imgUrl(a.id, "thumbnail");
    st.appendChild(im);
    var hi = new Image();
    hi.onload = function(){ im.src = hi.src; };
    hi.src = imgUrl(a.id, "preview");
    // preload neighbours so arrowing through feels instant
    [cur+1, cur-1].forEach(function(j){
      var b = view[(j + view.length) % view.length];
      if (b && b.isImage) { var pf = new Image(); pf.src = imgUrl(b.id, "preview"); }
    });

       whole file down first. `video` is Immich's playback copy (smaller once it has been
       transcoded); `video-orig` is the original file and follows the download rule. */

/* ---------- video quality: Auto / Data saver / Original ---------- */

}

    try { if (t > 0) v.currentTime = t; } catch(e){}

}
function vqPaint(){

  vqNow = pref === "orig" ? "orig" : "small";

    clearTimeout(timer);

    if (!m.big || m.big === m.small) return;                 /* no lighter copy exists: nothing to switch to */
    var go = function(){

    var stalls = [];
    v.addEventListener("waiting", function onw(){

      var now = Date.now(); stalls = stalls.filter(function(x){ return now - x < 30000; }); stalls.push(now);
      if (stalls.length >= 2) { v.removeEventListener("waiting", onw); vqSet(v, "small"); }
    });
  }
}
function vqMenuClose(){ $("lbQm").classList.remove("on"); $("lbQ").setAttribute("aria-expanded","false"); }

    var sub = k === "auto" ? "Picks for your connection" : k === "small" ? "Lighter, plays on mobile data" : "Full file, needs a fast connection";
    return '<button type="button" role="menuitem" data-q="'+k+'"'+(k === pref ? ' class="on"' : '')+'>'+VQ[k]+'<small>'+sub+'</small></button>';

    v.addEventListener("loadedmetadata", function(){ try { if (t > 0) v.currentTime = t; } catch(er){} if (!paused) { var pr = v.play(); if (pr && pr.catch) pr.catch(function(){}); } }, {once:true}); }
  else vqSet(v, k);
});
document.addEventListener("click", function(){ vqMenuClose(); });
function step(d){ if (!view.length) return; cur = (cur + d + view.length) % view.length; show(); }

/* ---------- touch: swipe between photos, pinch to zoom, drag once zoomed ----------
   The zoom works on the preview already on screen - a sharper file is a slow download
   on the phone where this gesture lives, and at these sizes it does not show. */
var lbZoomReset = function(){};
(function(){
  var stage = $("lbStage"), MAX = 5;
  var sc = 1, tx = 0, ty = 0;
  var mode = null, x0 = 0, y0 = 0, tx0 = 0, ty0 = 0, d0 = 0, s0 = 1, fx = 0, fy = 0;
  var lastTap = 0, moved = false;

  function img(){ return stage.querySelector("img"); }
  function paint(anim){
    var im = img(); if (!im) return;
    im.style.transition = anim ? "transform .2s" : "";
    im.style.transform = sc === 1 ? "" : "translate(" + tx + "px," + ty + "px) scale(" + sc + ")";
  }
  function bound(){
    var im = img(); if (!im) return;
    var ex = Math.max(0, (im.clientWidth  * sc - stage.clientWidth)  / 2);
    var ey = Math.max(0, (im.clientHeight * sc - stage.clientHeight) / 2);
    tx = Math.max(-ex, Math.min(ex, tx));
    ty = Math.max(-ey, Math.min(ey, ty));
  }
  function reset(anim){ sc = 1; tx = ty = 0; paint(anim); }
  lbZoomReset = reset;
  window.lbZoomed = function(){ return sc > 1; };

  function centre(){ var r = stage.getBoundingClientRect(); return { x:r.left + r.width/2, y:r.top + r.height/2 }; }
  function gap(e){
    var dx = e.touches[0].clientX - e.touches[1].clientX, dy = e.touches[0].clientY - e.touches[1].clientY;
    return Math.sqrt(dx*dx + dy*dy);
  }
  /* keep the point under the fingers where it is while the scale changes */
  function zoomAbout(next, px, py){
    var c = centre(), f = { x: px - c.x, y: py - c.y };
    tx = f.x - (f.x - tx) * (next / sc);
    ty = f.y - (f.y - ty) * (next / sc);
    sc = next;
    bound();
  }

  stage.addEventListener("touchstart", function(e){
    if (!img()) return;                                  /* video keeps its own controls */
    if (e.touches.length === 2){
      mode = "pinch"; moved = true;
      d0 = gap(e); s0 = sc;
      var c = centre();
      fx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      fy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      tx0 = tx; ty0 = ty;
      return;
    }
    if (e.touches.length === 1){
      moved = false;
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
      tx0 = tx; ty0 = ty;
      mode = sc > 1 ? "pan" : "swipe";
    }
  }, {passive:true});

  stage.addEventListener("touchmove", function(e){
    if (!img()) return;
    if (mode === "pinch" && e.touches.length === 2){
      var k = gap(e) / (d0 || 1);
      var next = Math.max(1, Math.min(MAX, s0 * k));
      var c = centre(), f = { x: fx - c.x, y: fy - c.y };
      tx = f.x - (f.x - tx0) * (next / s0);
      ty = f.y - (f.y - ty0) * (next / s0);
      sc = next; bound(); paint();
      return;
    }
    if (mode === "pan" && e.touches.length === 1){
      tx = tx0 + (e.touches[0].clientX - x0);
      ty = ty0 + (e.touches[0].clientY - y0);
      moved = true; bound(); paint();
      return;
    }
    if (mode === "swipe" && e.touches.length === 1){
      if (Math.abs(e.touches[0].clientX - x0) > 8 || Math.abs(e.touches[0].clientY - y0) > 8) moved = true;
    }
  }, {passive:true});

  /* the overlay itself never scrolls or page-zooms; every gesture above is ours */
  $("lb").addEventListener("touchmove", function(e){ if (e.cancelable) e.preventDefault(); }, {passive:false});

  stage.addEventListener("touchend", function(e){
    if (!img()){ mode = null; return; }
    if (mode === "pinch"){
      if (sc <= 1.03) reset(true); else paint();
      mode = e.touches.length ? "pan" : null;
      return;
    }
    if (mode === "swipe" && e.changedTouches.length){
      var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { mode = null; return step(dx < 0 ? 1 : -1); }
    }
    /* double tap toggles a close look, centred where the finger landed */
    if (!moved && e.changedTouches.length){
      var now = Date.now();
      if (now - lastTap < 300){
        if (sc > 1) reset(true);
        else { zoomAbout(2.5, e.changedTouches[0].clientX, e.changedTouches[0].clientY); paint(true); }
        lastTap = 0;
      } else lastTap = now;
    }
    mode = null;
  }, {passive:true});
})();

/* The toolbars on a phone browser slide in and out; visualViewport is the only thing
   that reports what is actually on screen while they do. --lbh is how tall the visible
   area is, --lbt how far down it starts. */
function syncViewport(){
  var vv = window.visualViewport;
  var s = document.documentElement.style;
  s.setProperty("--lbh", Math.round(vv ? vv.height : window.innerHeight) + "px");
  s.setProperty("--lbt", Math.round(vv ? vv.offsetTop : 0) + "px");
}
(function(){
  var vv = window.visualViewport;
  syncViewport();
  if (vv){ vv.addEventListener("resize", syncViewport); vv.addEventListener("scroll", syncViewport); }
  window.addEventListener("orientationchange", function(){ setTimeout(syncViewport, 250); });
  window.addEventListener("resize", syncViewport);
})();

/* ---------- slideshow ---------- */
function startSlides(){
  if (slideTimer) return stopSlides();
  if (!$("lb").classList.contains("on")) open(0);
  slideTimer = setInterval(function(){ step(1); }, 3800);
  toast("Slideshow started");
}
function stopSlides(){ if (slideTimer){ clearInterval(slideTimer); slideTimer=null; } }
$("btnFav").addEventListener("click", function(){
  if (!favOnly && !favCount()) return toast("Tap the heart on a photo to start a list");
  favOnly = !favOnly; render(); paintFavUi();
});

/* ---------- share ---------- */
var shareLink = null;   /* set while the dialog is sharing the client's favourites rather than the gallery */
function shareUrl(){ return shareLink || (location.origin + location.pathname + (SHARED ? "?picks=" + SHARED : "")); }
function shareOpen(){
  $("shareT").textContent = shareLink ? "Share your favourites" : "Share";
  $("shareUrl").value = shareUrl();
  $("share").classList.add("on");
  $("shareCopy").textContent = "Copy";
}
function shareClose(){ $("share").classList.remove("on"); shareLink = null; }
function copyText(t){
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t);
  return new Promise(function(ok, no){
    var i = $("shareUrl"); i.focus(); i.select();
    try { document.execCommand("copy") ? ok() : no(); } catch(e){ no(e); }
  });
}
function shareCopy(msg){
  copyText(shareUrl()).then(function(){
    $("shareCopy").textContent = "Copied";
    if (msg) toast(msg);
  }, function(){ $("shareUrl").select(); toast("Press copy on your keyboard to copy the link"); });
}
function shareVia(via){
  var u = encodeURIComponent(shareUrl()), t = encodeURIComponent(((album && album.albumName) || "Gallery") + (BRAND.name ? " by " + BRAND.name : ""));
  var tu = encodeURIComponent(((album && album.albumName) || "Gallery") + " " + shareUrl());
  var go = function(url){ window.open(url, "_blank", "noopener"); };
  if (via === "whatsapp") go("https://wa.me/?text=" + tu);
  else if (via === "facebook") go("https://www.facebook.com/sharer/sharer.php?u=" + u);
  else if (via === "email") location.href = "mailto:?subject=" + t + "&body=" + u;
  else if (via === "x") go("https://twitter.com/intent/tweet?url=" + u + "&text=" + t);
  else if (via === "threads") go("https://www.threads.net/intent/post?text=" + tu);
  else if (via === "pinterest"){
    var m = link && link.cover ? encodeURIComponent(new URL(link.cover, location.href).href) : "";
    go("https://www.pinterest.com/pin/create/button/?url=" + u + (m ? "&media=" + m : "") + "&description=" + t);
  }
  else if (via === "messenger"){
    if (window.matchMedia("(pointer:coarse)").matches) location.href = "fb-messenger://share/?link=" + u;
    else shareCopy("Link copied \u2014 paste it into Messenger");
  }
  else if (via === "more"){
    if (navigator.share) navigator.share({ title: (album && album.albumName) || "Gallery", url: shareUrl() }).catch(function(){});
    else shareCopy("Link copied");
  }
}
$("btnShare").addEventListener("click", function(){ shareLink = null; shareOpen(); });
$("btnShareFav").addEventListener("click", function(){
  postJSON("/favourites/share", {}).then(function(r){
    if (!r.ok || !r.body || !r.body.path) return toast(r.body && r.body.error === "no_picks" ? "Heart a photo first" : "Couldn't make the link");
    shareLink = location.origin + r.body.path;
    shareOpen();
  }).catch(function(){ toast("Couldn't make the link"); });
});
$("shareX").addEventListener("click", shareClose);
$("share").addEventListener("click", function(e){ if (e.target === $("share")) shareClose(); });
$("shareCopy").addEventListener("click", function(){ shareCopy(); });
$("shareUrl").addEventListener("focus", function(){ this.select(); });
$("shareGrid").addEventListener("click", function(e){ var b = e.target.closest("button"); if (b) shareVia(b.dataset.via); });
document.addEventListener("keydown", function(e){ if (e.key === "Escape" && $("share").classList.contains("on")){ shareClose(); e.stopPropagation(); } }, true);

/* ---------- downloads ---------- */
function filenameFrom(r, i){
  var cd = r.headers.get("content-disposition") || "";
  var m = /filename\*=UTF-8''([^;]+)/i.exec(cd);
  if (m) { try { return decodeURIComponent(m[1]); } catch(e){} }
  m = /filename="?([^";]+)"?/i.exec(cd);
  if (m) return m[1];
  return "photo-" + (i+1) + ".jpg";
}
function saveBlob(b, name){
  var u = URL.createObjectURL(b);
  var el = document.createElement("a");
  el.href = u; el.download = name;
  document.body.appendChild(el); el.click(); el.remove();
  setTimeout(function(){ URL.revokeObjectURL(u); }, 5000);
}
function dlOne(size){
  var a = view[cur]; if (!a) return;
  var web = size === "web";
  progOpen("Preparing your photo",
           web ? "A web-sized copy, good for sharing." : "Full-size photos can take a moment on a mobile connection.",
           function(){ if (dlAbort) dlAbort.abort(); });
  fetchProgress(imgUrl(a.id, web ? "web" : "original"), {}, progSet).then(function(o){
    progClose();
    var nm = o.name || "photo.jpg";
    if (web) nm = nm.replace(/(\.[^.]+)?$/, "-web.jpg");
    saveBlob(o.blob, nm);
    toast("Download started");
  }).catch(function(e){
    progClose();
    if (e && e.name === "AbortError") { toast("Download cancelled"); return; }
    toast("Download failed \u2014 please try again");
  });
}

/* two sizes, because a client on a phone rarely wants the twenty-megabyte one */
/* A video has no "web size": that copy is a still frame, which is how a download came back as a
   .jpg. There is one choice, the file itself, and it goes straight to the browser's own
   downloader - a video can be a gigabyte, too much to hold in the page's memory as a blob. */
function dlVideo(a){
  var el = document.createElement("a");
  el.href = imgUrl(a.id, "original") + "&via=dropbox"; el.download = "";
  document.body.appendChild(el); el.click(); el.remove();
  toast("Download started");
}
function dlMenu(anchor){
  var old = $("dlpop"); if (old){ old.remove(); return; }
  var cv = view[cur]; if (cv && !cv.isImage) return dlVideo(cv);
  var m = document.createElement("div");
  m.id = "dlpop"; m.className = "dlpop";
  m.innerHTML = '<button data-s="web">Web size<small>Quick, good for sharing</small></button>'
              + '<button data-s="original">Full resolution<small>The original file</small></button>';
  document.getElementById("lb").appendChild(m);
  var r = anchor.getBoundingClientRect();
  m.style.top = (r.bottom + 8) + "px";
  m.style.right = Math.max(8, window.innerWidth - r.right) + "px";
  m.onclick = function(ev){
    var b = ev.target.closest("button"); if (!b) return;
    m.remove(); dlOne(b.dataset.s);
  };
  setTimeout(function(){
    document.addEventListener("click", function away(ev){
      if (!ev.target.closest("#dlpop") && ev.target !== anchor){ var p = $("dlpop"); if (p) p.remove(); }
      document.removeEventListener("click", away, true);
    }, true);
  }, 0);
}
$("lbDl").addEventListener("click", function(){ dlMenu($("lbDl")); });
$("mDl").addEventListener("click", function(){ dlMenu($("mDl")); });

/* mobile: Web Share API -> iOS share sheet -> Save Image */
function shareOne(){
  var a = view[cur]; if (!a) return;
  /* The share sheet needs the whole file as a blob in memory. A long video is a gigabyte, which
     is more than a phone tab survives (it shows "Can't open this page"), so a big one goes to the
     browser's own downloader instead and the person adds it to Photos from Files. */
  if (!a.isImage && !shareCache[a.id]){
    fetch(imgUrl(a.id, "original"), {credentials:"same-origin", headers:{range:"bytes=0-0"}}).then(function(r){
      var m = /\/(\d+)$/.exec(r.headers.get("content-range") || "");
      var big = !m || Number(m[1]) > 150 * 1048576;
      if (big){
        dlVideo(a);
        toast("Large video \u2014 saving to Downloads. Open Files to add it to Photos");
      } else shareFile(a);
    }).catch(function(){ shareFile(a); });
    return;
  }
  shareFile(a);
}
function shareFile(a){
  var cached = shareCache[a.id];
  if (cached && navigator.canShare && navigator.canShare({files:[cached]})) {
    navigator.share({files:[cached]}).catch(function(e){
      if (e && e.name === "AbortError") return;
      toast("Couldn't open the share sheet");
    });
    return;
  }
  progOpen("Preparing your photo", "Fetching the full-size original. This can take a moment.",
           function(){ if (dlAbort) dlAbort.abort(); });
  fetchProgress(imgUrl(a.id, "original"), {}, progSet).then(function(o){
    progClose();
    var f = null;
    try { f = new File([o.blob], o.name || "photo.jpg", {type:o.type || "image/jpeg"}); } catch(e){}
    if (f) shareCache[a.id] = f;
    if (f && navigator.canShare && navigator.canShare({files:[f]})) {
      navigator.share({files:[f]}).catch(function(e){
        if (e && e.name === "AbortError") return;
        toast("Ready \u2014 tap Save to Photos again");
      });
    } else {
      saveBlob(o.blob, o.name || "photo.jpg");
    }
  }).catch(function(e){
    progClose();
    if (e && e.name === "AbortError") { toast("Cancelled"); return; }
    toast("Couldn't prepare that photo");
  });
}
$("mSave").addEventListener("click", shareOne);

/* whole gallery as a zip. The server prepares it ahead of time and lets a few people download
   at once, so this asks, shows where we are in line, and hands the browser a plain link:
   the browser's own downloader then shows progress, and can resume if the connection drops. */
function ordinal(n){ var v = n % 100; return n + (["th","st","nd","rd"][(v - 20) % 10] || ["th","st","nd","rd"][v] || "th"); }
function startLink(url){
  var el = document.createElement("a");
  el.href = url; el.download = "";
  document.body.appendChild(el); el.click(); el.remove();
}
$("btnAll").addEventListener("click", function(){
  if (!view.length || $("btnAll").hasAttribute("disabled")) return;
  var sets = (link && link.sets) || [];
  var qs = SHARED ? "?picks=" + SHARED : favOnly ? "?picks=1" : (sets.length > 1 && curSet ? "?set=" + encodeURIComponent(curSet) : "");
  var ticket = null, timer = null, stopped = false, tries = 0;

  function end(){ stopped = true; clearTimeout(timer); progClose(); }
  function cancel(){
    if (ticket) fetch(BASE + "/zip?t=" + ticket, {method:"DELETE", credentials:"include"}).catch(function(){});
    end();
  }
  function show(info){
    var bar = document.querySelector(".pbar");
    $("prog").classList.remove("ready");
    if (info.state === "building"){
      $("progTitle").textContent = "Preparing your download";
      $("progMsg").textContent = "We're packing the photos into one file. This only happens the first time. Please keep this page open.";
      var b = info.building;
      if (b && b.total > 0){
        bar.classList.remove("indet");
        $("progBar").style.width = Math.min(100, b.done / b.total * 100) + "%";
        $("progStat").textContent = Math.min(99, Math.round(b.done / b.total * 100)) + "%";
      } else { bar.classList.add("indet"); $("progStat").textContent = "Starting\u2026"; }
    } else if (info.state === "queued"){
      $("progTitle").textContent = "You\u2019re in line";
      $("progMsg").textContent = "Downloads start one at a time so each one runs at full speed. Please keep this page open.";
      bar.classList.add("indet");
      $("progStat").textContent = "You\u2019re " + ordinal(info.position || 1) + " in line";
    }
  }
  function ready(info){
    end();
    toast("Your download is starting \u2014 check your browser\u2019s downloads list");
    startLink(BASE + "/" + info.url);
  }
  function handle(info){
    if (stopped) return;
    ticket = info.ticket;
    if (info.state === "ready"){
      /* the browser only allows a download from a real tap, so after a wait we ask for one */
      if (tries === 0) return ready(info);
      $("prog").classList.add("ready");
      $("progTitle").textContent = "Your download is ready";
      $("progMsg").textContent = info.bytes ? "About " + mb(info.bytes) + ". Tap to start it." : "Tap to start it.";
      $("progStat").textContent = "";
      $("progGo").onclick = function(){ ready(info); };
      return;
    }
    show(info);
    timer = setTimeout(poll, 3000);
  }
  function poll(){
    tries++;
    fetch(BASE + "/zip/status?t=" + ticket, {credentials:"include"}).then(function(r){
      if (r.status === 404) return post();           /* our place was given up; join the line again */
      if (!r.ok) throw new Error("http " + r.status);
      return r.json().then(handle);
    }).catch(function(){ if (!stopped) timer = setTimeout(poll, 5000); });
  }
  function post(){
    return fetch(BASE + "/zip" + qs, {method:"POST", credentials:"include"}).then(function(r){
      if (!r.ok) throw new Error("http " + r.status);
      return r.json();
    }).then(handle).catch(function(){
      if (stopped) return;
      end(); toast("Download failed \u2014 please try again");
    });
  }

  progOpen("Preparing your download", "Checking on your download\u2026", cancel);
  post();
});

(function(){
  var b = document.getElementById("toTop"), on = false;
  function upd(){ var v = (window.pageYOffset || document.documentElement.scrollTop) > 700; if (v !== on){ on = v; b.classList.toggle("on", v); } }
  window.addEventListener("scroll", upd, {passive:true});
  b.addEventListener("click", function(){ window.scrollTo({top:0, behavior:"smooth"}); });
  upd();
})();

})();
